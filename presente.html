<style>
html,body{margin:0;height:100%;background:#F4F6F3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1B4332}
.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.s{width:34px;height:34px;border:3px solid #E8ECE6;border-top-color:#1B4332;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a{display:inline-block;margin-top:6px;background:#1B4332;color:#fff;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="c">
  <div class="s"></div>
  <div style="font-size:15px;font-weight:700">Preparando seu presente…</div>
  <a id="ir" href="/">Abrir o CultivAI</a>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var c = (p.get('c') || p.get('codigo') || '').trim();
  var destino = c ? ('/?presente=' + encodeURIComponent(c)) : '/';
  document.getElementById('ir').setAttribute('href', destino);
  setTimeout(function(){ location.replace(destino); }, 350);
})();
</script>
</body>
