function tempoAtras(iso){const d=new Date(iso);const diffMs=Date.now()-d.getTime();const diffH=diffMs/3600000;if(diffH<24){if(d.toDateString()===new Date().toDateString())return`Hoje às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;const ontem=new Date();ontem.setDate(ontem.getDate()-1);if(d.toDateString()===ontem.toDateString())return`Ontem às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;}const diffDias=Math.floor(diffH/24);if(diffDias<1)return'Hoje';if(diffDias===1)return'Há 1 dia';if(diffDias<30)return`Há ${diffDias} dias`;return d.toLocaleDateString('pt-BR');}

function gerarDicasClima(dias){if(!dias||!dias.length)return[];const dicas=[];const diaSemana=iso=>new Date(iso+'T12:00').toLocaleDateString('pt-BR',{weekday:'long'});const diaGeada=dias.find(d=>d.min<=3);const diaChuvaForte=dias.find(d=>d.chuva>=20);const diaVentoForte=dias.find(d=>(d.vento||0)>=40);const diaCalor=dias.find(d=>d.max>=33);const chuvaTotal=dias.reduce((s,d)=>s+(d.chuva||0),0);const semChuva=chuvaTotal<3;const amplitudeAlta=dias.find(d=>(d.max-d.min)>=15);if(diaGeada)dicas.push({icon:'❄️',texto:`Risco de geada ${diaGeada===dias[0]?'hoje':'na '+diaSemana(diaGeada.data)}. Proteja mudas sensíveis.`});if(diaChuvaForte)dicas.push({icon:'🌧️',texto:`Chuva forte ${diaSemana(diaChuvaForte.data)} (${Math.round(diaChuvaForte.chuva)}mm). Não aplique defensivo nesse dia.`});if(diaVentoForte)dicas.push({icon:'💨',texto:`Vento forte ${diaSemana(diaVentoForte.data)} (~${Math.round(diaVentoForte.vento)}km/h). Evite pulverizar.`});if(diaCalor)dicas.push({icon:'🌡️',texto:`Calor intenso previsto (${Math.round(diaCalor.max)}°C). Regue no fim da tarde ou à noite.`});if(semChuva&&!diaGeada)dicas.push({icon:'💧',texto:'Sem chuva relevante nos próximos dias. Monitore a umidade do solo.'});if(amplitudeAlta&&!diaGeada)dicas.push({icon:'📉',texto:`Grande variação térmica (${Math.round(amplitudeAlta.max)}°/${Math.round(amplitudeAlta.min)}°). Atenção a culturas sensíveis.`});if(dicas.length===0)dicas.push({icon:'✅',texto:'Condições estáveis. Boa janela para plantio e manejo em geral.'});return dicas.slice(0,2);}

function PieChartSVG({data,size=140}){const total=data.reduce((a,d)=>a+d.value,0);if(total<=0)return(<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:size,fontSize:11,color:'#A3AD9D'}}>Sem dados ainda</div>);const stroke=size*0.22;const r=(size-stroke)/2-2;const cx=size/2,cy=size/2;const circ=2*Math.PI*r;let acc=0;const segs=data.filter(d=>d.value>0).map(d=>{const frac=d.value/total;const len=frac*circ;const seg={...d,dasharray:`${len} ${circ-len}`,offset:-acc*circ,pct:frac*100};acc+=frac;return seg;});return(<div style={{display:'flex',alignItems:'center',gap:16}}><svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0,transform:'rotate(-90deg)',overflow:'visible'}}>{segs.map((s,i)=>(<circle key={i} cx={cx} cy={cy} r={r} fill='none' stroke={s.color} strokeWidth={stroke} strokeDasharray={s.dasharray} strokeDashoffset={s.offset} />))}</svg><div style={{display:'flex',flexDirection:'column',gap:6,flex:1,minWidth:0}}>{segs.map((s,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:7}}><span style={{width:9,height:9,borderRadius:3,background:s.color,flexShrink:0}} /><span style={{fontSize:10.5,color:'#5A6857',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.label}</span><span style={{fontSize:10.5,fontWeight:700,color:'#1B4332'}}>{s.pct.toFixed(0)}%</span></div>))}</div></div>);}

✨ IA recomenda</div><div style={{position:'absolute',top:10,right:10,background:'rgba(255,255,255,.92)',borderRadius:99,padding:'4px 10px',fontSize:11.5,fontWeight:600,color:'#1B4332'}}>{p.pct}%</div><div style={{position:'absolute',bottom:10,left:14,right:14}}><div style={{fontSize:15,fontWeight:600,color:'#fff'}}>{p.cultura.emoji} {p.cultura.nome}</div></div></CardFoto><div style={{padding:'13px 15px 15px'}}>{p.proximaEtapa&&<><div style={{fontSize:10.5,color:'#A3AD9D',fontWeight:500,textTransform:'uppercase',letterSpacing:'.03em'}}>Próxima etapa</div><div style={{fontSize:13,fontWeight:500,color:'#1B4332',marginTop:2}}>{p.proximaEtapa}</div></>}<div style={{height:3,borderRadius:99,background:'#EFF3EC',marginTop:10,overflow:'hidden'}}><div style={{height:'100%',width:`${p.pct}%`,background:'#4ADE80',borderRadius:99}} /></div></div></div>))}</div></div>)}</div><div style={{padding:'34px 22px 12px'}}><img src='https://raw.githubusercontent.com/orbicorporate/easyfarm/main/planejamento-banner.jpg' alt='Planeje sua próxima cultura' style={{width:'100%',display:'block',borderRadius:20,boxShadow:'0 14px 30px -12px rgba(11,45,31,.35)'}} /></div><div id='escolha-cultura' style={{padding:'22px 22px 0'}}><div style={{display:'flex',alignItems:'center',gap:9,marginBottom:14}}><div style={{width:24,height:24,borderRadius:8,background:'#1B4332',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff'}}>1</div><div style={{fontSize:15,fontWeight:800,color:'#1B4332'}}>Escolha sua região</div></div><div style={{display:'flex',gap:12,overflowX:'auto',margin:'0 -22px',padding:'0 22px 4px'}}>{REGIOES.map(r=>(<RegiaoCard key={r.id} r={r} sel={regiaoId===r.id} onClick={()=>selecionarRegiao(r.id)} />))}</div></div><div id='tour-categorias' style={{padding:'34px 22px 0'}}><div style={{fontSize:12,color:'#8A9584',fontWeight:600,marginBottom:10}}>Outros tipos de cultura para qualquer região e tamanho</div><div style={{display:'flex',gap:12,overflowX:'auto',margin:'0 -22px',padding:'0 22px 4px'}}><CategoriaCard cat={VERDURAS} sel={catSel==='verduras'} onClick={()=>selecionarCat('verduras')} /><CategoriaCard cat={TEMPEROS} sel={catSel==='temperos'} onClick={()=>selecionarCat('temperos')} /><CategoriaCard cat={COGUMELOS} sel={catSel==='cogumelos'} onClick={()=>selecionarCat('cogumelos')} /><CategoriaCard cat={APICULTURA} sel={catSel==='apicultura'} onClick={()=>selecionarCat('apicultura')} /><CategoriaCard cat={FLORES} sel={catSel==='flores'} onClick={()=>selecionarCat('flores')} /><CategoriaCard cat={HIDROPONIA} sel={catSel==='hidroponia'} onClick={()=>selecionarCat('hidroponia')} /><CategoriaCard cat={SILVICULTURA} sel={catSel==='silvicultura'} onClick={()=>selecionarCat('silvicultura')} /></div></div><div id='tour-todas-culturas' style={{padding:'18px 22px 0'}}><button onClick={()=>selecionarCat('todas')} style={{width:'100%',background:'linear-gradient(135deg,#1B4332,#14532D)',border:'none',borderRadius:14,padding:'15px 16px',boxShadow:'0 6px 18px rgba(27,67,50,.3)'}}><div style={{fontSize:13.5,fontWeight:800,color:'#fff'}}>Abrir todas as culturas ({TODAS_MERGED.length})</div></button></div>{!regiao&&!cat&&!todasView&&(<div style={{margin:'22px',background:'linear-gradient(150deg,#EAF0E7,#F4F6F3)',borderRadius:22,padding:'34px 26px',textAlign:'center',border:'1px solid #E2E9DE'}}><div style={{fontSize:14,color:'#4B5563',lineHeight:1.65}}>As culturas <b style={{fontWeight:800}}>mais lucrativas de cada região</b> vão aparecer aqui com fotos e dados de lucro</div></div>)}{todasView&&(<div style={{padding:'24px 22px 0',animation:'fadeUp .3s ease both'}} key='todas'><div style={{display:'flex',alignItems:'center',gap:9,marginBottom:16}}><div style={{width:24,height:24,borderRadius:8,background:'#1B4332',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff'}}>🔎</div><div style={{fontSize:15,fontWeight:800,color:'#1B4332'}}>Todas as culturas, por lucratividade</div></div><div style={{display:'flex',flexDirection:'column',gap:16}}>{TODAS_MERGED.map((item,i)=>(<CulturaCard key={i} c={item.c} destaque={i===0} regiaoLabel={`${item.rg.emoji} ${item.rg.label}`} onClick={()=>onSelect(item.rg,item.c,0)} />))}</div></div>)}{regiao&&(<div style={{padding:'24px 22px 0',animation:'fadeUp .3s ease both'}} key={regiaoId}><div style={{display:'flex',alignItems:'center',gap:9,marginBottom:6}}><div style={{width:24,height:24,borderRadius:8,background:regiao.cor,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff'}}>2</div><div style={{fontSize:15,fontWeight:800,color:'#1B4332'}}>Culturas em {regiao.label}</div></div><div style={{display:'flex',gap:14,marginBottom:16,marginLeft:33}}><div style={{fontSize:12,color:'#8A9584'}}>🌡️ {regiao.temperatura}</div><div style={{fontSize:12,color:'#8A9584'}}>🌧️ {regiao.pluviosidade}</div></div><WeatherWidget regiaoId={regiao.id} userId={userId} cidadeSalva={cidadeSalva} onCidadeSalva={onCidadeSalva} /><div style={{display:'flex',flexDirection:'column',gap:16}}>{regiao.culturas.map((c,i)=>(<CulturaCard key={i} c={c} destaque={i===0} onClick={()=>onSelect(regiao,c,0)} />))}</div></div>)}{cat&&(<div style={{padding:'24px 22px 0',animation:'fadeUp .3s ease both'}} key={catSel}><div style={{display:'flex',alignItems:'center',gap:9,marginBottom:6}}><div style={{width:24,height:24,borderRadius:8,background:cat.cor,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff'}}>2</div><div style={{fontSize:15,fontWeight:800,color:'#1B4332'}}>{cat.label}. Qualquer região</div></div><div style={{fontSize:12,color:'#8A9584',marginBottom:16,marginLeft:33}}>{cat.descricao}</div><div style={{display:'flex',flexDirection:'column',gap:16}}>{cat.culturas.map((c,i)=>(<CulturaCard key={i} c={c} destaque={i===0} onClick={()=>onSelect(regiaoFake,c,0)} />))}</div></div>)}<ChatBubble onClick={irChat} /></div>);}
function CultureBadge({cultura,regiao,onClear,voltarLabel}){return(<div style={{position:'sticky',top:0,zIndex:100,background:'rgba(244,246,243,.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid #E8ECE6',padding:'12px 18px',display:'flex',alignItems:'center',gap:12}}><div style={{width:42,height:42,borderRadius:13,overflow:'hidden',flexShrink:0}}><CardFoto nome={cultura.nome} cor={cultura.cor} emoji={cultura.emoji} altura={42} /></div><div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800,color:'#1B4332'}}>{cultura.emoji} {cultura.nome}</div><div style={{fontSize:11,color:'#8A9584'}}>{regiao.emoji} {regiao.label} · <span style={{color:'#EA580C',fontWeight:700}}>{freqTexto(cultura)}</span></div></div><button onClick={onClear} style={{background:'linear-gradient(152deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.74) 20%, rgba(255,255,255,.86) 38%, rgba(250,252,249,.72) 66%, rgba(255,255,255,.8) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate(185%)',border:'1px solid #E8ECE6',borderRadius:10,padding:'8px 11px',fontSize:11,fontWeight:700,color:'#5A6857',display:'flex',alignItems:'center',gap:5,flexShrink:0,whiteSpace:'nowrap'}}><span style={{fontSize:12}}>←</span>{voltarLabel||'Página inicial'}</button></div>);}
function fichaLabels(cultura){const t=cultura.tipoCultivo;if(t==='cogumelo')return[['🌡️','Temperatura ideal'],['🧪','pH do substrato'],['📏','Espaçamento'],['💧','Umidade do ar']];if(t==='apicultura')return[['🌡️','Temp. ideal (colônia)'],['🍯','Umidade da colmeia'],['📏','Distância entre colmeias'],['🌼','Raio de floradas']];if(t==='hidroponia')return[['🌡️','Temperatura ideal'],['⚡','EC da solução'],['📏','Espaçamento no sistema'],['🧪','pH da solução']];return[['🌡️','Temperatura ideal'],['🧪','pH do solo'],['📏','Espaçamento'],['💧','Água por semana']];}
function gerarDicasComerciais(cultura){const nome=cultura.nome;const tipo=cultura.tipoCultivo;const perecivel=tipo==='cogumelo'||tipo==='hidroponia';const canais=[];if(tipo==='apicultura'){canais.push({t:'Feiras e venda direta',x:'Mel, própolis, geleia real e pólen vendem bem em feiras de produtor. O contato direto deixa o cliente ver o produto e conhecer sua história.'},{t:'Restaurantes e cafeterias',x:'Estabelecimentos que valorizam produto local pagam mais que o atacado por mel de origem rastreável.'},{t:'Distribuidores e cooperativas',x:'Pra volumes maiores, cooperativas de apicultores dão acesso a mercados que um produtor sozinho não alcança, além de ajudar com envase e selo de inspeção.'});}else if(tipo==='cogumelo'||tipo==='hidroponia'){canais.push({t:'Restaurantes (HORECA)',x:`${nome} fresco de qualidade tem forte apelo em restaurantes e chefs que valorizam frescor e regularidade de entrega.`},{t:'Feiras e mercados gourmet',x:'Feiras orgânicas e gourmet pagam mais que supermercado convencional, principalmente com apresentação caprichada.'},{t:'Venda direta (WhatsApp/redes sociais)',x:'Uma lista de clientes fiéis no WhatsApp, com entrega regular, já sustenta uma operação pequena sem depender de atravessador.'});}else{canais.push({t:'Feiras livres e de produtor',x:`Vender ${nome} direto na feira costuma pagar 2 a 3 vezes mais que vender pro atacado, porque corta o intermediário.`},{t:'Venda direta (WhatsApp e redes sociais)',x:'Uma lista de clientes fiéis no WhatsApp, com fotos da colheita, já é suficiente pra escoar boa parte da produção em pequena escala.'},{t:'Cooperativas e associações',x:'Se juntar a outros produtores da região aumenta o poder de negociação e abre acesso a compradores maiores (varejo, indústria).'},{t:'Atacado e agroindústria',x:'Pra volume maior, vender pra agroindústria ou atacadista garante escoamento certo, mas com margem menor por unidade — bom pra quem prioriza previsibilidade sobre lucro máximo.'});}const precificacao={t:'Como precificar sem perder dinheiro',x:`Calcule o custo real de produzir ${nome} (implantação + manejo + mão de obra, já disponível na Calculadora) e defina um preço mínimo que cubra isso com folga. Pesquise o preço de mercado na sua região antes de fechar — pergunte em feiras, grupos de produtores ou observe o que o mesmo produto custa no supermercado. Nunca combine preço na hora da entrega: isso deixa você na mão do comprador. Defina o valor antes, por telefone ou mensagem.`};const aquisicao={t:'Como conseguir os primeiros clientes',x:'Comece pelo círculo próximo: vizinhos, grupos de WhatsApp do bairro ou da cidade, e feiras locais. Fotos boas (luz natural, produto limpo) valem mais que qualquer texto de venda. Ofereça uma amostra pequena pra quem nunca comprou — é comum a primeira compra vir de uma degustação ou de um preço promocional de apresentação. Peça indicação pra quem já comprou; cliente satisfeito traz cliente novo sem custo nenhum.'};const fidelizacao={t:'Fidelização e recorrência',x:'É mais barato manter um cliente que já compra do que conseguir um novo. Um grupo de transmissão no WhatsApp avisando quando a colheita está pronta já garante recompra. Combine um dia fixo de entrega (ex: toda sexta) — isso cria rotina e o cliente passa a contar com você. Embalagem com identidade (nome, contato, foto) faz o cliente lembrar de você na próxima compra, mesmo sem intenção de venda.'};const embalagem={t:'Embalagem e apresentação',x:perecivel?`${nome} exige cuidado extra: embale logo após a colheita, mantenha refrigerado quando possível e venda em poucos dias pra garantir frescor. Embalagem transparente ajuda o cliente a ver a qualidade do produto.`:`Mesmo sem embalagem sofisticada, algo simples com seu nome e contato já diferencia ${nome} de um produto anônimo de supermercado. Isso justifica preço melhor e ajuda na indicação boca a boca.`};const erros={t:'Erros comuns que corroem a margem',x:'Vender sem calcular o custo real (o produtor "sente" que está lucrando, mas não sabe o número exato). Depender de um único comprador, que passa a ditar o preço por falta de alternativa. Não combinar o preço antes da entrega. Não ter nenhum registro de quem são os clientes, perdendo a chance de vender de novo pra quem já comprou.'};return[{icon:'📣',titulo:'Canais de venda',lista:canais},{icon:'💵',titulo:precificacao.t,texto:precificacao.x},{icon:'🤝',titulo:aquisicao.t,texto:aquisicao.x},{icon:'🔁',titulo:fidelizacao.t,texto:fidelizacao.x},{icon:'📦',titulo:embalagem.t,texto:embalagem.x},{icon:'⚠️',titulo:erros.t,texto:erros.x}];}
function GuiaScreen({cultura,regiao,onIrTela}){const[expandido,setExpandido]=useState(null);const[expandidoComercial,setExpandidoComercial]=useState(null);const[abaGuia,setAbaGuia]=useState('cultivo');const dicasComerciais=gerarDicasComerciais(cultura);const d=[{i:'💧',c:'#3B82F6',t:'Irrigação adequada',x:`Manejo hídrico crítico para ${cultura.nome}. Use gotejamento para máxima eficiência.`,mais:'O momento certo de irrigar é de manhã bem cedo ou fim de tarde, evitando o sol forte (a água evapora antes de fazer efeito). Gotejamento entrega água direto na raiz e gasta até 40% menos que aspersão. Folha amarelada com fungo na base geralmente é excesso de água; folha murcha com solo aparentemente ok geralmente é falta.'},{i:'🧪',c:'#F97316',t:'Análise de solo',x:'Faça antes de plantar. Custa R$ 30–50 e define o sucesso da cultura.',mais:'O laudo mostra pH e os teores de fósforo, potássio, cálcio, magnésio e matéria orgânica. Solo ácido (pH baixo) trava a absorção de nutrientes mesmo que você adube bastante. Por isso a calagem (calcário) normalmente vem antes da adubação, não junto. Refaça a análise a cada 1–2 anos, o solo muda com o tempo e o cultivo.'},{i:'🌱',c:'#22C55E',t:'Mudas certificadas',x:'Material genético de qualidade aumenta produtividade 20–40%.',mais:'Certificação do MAPA garante que a muda não carrega doença e tem a genética que promete. Material sem origem é a principal causa de pragas se espalhando entre produtores de uma mesma região. Guarde a nota fiscal e a etiqueta do lote. É sua garantia se aparecer algum problema depois.'},{i:'🔬',c:'#8B5CF6',t:'Monitoramento de pragas',x:'Inspeções semanais. Preventivo é mais barato que curativo. Adote o MIP.',mais:'MIP (Manejo Integrado de Pragas) significa monitorar antes de aplicar qualquer produto, agindo só quando o problema realmente ameaça a produção. Não ao primeiro inseto visto. Isso economiza em defensivo e evita que a praga vire resistente. Olhe embaixo das folhas também, não só por cima; é onde a maioria se esconde.'},{i:'📅',c:'#E84855',t:'Calendário agrícola',x:`Plante ${cultura.nome} na janela certa.`,mais:'Plantar fora da janela ideal é uma das causas mais comuns de baixa produtividade, mesmo com todo o resto certo. A janela considera temperatura, chuva esperada e o ciclo da cultura. Use o Calendário do app pra acompanhar as datas certas dessa cultura na sua região.'}];return(<div style={{paddingBottom:120,background:'transparent',minHeight:'100vh'}}><CardFoto nome={cultura.nome} cor={cultura.cor} emoji={cultura.emoji} altura={180}><div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(244,246,243,1),rgba(0,0,0,.2))'}} /><div style={{position:'absolute',bottom:16,left:22}}><div style={{fontSize:11,fontWeight:700,color:'#1B4332',textTransform:'uppercase',background:'rgba(255,255,255,.85)',display:'inline-block',padding:'3px 10px',borderRadius:8,marginBottom:8}}>Guia do Produtor</div><div className='serif' style={{fontSize:24,fontWeight:800,color:'#1B4332'}}>{cultura.emoji} {cultura.nome}</div></div></CardFoto><div style={{padding:'12px 22px 0',display:'flex',gap:8}}><button onClick={()=>setAbaGuia('cultivo')} style={{flex:1,padding:'10px',borderRadius:12,border:'none',fontSize:12.5,fontWeight:700,background:abaGuia==='cultivo'?'#1B4332':'rgba(255,255,255,.7)',color:abaGuia==='cultivo'?'#fff':'#5A6857'}}>🌱 Cultivo</button><button onClick={()=>setAbaGuia('comercial')} style={{flex:1,padding:'10px',borderRadius:12,border:'none',fontSize:12.5,fontWeight:700,background:abaGuia==='comercial'?'#1B4332':'rgba(255,255,255,.7)',color:abaGuia==='comercial'?'#fff':'#5A6857'}}>💰 Comercialização</button></div><div style={{padding:'8px 22px 0',display:'flex',flexDirection:'column',gap:12}}><div style={{background:'linear-gradient(152deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.74) 20%, rgba(255,255,255,.86) 38%, rgba(250,252,249,.72) 66%, rgba(255,255,255,.8) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate( ,marginBottom:4}}>{it.t}</div><div style={{fontSize:13,color:'#5A6857',lineHeight:1.75}}>{it.x}</div></div>))}</div>}<button onClick={()=>setExpandidoComercial(on?null:i)} style={{background:'none',border:'none',color:'#0891B2',fontSize:12.5,fontWeight:700,padding:on?'16px 0 0':'8px 0 0',cursor:'pointer'}}>{on?'Ver menos ▴':'Ver mais ▾'}</button></div>);})}</>)}<button onClick={()=>onIrTela&&onIrTela(5)} style={{width:'100%',background:'linear-gradient(152deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.74) 20%, rgba(255,255,255,.86) 38%, rgba(250,252,249,.72) 66%, rgba(255,255,255,.8) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate(185%)',border:'1.5px dashed #C0C9BC',borderRadius:14,padding:'13px 16px',display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:17}}>💬</span><span style={{fontSize:12,fontWeight:700,color:'#1B4332',flex:1,textAlign:'left'}}>Tem uma dúvida específica sobre {cultura.nome}? Pergunta pra Easy</span><span style={{color:'#A3AD9D'}}>→</span></button><div style={{background:'linear-gradient(135deg,#1B4332,#14532D)',borderRadius:18,padding:'20px',textAlign:'center',marginTop:4}}><div style={{fontSize:13,fontWeight:800,color:'#fff',marginBottom:4}}>Terminou de ler?</div><div style={{fontSize:11.5,color:'rgba(255,255,255,.75)',marginBottom:14}}>Hora de montar seu plano de produção e sair do papel.</div><button onClick={()=>onIrTela&&onIrTela(2)} style={{width:'100%',background:'rgba(255,255,255,.15)',border:'none',borderRadius:12,padding:'13px',fontSize:13,fontWeight:800,color:'#fff'}}>✅ Montar meu Plano de Produção →</button></div></div></div>);}
function dicaMaoDeObra(cultura){if(cultura.tipoCultivo==='cogumelo')return 'Cultivo indoor exige atenção quase diária (inoculação, controle de umidade, colheita). Mesmo em pequena escala, considere ao menos meio período de uma pessoa.';if(cultura.dificuldade==='Difícil')return 'Cultivo intensivo. Geralmente 1 trabalhador a cada 0,3–0,5 ha, principalmente na colheita.';if(cultura.dificuldade==='Médio')return 'Geralmente 1 trabalhador a cada 0,5–1 ha nas épocas de manejo e colheita.';return 'Cultivo mais simples. 1 Pessoa costuma dar conta de até 1–2 ha sozinha.';}
function MaoDeObraCalcModal({trabalhadores,modo,valor,periodoMeses,periodoDias,encargosIncluir,encargosPct,onClose,onSalvar}){const[trab,setTrab]=useState(trabalhadores);const[md,setMd]=useState(modo);const[val,setVal]=useState(valor);const[pMeses,setPMeses]=useState(periodoMeses);const[pDias,setPDias]=useState(periodoDias);const[enc,setEnc]=useState(encargosIncluir);const[encPct,setEncPct]=useState(encargosPct);const periodo=md==='mensal'?pMeses:pDias;const base=trab*val*periodo;const total=enc?base*(1+encPct/100):base;function salvar(){onSalvar({trabalhadores:trab,modo:md,valor:val,periodo,encargosIncluir:enc,encargosPct:encPct});}return(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',alignItems:'flex-end',maxWidth:430,margin:'0 auto'}} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:'linear-gradient(152deg, rgba(255,255,255,.97) 0%, rgba(255,255,255,.9) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate(185%)',borderRadius:'24px 24px 0 0',padding:'14px 22px 30px',width:'100%',maxHeight:'88vh',overflowY:'auto',animation:'fadeUp .25s ease both'}}><div style={{width:40,height:4,borderRadius:99,background:'#E2E9DE',margin:'0 auto 16px'}} /><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}><div className='serif' style={{fontSize:18,fontWeight:800,color:'#1B4332'}}>Editar cálculo</div><button onClick={onClose} style={{background:'none',border:'none',fontSize:20,color:'#5A6857'}}>✕</button></div><div style={{fontSize:11,fontWeight:700,color:'#5A6857',marginBottom:8}}>FORMA DE PAGAMENTO</div><div style={{display:'flex',gap:8,marginBottom:16}}>{[['mensal','Mensal'],['diaria','Diária']].map(([id,l])=>(<button key={id} onClick={()=>setMd(id)} style={{flex:1,padding:'11px',borderRadius:12,border:md===id?'1.5px solid #1B4332':'1px solid #E8ECE6',background:md===id?'#EFF3EC':'#fff',fontSize:12.5,fontWeight:700,color:md===id?'#1B4332':'#8A9584'}}>{l}</button>))}</div><div style={{fontSize:12.5,fontWeight:700,color:'#1B4332',marginBottom:8}}>Quantidade de trabalhadores</div><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',border:'1px solid #E8ECE6',borderRadius:12,padding:'6px 8px',marginBottom:16}}><button onClick={()=>setTrab(Math.max(0,trab-1))} style={{width:38,height:38,borderRadius:10,border:'none',background:'#F1EFE4',fontSize:17,fontWeight:800,color:'#1B4332'}}>−</button><span style={{fontSize:17,fontWeight:800,color:'#1B4332'}}>{trab}</span><button onClick={()=>setTrab(trab+1)} style={{width:38,height:38,borderRadius:10,border:'none',background:'#F1EFE4',fontSize:17,fontWeight:800,color:'#1B4332'}}>+</button></div><div style={{fontSize:12.5,fontWeight:700,color:'#1B4332',marginBottom:8}}>{md==='mensal'?'Salário mensal por trabalhador':'Valor da diária por trabalhador'}</div><input type='number' inputMode='decimal' value={val} onChange={e=>setVal(+e.target.value||0)} className='soft-input' style={{marginBottom:16}} /><div style={{fontSize:12.5,fontWeight:700,color:'#1B4332',marginBottom:8}}>{md==='mensal'?'Período de utilização (meses)':'Dias trabalhados'}</div><input type='number' inputMode='decimal' value={md==='mensal'?pMeses:pDias} onChange={e=>md==='mensal'?setPMeses(+e.target.value||0):setPDias(+e.target.value||0)} className='soft-input' style={{marginBottom:16}} /><div style={{fontSize:12.5,fontWeight:700,color:'#1B4332',marginBottom:8}}>Encargos trabalhistas</div><div onClick={()=>setEnc(!enc)} style={{display:'flex',alignItems:'center',gap:10,border:'1px solid #E8ECE6',borderRadius:12,padding:'10px 12px',marginBottom:enc?10:16,cursor:'pointer'}}><div style={{width:36,height:20,borderRadius:10,background:enc?'#22C55E':'#D1D5DB',position:'relative',flexShrink:0,transition:'all .2s'}}><div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:2,left:enc?18:2,transition:'all .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}} /></div><span style={{fontSize:12,fontWeight:600,color:'#1B4332'}}>{enc?'Incluir':'Não incluir'}</span></div>{enc&&(<div style={{marginBottom:16}}><div style={{display:'flex',alignItems:'center',gap:8,border:'1px solid #E8ECE6',borderRadius:12,padding:'10px 12px'}}><input type='number' inputMode='decimal' value={encPct} onChange={e=>setEncPct(+e.target.value||0)} style={{flex:1,border:'none',outline:'none',fontSize:14,fontWeight:800,color:'#1B4332',background:'transparent'}} /><span style={{fontSize:13,fontWeight:700,color:'#8A9584'}}>%</span></div><div style={{fontSize:10,color:'#A3AD9D',marginTop:6,lineHeight:1.5}}>Sugestão padrão: INSS 20% + FGTS 8% + férias e 1/3 11% + 13º 8,3% ≈ 38%. Você pode editar livremente.</div></div>)}<div style={{background:'#F1EFE4',borderRadius:14,padding:'14px 16px',marginBottom:18}}><div style={{fontSize:10,fontWeight:700,color:'#8A9584',textTransform:'uppercase'}}>Total estimado no ciclo</div><div className='serif' style={{fontSize:24,fontWeight:800,color:'#7C4A1E',marginTop:3}}>{moeda(total)}</div></div><button onClick={salvar} className='notes-primary-button' style={{width:'100%',minHeight:50,fontSize:13.5}}>Salvar alterações</button></div></div>);}
function SimularCenarioModal({cultura,custImplEf,custManejoEf,maoDeObraT,organico,areaAtual,prodHaAtual,precoAAtual,precoVAtual,pctAAtual,onClose,onAplicar}){const[area,setArea]=useState(areaAtual);const[prodHa,setProdHa]=useState(prodHaAtual);const[precoA,setPrecoA]=useState(precoAAtual);const[precoV,setPrecoV]=useState(precoVAtual);const[pctA,setPctA]=useState(pctAAtual);function resetar(){setArea(areaAtual);setProdHa(prodHaAtual);setPrecoA(precoAAtual);setPrecoV(precoVAtual);setPctA(pctAAtual);}const precoAEfM=organico?+(precoA*1.3).toFixed(2):precoA,precoVEfM=organico?+(precoV*1.3).toFixed(2):precoV;const ha=area/10000,implT=custImplEf*ha,manejoT=custManejoEf*ha,custoT=implT+manejoT+maoDeObraT,prodT=ha*prodHa,kgA=prodT*pctA/100,kgV=prodT-kgA,recT=kgA*precoAEfM+kgV*precoVEfM,lucro=recT-custoT,lucroAno=lucro*cultura.safras,margem=recT>0?(lucro/recT*100):0;const Campo=({label,valor,setValor,unidade,max,step})=>(<div style={{marginBottom:18}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}><span style={{fontSize:12,fontWeight:700,color:'#1B4332'}}>{label}</span><span style={{fontSize:12.5,fontWeight:800,color:'#1B4332'}}>{typeof valor==='number'?valor.toLocaleString('pt-BR',{maximumFractionDigits:2}):valor} {unidade}</span></div><input type='range' min={0} max={max} step={step} value={valor} onChange={e=>setValor(+e.target.value)} style={{width:'100%',accentColor:'#1B4332'}} /></div>);return(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',alignItems:'flex-end',maxWidth:430,margin:'0 auto'}} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:'linear-gradient(152deg, rgba(255,255,255,.97) 0%, rgba(255,255,255,.9) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate(185%)',borderRadius:'24px 24px 0 0',padding:'14px 22px 30px',width:'100%',maxHeight:'88vh',overflowY:'auto',animation:'fadeUp .25s ease both'}}><div s function construirFasesCogumelo(cultura){return[{nome:'Preparo do Substrato',icon:'🌾',cor:'#8B5A2B',etapas:[{icon:'🧴',titulo:'Esterilização do substrato',desc:'Substrato (serragem, palha ou grãos) deve ser esterilizado em autoclave ou cozido, eliminando fungos e bactérias concorrentes.',dicas:['Mínimo 100°C por 2 horas','Substrato de procedência conhecida','Contaminação é a principal causa de perda'],sub:['Substrato selecionado','Esterilização/cozimento feito','Substrato resfriado'],mais:'A esterilização mata tudo no substrato, inclusive fungos concorrentes que competiriam com o cogumelo pelo alimento. Sem esse passo, a taxa de contaminação passa de 50%. Uma olla de pressão doméstica grande já serve pra pequena escala.'},{icon:'🧪',titulo:'Preparo dos sacos ou blocos',desc:'Com o substrato já resfriado, embale em sacos próprios para cultivo, ajustando a umidade.',dicas:['Sacos com filtro para troca de ar','Ambiente limpo e desinfetado antes de mexer','Umidade ideal do substrato: 60-70%'],sub:['Sacos/blocos preparados','Umidade ajustada (60-70%)','Ambiente desinfetado'],mais:'O filtro no saco permite trocar oxigênio sem deixar contaminantes entrarem. É diferente de um saco comum furado. Umidade errada (muito seca ou muito encharcada) é a segunda maior causa de perda, depois da contaminação.'}]},{nome:'Inoculação',icon:'🔬',cor:'#F97316',etapas:[{icon:'🧫',titulo:'Aquisição do micélio (spawn)',desc:'Compre micélio certificado de fornecedor confiável. Nunca use material sem procedência.',dicas:['Cor e cheiro devem ser neutros','Armazene em geladeira até o uso','Peça procedência e linhagem ao fornecedor'],sub:['Fornecedor confiável escolhido','Micélio comprado','Armazenado na geladeira'],mais:'Peça pro fornecedor mostrar fotos recentes do lote. Micélio velho ou mal armazenado perde vigor. Comece com um lote pequeno pra testar o fornecedor antes de comprar um volume maior.'},{icon:'💉',titulo:'Inoculação do substrato',desc:'Aplique o micélio no substrato em ambiente o mais asséptico possível.',dicas:['Álcool 70% em mãos e superfícies','Trabalhe rápido pra reduzir contaminação','Anote a data de cada lote inoculado'],sub:['Ambiente asséptico preparado','Inoculação realizada','Data do lote registrada'],mais:'Quanto mais rápido você inocular depois de abrir o saco de micélio, menor o risco de contaminação pelo ar. Uma câmara de fluxo simples, até artesanal, já reduz bastante esse risco em escala pequena.'}]},{nome:'Incubação',icon:'🌑',cor:'#3B82F6',etapas:[{icon:'🌡️',titulo:'Controle de temperatura no escuro',desc:'Mantenha os blocos em ambiente escuro e temperatura estável até a colonização completa do micélio.',dicas:['Sem luz direta nessa fase','Monitore a temperatura todo dia','Descarte qualquer bloco com mofo colorido'],sub:['Local escuro preparado','Temperatura monitorada','Blocos sem sinal de contaminação'],mais:'Cada espécie tem sua faixa ideal de temperatura. Shiitake e cogumelo-do-sol toleram faixas bem diferentes. Anote a temperatura duas vezes por dia nas primeiras semanas, até conhecer o comportamento do seu espaço.'},{icon:'💧',titulo:'Controle de umidade do ar',desc:'A umidade relativa deve ficar entre 60-80% durante a colonização.',dicas:['Use umidificador se o ambiente for seco','Excesso de água favorece contaminação','Substrato tomado de branco indica colonização completa'],sub:['Umidade entre 60-80%','Colonização visível (substrato branco)','Ambiente ventilado'],mais:'Um umidificador ultrassônico simples já resolve pra pequena escala. Substrato ainda escuro/manchado depois de muitos dias pode indicar micélio fraco ou ambiente errado. Vale investigar antes de desistir do lote.'}]},{nome:'Frutificação',icon:'🍄',cor:'#22C55E',etapas:[{icon:'❄️',titulo:'Indução da frutificação',desc:'Reduza a temperatura e aumente a luz indireta e a ventilação pra estimular o surgimento dos cogumelos.',dicas:['O choque térmico varia por espécie','Ventilação é essencial nessa fase','Os primeiros cogumelos aparecem em poucos dias'],sub:['Temperatura reduzida','Luz indireta ajustada','Ventilação aumentada'],mais:'Essa fase é a mais visualmente satisfatória. Em poucos dias aparecem os primeiros "pinos". Ventilação fraca nessa hora deixa os cogumelos com pé longo e chapéu pequeno, sinal de baixo oxigênio no ambiente.'},{icon:'🍄',titulo:`Colheita de ${cultura.nome}`,desc:'Colha no ponto certo de maturação, torcendo e puxando suavemente a base.',dicas:['Colha de manhã, antes do calor','Não use faca suja de outro lote','O mesmo bloco pode dar 2-3 floradas'],sub:['Cogumelos no ponto certo','Colheita realizada','Nova florada monitorada'],mais:'Corte ou torça rente à base pra não deixar resto que pode mofar e contaminar a próxima florada do mesmo bloco. Um bloco bem cuidado costuma dar 2 a 3 floradas antes de esgotar.'}]},{nome:'Comercialização',icon:'💰',cor:'#E84855',etapas:[{icon:'📦',titulo:'Embalagem e conservação',desc:'Cogumelos são muito perecíveis. Refrigere e embale logo após a colheita.',dicas:['Refrigeração entre 2-8°C','Embalagens perfuradas evitam mofo','Venda em até 5-7 dias após colher'],sub:['Refrigeração pronta (2-8°C)','Embalagem perfurada preparada','Cogumelos embalados'],mais:'Cogumelo perde água e murcha rápido fora da geladeira. Refrigere em até 2h após colher pra ter a máxima vida de prateleira. Embalagem fechada sem furos acumula umidade e mofa mais rápido, ao contrário do que parece.'},{icon:'💰',titulo:'Comercialização',desc:'Venda direta a restaurantes e feiras gourmet paga bem mais que o atacado.',dicas:['Restaurantes pagam premium por frescor','Fotos em redes sociais ajudam a vender direto','Fidelize compradores recorrentes'],sub:['Canal de venda escolhido','Primeira venda realizada','Clientes recorrentes identificados'],mais:'Restaurantes valorizam frescor e regularidade mais do que preço baixo. Combine entregas semanais fixas com 2-3 clientes fiéis antes de tentar vender pra muitos ao mesmo tempo.'}]}];}
function construirFasesApicultura(cultura){return[{nome:"Instalação do Apiário",icon:"📍",cor:"#F59E0B",etapas:[{icon:"📋",titulo:"Escolha do local e licenciamento",desc:"Escolha um local com floradas próximas, água limpa e distância segura de vizinhos e animais.",dicas:["Mínimo 300m de residências", "Verifique legislação municipal", "Sombra parcial ajuda no verão"],sub:["Local escolhido e avaliado", "Distância de vizinhos verificada", "Licença/registro consultado"],mais:"Órgãos estaduais de agricultura costumam exigir registro do apicultor e do apiário. Bacias hidrográficas e áreas de proteção ambiental podem ter restrições. Vale confirmar antes de instalar. Água limpa próxima (rio, açude) é essencial pras abelhas, que precisam beber bastante no calor."},{icon:"🏗️",titulo:"Montagem das colmeias",desc:"Monte as caixas (Langstroth é o modelo mais comum no Brasil) em suportes elevados, protegidas do sol direto e da chuva.",dicas:["Suportes evitam formigas", "Espace 1-1.5m entre colmeias", "Vire a entrada pro sol da manhã"],sub:["Caixas montadas", "Suportes instalados", "Colmeias posicionadas no apiário"],mais:"Colmeias muito próximas umas das outras confundem as abelhas na volta pro ninho, aumentando perda de operárias. Pintar as caixas com cores diferentes ajuda as abelhas a identificarem a própria colmeia."}]},{nome:"Aquisição das Colônias",icon:"🐝",cor:"#EAB308",etapas:[{icon:"📦",titulo:"Compra ou captura de enxames",desc:"Compre enxames de apicultores registrados ou capture enxames migratórios com caixas-isca.",dicas:["Prefira colônias já estabelecidas", "Evite enxames muito agressivos", "Caixa-isca é opção de baixo custo"],sub:["Fornecedor ou método definido", "Enxames adquiridos", "Transporte realizado com segurança"],mais:"Comprar de apicultor registrado garante rastreabilidade sanitária e reduz risco de doenças na colônia. Captura com caixa-isca é gratuita mas mais lenta e imprevisível. Funciona melhor na época de enxameação, geralmente na primavera."},{icon:"👑",titulo:"Introdução da rainha",desc:"Confirme que a colônia tem rainha ativa e postura regular antes de considerar a instalação concluída.",dicas:["Postura regular = colônia saudável", "Rainha ausente exige reposição rápida", "Não abra a colmeia toda semana"],sub:["Presença da rainha confirmada", "Postura de ovos observada", "Colônia estabilizada"],mais:"Sem rainha, a colônia entra em declínio rápido. Operárias não conseguem criar novas rainhas sem ovos ou larvas jovens disponíveis. Se notar ausência de postura por mais de 1 semana, providencie uma rainha nova o quanto antes."}]},{nome:"Manejo das Abelhas",icon:"🔍",cor:"#3B82F6",etapas:[{icon:"🔎",titulo:"Inspeções periódicas",desc:"Inspecione a cada 7-15 dias, verificando postura, reservas de mel e sinais de doenças ou pragas.",dicas:["Use roupa de proteção completa", "Trabalhe em dia ameno, sem vento forte", "Fumaça calma as abelhas antes de abrir"],sub:["Rotina de inspeção definida", "Primeira inspeção completa feita", "Sinais de saúde registrados"],mais:"Abrir a colmeia em excesso estressa a colônia e reduz produção. Ácaro Varroa e traça-de-cera são os problemas mais comuns no Brasil. Identificar cedo evita perder a colônia inteira."},{icon:"🍯",titulo:"Alimentação suplementar (entressafra)",desc:"Em períodos sem florada, ofereça xarope de água e açúcar pra manter a colônia forte.",dicas:["Proporção 1:1 água e açúcar", "Nunca use mel de outra colônia (risco de doença)", "Retire o alimentador na floração"],sub:["Período de entressafra identificado", "Alimentador instalado", "Colônia mantida forte na entressafra"],mais:"Xarope substitui o néctar quando não há floração suficiente, evitando que a colônia enfraqueça ou desista do local. Nunca alimente com mel de origem desconhecida. É a forma mais comum de espalhar doenças entre colônias."}]},{nome:"Floração e Produção",icon:"🌼",cor:"#22C55E",etapas:[{icon:"📅",titulo:"Acompanhar floradas da região",desc:"Conheça o calendário de floração das plantas ao redor. É isso que determina quando vai ter mel.",dicas:["Eucalipto, silvestre e laranjeira são comuns no Brasil", "Floradas variam por região e ano", "Abelha voa até 3km em busca de néctar"],sub:["Floradas da região mapeadas", "Época de maior produção identificada", "Plano de manejo por estação feito"],mais:"Produtores experientes movem colmeias entre regiões (apicultura migratória) pra acompanhar floradas diferentes ao longo do ano, maximizando produção. Pra quem está começando, vale focar numa florada forte e regular perto de casa."},{icon:"📦",titulo:"Instalar melgueiras (supers)",desc:"Quando a colônia estiver forte e a florada ativa, adicione a melgueira. Caixa extra só pra armazenar mel.",dicas:["Adicione com a colônia já forte", "Espaço extra evita enxameação", "Retire melgueira cheia pra colher"],sub:["Colônia avaliada como forte", "Melgueira instalada no momento certo", "Enchimento da melgueira monitorado"],mais:"A melgueira fica separada do ninho principal por uma tela excluidora, que impede a rainha de subir e pôr ovos ali. Assim os quadros de cima ficam só com mel puro, prontos pra colheita."}]},{nome:"Colheita e Comercialização",icon:"💰",cor:"#E84855",etapas:[{icon:"🍯",titulo:"Colheita do mel",desc:"Colha quadros com pelo menos 70-80% operculados (fechados com cera), sinal de mel maduro.",dicas:["Mel imaturo fermenta mais rápido", "Use fumigador com calma", "Deixe reservas suficientes pra colônia"],sub:["Quadros operculados identificados", "Colheita realizada", "Reserva mínima deixada pra colônia"],mais:"Mel colhido cedo demais, pouco operculado, tem mais água e fermenta na embalagem. Um dos erros mais comuns de quem começa. Sempre deixe pelo menos um quadro com mel/pólen pra colônia sobreviver até a próxima florada."},{icon:"🏷️",titulo:"Envase e venda",desc:"Filtre, envase em vidro ou plástico atóxico, rotule com informações claras e venda direto ou pra distribuidores.",dicas:["Rotulagem exige informações do produtor", "Venda direta paga mais que atravessador", "Selo de inspeção valoriza o produto"],sub:["Mel filtrado e envasado", "Rótulo com informações do produtor", "Primeira venda realizada"],mais:"Registro no órgão estadual de inspeção abre porta pra vender em mercados e feiras formais, não só de porta em porta. Própolis, geleia real e pólen são subprodutos que agregam receita extra à mesma colônia."}]}];}
function construirFasesHidroponia(cultura){return[{nome:"Planejamento",icon:"📋",cor:"#3B82F6",etapas:[{icon:"🔧",titulo:"Escolher sistema e cultura",desc:"Decida o sistema (NFT, MFT ou vasos com substrato) de acordo com a cultura e o espaço disponível.",dicas:["NFT é o mais usado pra folhosas", "MFT tolera falta de energia melhor", "Compare o retorno na calculadora"],sub:["Sistema escolhido", "Espaço/local definido", "Cultura e variedade confirmados"],mais:"NFT (Nutrient Film Technique) usa uma lâmina fina de solução circulando nas calhas. Mais produtivo, mas depende de energia constante (uma falha de bomba de algumas horas pode matar as raízes). MFT armazena mais solução e perdoa falhas breves de energia, sendo mais indicado pra quem está começando."},{icon:"💰",titulo:"Levantar capital",desc:"Sistemas hidropônicos têm custo inicial mais alto que solo, mas o ciclo mais rápido costuma compensar.",dicas:["Estrutura dura vários anos", "Considere custo de energia elétrica", "Comece pequeno pra validar o sistema"],sub:["Orçamento total calculado", "Fonte de recurso definida", "Reserva de emergência separada"],mais:"O maior custo inicial vem da estrutura (calhas, bombas, reservatório), que costuma durar vários anos com manutenção simples. Já o custo recorrente maior é energia elétrica, já que a bomba fica ligada boa parte do dia."}]},{nome:"Preparo do Sistema",icon:"🏗️",cor:"#F97316",etapas:[{icon:"🔨",titulo:"Montagem das calhas ou vasos",desc:"Monte as calhas/perfis com leve inclinação (2-3%) pra garantir o retorno da solução por gravidade.",dicas:["Inclinação errada acumula água em excesso", "Use material atóxico (PVC próprio)", "Proteja contra luz direta nas calhas"],sub:["Estrutura montada", "Inclinação verificada", "Calhas/vasos posicionados"],mais:"Luz entrando nas calhas favorece o crescimento de algas na solução, que competem por oxigênio e podem entupir o sistema. Calhas opacas ou cobertura bloqueiam a luz e evitam esse problema comum em sistemas caseiros."},{icon:"⚙️",titulo:"Instalação de bombeamento e reservatório",desc:"Instale a bomba, o reservatório de solução e a tubulação de retorno.",dicas:["Reservatório fora de luz direta", "Bomba com potência adequada ao sistema", "Tenha um plano B pra quedas de energia"],sub:["Reservatório instalado", "Bomba testada e funcionando", "Retorno de solução verificado"],mais:"Uma queda de energia prolongada pode secar as raízes em sistemas NFT em poucas horas, já que não há reserva de solução nas calhas. Um pequeno gerador ou nobreak pra bomba é um investimento que vale considerar."}]},{nome:"Plantio",icon:"🌱",cor:"#22C55E",etapas:[{icon:"🌾",titulo:"Semeadura em substrato inerte",desc:"Semeie em espuma fenólica ou fibra de coco. Substratos que só sustentam a planta, sem fornecer nutrientes.",dicas:["Espuma fenólica é a mais usada no Brasil", "Mantenha umidade constante na germinação", "Luz indireta até germinar"],sub:["Substrato inerte preparado", "Semeadura realizada", "Germinação iniciada"],mais:"Substrato inerte (sem nutrientes) é essencial na hidroponia. A planta recebe 100% da alimentação pela solução nutritiva, não pelo substrato. Isso dá controle total sobre o que a planta recebe, mas também exige que a solução esteja sempre correta."},{icon:"🌿",titulo:"Transplante para o sistema",desc:"Transfira as mudas pro sistema definitivo quando tiverem raízes bem desenvolvidas, geralmente 10-15 dias após a semeadura.",dicas:["Raiz fraca demora mais pra pegar", "Espace conforme a cultura escolhida", "Registre a data do transplante"],sub:["Mudas com raiz desenvolvida", "Transplante realizado", "Data registrada no Calendário"],mais:"Transplantar cedo demais (raiz pouco desenvolvida) aumenta a taxa de perda de mudas no sistema definitivo. Vale esperar as raízes brancas saírem visivelmente do substrato antes de mudar de lugar."}]},{nome:"Manejo da Solução Nutritiva",icon:"⚗️",cor:"#65A30D",etapas:[{icon:"⚡",titulo:"Preparo e monitoramento de EC/pH",desc:"Prepare a solução com os sais nutritivos corretos e monitore EC (condutividade) e pH diariamente.",dicas:["pH ideal geralmente 5.5–6.5", "EC varia por fase de crescimento", "Use medidor digital (caneta EC/pH)"],sub:["Solução nutritiva preparada", "EC e pH medidos e ajustados", "Rotina diária de monitoramento definida"],mais:"EC (condutividade elétrica) indica a concentração de nutrientes dissolvidos. Muito alta prejudica a planta, muito baixa deixa faltando nutriente. pH fora da faixa trava a absorção de nutrientes mesmo que eles estejam na solução, do mesmo jeito que acontece no solo."},{icon:"🔄",titulo:"Troca periódica da solução",desc:"Troque a solução completa a cada 10-15 dias, mesmo mantendo os níveis de EC/pH corretos no dia a dia.",dicas:["Solução velha acumula sais desequilibrados", "Limpe o reservatório na troca", "Nunca deixe faltar solução no sistema"],sub:["Frequência de troca definida", "Primeira troca completa realizada", "Reservatório limpo na troca"],mais:"Mesmo corrigindo EC e pH diariamente, alguns sais se acumulam de forma desequilibrada na solução com o tempo, o que só se resolve trocando tudo. Aproveite a troca pra limpar o reservatório e evitar acúmulo de biofilme."}]},{nome:"Colheita e Comercialização",icon:"💰",cor:"#E84855",etapas:[{icon:"🥬",titulo:"Colheita",desc:"Colha no ponto ideal. Hidroponia costuma antecipar a colheita comparado ao cultivo em solo, pelo crescimento mais rápido.",dicas:["Corte pela manhã, mais fresco", "Sistema permite colheita contínua em alguns casos", "Higienize bem antes de embalar"],sub:["Ponto de colheita identificado", "Colheita realizada", "Produto higienizado"],mais:"Um dos maiores atrativos da hidroponia é o ciclo mais curto e a produtividade por m² maior que no solo, o que ajuda a compensar o investimento inicial mais alto no sistema. Produto hidropônico costuma ser vendido como diferencial de limpeza e frescor."},{icon:"💰",titulo:"Venda direta",desc:"Destaque a origem hidropônica na venda. Muitos consumidores pagam mais por isso, associando à limpeza e ausência de terra.",dicas:["Embalagem com raiz ainda presa dura mais", "Feiras e mercados valorizam o diferencial", "Fidelize clientes com entrega regular"],sub:["Canal de venda escolhido", "Diferencial hidropônico destacado na venda", "Primeira venda realizada"],mais:"Vender com a raiz presa (alface em vaso, por exemplo) prolonga a vida útil do produto na gôndola ou na casa do cliente, um diferencial forte da hidroponia sobre o cultivo tradicional."}]}];}
function construirFases(cultura,organico){if(cultura.tipoCultivo==='cogumelo')return construirFasesCogumelo(cultura);if(cultura.tipoCultivo==='apicultura')return construirFasesApicultura(cultura);if(cultura.tipoCultivo==='hidroponia')return construirFasesHidroponia(cultura);const fasesBase=[{nome:'Planejamento',icon:'📋',cor:'#3B82F6',etapas:[{icon:'📐',titulo:'Definir área e variedade',desc:'Decida a área e a variedade (cultivar) adequada ao seu clima e mercado.',dicas:['Compare variedades','Comece pequeno','Use a calculadora'],sub:['Área medida e confirmada','Variedade escolhida','Comprador/mercado identificado'],mais:'Antes de decidir, rode a calculadora com 2-3 variedades diferentes e compare o lucro projetado. Pense também se você já tem comprador garantido ou vai vender no mercado aberto. Isso muda a estratégia de venda depois. Culturas de ciclo curto dão retorno mais rápido, mas normalmente com margem menor por safra.'},{icon:'💰',titulo:'Levantar capital',desc:`Custo estimado: ${fmt(cultura.custImpl)}/ha.`,dicas:['PRONAF: juros 3–6% a.a.','Reserve 20% de contingência','Planeje fluxo de caixa'],sub:['Orçamento total calculado','Fonte de recurso definida','Reserva de emergência separada'],mais:'PRONAF é a linha mais acessível pra pequeno produtor, com juros bem menores que banco comum. Documentos geralmente incluem CPF, comprovante de propriedade/posse da terra e um plano simples do que vai plantar. Procure o Banco do Brasil ou uma cooperativa de crédito da sua região.'}]},{nome:'Preparo do Solo',icon:'🌍',cor:'#F97316',etapas:[{icon:'🧪',titulo:'Análise e correção',desc:'pH ideal varia. Aplique calcário 30–60 dias antes de plantar.',dicas:['Análise: R$ 30–50','Corrija boro e zinco','pH define produtividade'],sub:['Amostra de solo coletada','Laudo da análise recebido','Correção aplicada'],mais:'Colete a amostra de vários pontos da área (não só um canto) e misture antes de enviar. Isso representa melhor o solo todo. Aplique o calcário com antecedência, porque ele reage devagar com o solo; jogar na hora do plantio não corrige a tempo.'},{icon:'🚜',titulo:'Preparo mecânico',desc:'Aração profunda, subsolagem e gradagem.',dicas:['Subsolagem rompe compactação','Drene áreas úmidas','Prepare com 60 dias'],sub:['Área limpa e nivelada','Drenagem verificada','Aração/gradagem concluída'],mais:'Solo compactado (comum em área que já foi pasto) trava o crescimento das raízes. Subsolagem rompe essa camada dura no fundo. Evite preparar o solo em dia de chuva ou solo muito encharcado. Isso compacta ainda mais em vez de ajudar.'}]},{nome:'Plantio',icon:'🌱',cor:'#22C55E',etapas:[{icon:'🌿',titulo:'Mudas certificadas',desc:'Use material certificado pelo MAPA.',dicas:['Nunca sem certificação','Compre 10% a mais','Armazene adequadamente'],sub:['Fornecedor certificado escolhido','Mudas/sementes compradas','Material armazenado corretamente'],mais:'Compre um pouco além do necessário pra cobrir o replantio de falhas, que é normal acontecer. Guarde nota fiscal e etiqueta do lote. É sua garantia caso apareça algum problema genético ou de doença mais adiante.'},{icon:'🌾',titulo:`Plantio de ${cultura.nome}`,desc:'Siga espaçamento e época ideal.',dicas:['Irrigue imediatamente','Replante falhas em 7 dias','Registre a data'],sub:['Espaçamento definido','Plantio realizado','Irrigação inicial feita'],mais:'Regue logo depois do plantio mesmo se for chover. A muda precisa de contato firme com a terra, e a água ajuda a acomodar o solo em volta da raiz. Marque a data exata no Calendário; isso ajuda a prever a colheita depois.'}]},{nome:'Crescimento',icon:'🌿',cor:'#65A30D',etapas:[{icon:'🧬',titulo:'Adubação',desc:'Aplique NPK conforme análise foliar.',dicas:['Análise foliar a cada 45 dias','Fertirrigação é eficiente','Sem exagero em nitrogênio'],sub:['Análise foliar feita','Plano de adubação definido','Primeira aplicação realizada'],mais:'Análise foliar (da folha, não do solo) mostra o que a planta está realmente absorvendo, complementando a análise de solo. Nitrogênio em excesso deixa a planta bonita mas fraca e mais vulnerável a pragas. Siga a recomendação, sem exagerar na dose.'},{icon:'🔬',titulo:'Controle de pragas',desc:'Monitore semanalmente. Fungicidas a cada 7–10 dias.',dicas:['MIP reduz custos 50%','Alterne princípios ativos','Remova material doente'],sub:['Monitoramento semanal iniciado','Manejo/produto definido','Primeira inspeção registrada'],mais:'Ande pela área olhando embaixo das folhas, não só por cima. Muitas pragas e ovos ficam escondidos ali. Alternar o princípio ativo (não repetir sempre o mesmo produto) evita que a praga vire resistente a ele.'}]},{nome:'Colheita',icon:cultura.emoji,cor:'#E84855',etapas:[{icon:cultura.emoji,titulo:`Colheita de ${cultura.nome}`,desc:'Colha no ponto ideal, pela manhã.',dicas:['Calibre correto','Manhã é melhor','Caixas limpas'],sub:['Ponto de colheita identificado','Mão de obra organizada','Colheita iniciada'],mais:'Colher antes ou depois do ponto ideal afeta direto o preço que você consegue vender. Produtos colhidos de manhã, mais frescos, aguentam mais tempo até a venda ou o transporte.'},{icon:'💰',titulo:'Comercialização',desc:'Venda direta paga 2–3× mais.',dicas:['WhatsApp gratuito','Embale com identidade','Fidelize clientes'],sub:['Canal de venda escolhido','Embalagem definida','Primeira venda realizada'],mais:'Combine o preço antes de entregar, não depois. Isso evita ficar na mão do comprador na hora de fechar. Embalagem com identidade (nome, foto, contato) faz o cliente lembrar de você na próxima compra.'}]}];if(!organico)return fasesBase;const fasesOrg=JSON.parse(JSON.stringify(fasesBase));fasesOrg[0].etapas[1].dicas=['PRONAF: juros 3–6% a.a.','Inclua o custo da certificação orgânica no orçamento','Planeje fluxo de caixa'];fasesOrg[0].etapas[1].mais='A certificação orgânica (por auditoria ou sistema participativo) tem custo e leva tempo. Pesquise cooperativas ou associações de produtores orgânicos da sua região, que costumam dividir o custo entre vários produtores.';fasesOrg[1].etapas[0].dicas=['Análise: R$ 30–50','Corrija com calcário e insumos permitidos no orgânico','pH define produtividade'];fasesOrg[3].etapas[0].titulo='Adubação orgânica';fasesOrg[3].etapas[0].desc='Use compostagem, adubação verde e esterco curtido. Sem fertilizante sintético.';fasesOrg[3].etapas[0].dicas=['Compostagem própria reduz custo','Adubação verde melhora o solo a longo prazo','Nunca use esterco fresco (queima a planta)'];fasesOrg[3].etapas[0].sub=['Fonte de matéria orgânica definida','Compostagem ou adubo orgânico preparado','Primeira aplicação realizada'];fasesOrg[3].etapas[0].mais='Compostagem caseira (restos vegetais, esterco curtido) reduz o custo de adubação com o tempo, mas exige planejamento. Leva de 60 a 90 dias pra ficar pronta. Adubação verde (plantar leguminosas pra depois incorporar ao solo) enriquece o solo naturalmente com nitrogênio.';fasesOrg[3].etapas[1].titulo='Controle biológico de pragas';fasesOrg[3].etapas[1].desc='Use inimigos naturais, armadilhas e extratos vegetais. Sem defensivo sintético.';fasesOrg[3].etapas[1].dicas=['MIP orgânico é ainda mais importante aqui','Calda de fumo e nim são opções naturais','Insetos benéficos ajudam a controlar pragas'];fasesOrg[3].etapas[1].sub=['Método de controle biológico escolhido','Monitoramento semanal iniciado','Primeiro tratamento natural aplicado'];fasesOrg[3].etapas[1].mais='Sem defensivo sintético, a prevenção pesa ainda mais: rotação de cultura, plantas repelentes ao lado e monitoramento frequente evitam que a praga vire um problema grande. Nim e calda de fumo são alternativas naturais amplamente usadas.';fasesOrg[4].etapas[1].dicas=['Selo orgânico valoriza o produto','WhatsApp gratuito','Fidelize clientes que valorizam produção sem agrotóxico'];fasesOrg[4].etapas[1].mais='O selo orgânico (SISORG ou selo de sistema participativo) é o principal argumento de venda. Deixe visível na embalagem e conte a história do seu cultivo pro cliente, isso justifica o preço mais alto.';return fasesOrg;}
function calcularEtapasComData(cultura,dataInicioStr){const fases=construirFases(cultura);const cicloDias=Math.round(cultura.ciclo*30);const fracoes=[0,0.03,0.10,0.20,0.25,0.30,0.55,0.75,1.0,1.05];let idx=0;const lista=[];fases.forEach(fase=>{fase.etapas.forEach((et,i)=>{const offset=Math.round(fracoes[idx]*cicloDias);const data=new Date(dataInicioStr+'T12:00');data.setDate(data.getDate()+offset);lista.push({id:`etapa-${idx}`,titulo:et.titulo,icon:et.icon,faseNome:fase.nome,faseCor:fase.cor,data,dataISO:data.toISOString().slice(0,10)});idx++;});});return lista;}
function PlanoScreen({cultura,regiao,userId,onProgresso,onAbrirNotas}){const[organico,setOrganico]=useState(false);const fases=construirFases(cultura,organico);const[progresso,setProgresso]=useState({});const[carregando,setCarregando]=useState(true);const[dataInicio,setDataInicio]=useState(null);const[carregandoData,setCarregandoData]=useState(true);const[dataTemp,setDataTemp]=useState(()=>new Date().toISOString().slice(0,10));const[subChecks,setSubChecks]=useState({});const[maisAberto,setMaisAberto]=useState({});useEffect(()=>{if(!userId){setCarregando(false);return;}sb.from('plano_progresso').select('etapa_id,feito,feito_em').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).then(({data})=>{const m={};(data||[]).forEach(r=>{m[r.etapa_id]={feito:r.feito,feito_em:r.feito_em};});setProgresso(m);setCarregando(false);});},[userId,cultura.nome]);useEffect(()=>{if(!userId){setCarregandoData(false);return;}sb.from('planos_inicio').select('data_inicio,organico').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).maybeSingle().then(({data})=>{if(data){setDataInicio(data.data_inicio);setOrganico(data.organico===true);}setCarregandoData(false);});},[userId,cultura.nome]);async function confirmarDataInicio(){setDataInicio(dataTemp);if(userId){await sb.from('planos_inicio').upsert({usuario_id:userId,cultura_nome:cultura.nome,data_inicio:dataTemp,ciclo_meses:cultura.ciclo,organico},{onConflict:'usuario_id,cultura_nome'});}}async function alternarOrganico(){const novo=!organico;setOrganico(novo);if(userId&&dataInicio){await sb.from('planos_inicio').update({organico:novo}).eq('usuario_id',userId).eq('cultura_nome',cultura.nome);}}const etapasComData=dataInicio?calcularEtapasComData(cultura,dataInicio):null;const dataPorId=etapasComData?Object.fromEntries(etapasComData.map(e=>[e.id,e])):{};const hojeISO=new Date().toISOString().slice(0,10);async function marcar(id){const nf=!(progresso[id]?.feito||false);setProgresso(prev=>({...prev,[id]:{feito:nf,feito_em:nf?new Date().
