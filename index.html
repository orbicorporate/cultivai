function GuiaScreen({cultura,regiao,onIrTela}){const[expandido,setExpandido]=useState(null);const d=[{i:'💧',c:'#3B82F6',t:'Irrigação adequada',x:`Manejo hídrico crítico para ${cultura.nome}. Use gotejamento para máxima eficiência.`,mais:'O momento certo de irrigar é de manhã bem cedo ou fim de tarde, evitando o sol forte (a água evapora antes de fazer efeito). Gotejamento entrega água direto na raiz e gasta até 40% menos que aspersão. Folha amarelada com fungo na base geralmente é excesso de água; folha murcha com solo aparentemente ok geralmente é falta.'},{i:'🧪',c:'#F97316',t:'Análise de solo',x:'Faça antes de plantar. Custa R$ 30–50 e define o sucesso da cultura.',mais:'O laudo mostra pH e os teores de fósforo, potássio, cálcio, magnésio e matéria orgânica. Solo ácido (pH baixo) trava a absorção de nutrientes mesmo que você adube bastante — por isso a calagem (calcário) normalmente vem antes da adubação, não junto. Refaça a análise a cada 1–2 anos, o solo muda com o tempo e o cultivo.'},{i:'🌱',c:'#22C55E',t:'Mudas certificadas',x:'Material genético de qualidade aumenta produtividade 20–40%.',mais:'Certificação do MAPA garante que a muda não carrega doença e tem a genética que promete. Material sem origem é a principal causa de pragas se espalhando entre produtores de uma mesma região. Guarde a nota fiscal e a etiqueta do lote — é sua garantia se aparecer algum problema depois.'},{i:'🔬',c:'#8B5CF6',t:'Monitoramento de pragas',x:'Inspeções semanais. Preventivo é mais barato que curativo. Adote o MIP.',mais:'MIP (Manejo Integrado de Pragas) significa monitorar antes de aplicar qualquer produto, agindo só quando o problema realmente ameaça a produção — não ao primeiro inseto visto. Isso economiza em defensivo e evita que a praga vire resistente. Olhe embaixo das folhas também, não só por cima; é onde a maioria se esconde.'},{i:'📅',c:'#E84855',t:'Calendário agrícola',x:`Plante ${cultura.nome} na janela certa.`,mais:'Plantar fora da janela ideal é uma das causas mais c function construirFasesCogumelo(cultura){return[{nome:'Preparo do Substrato',icon:'🌾',cor:'#8B5A2B',etapas:[{icon:'🧴',titulo:'Esterilização do substrato',desc:'Substrato (serragem, palha ou grãos) deve ser esterilizado em autoclave ou cozido, eliminando fungos e bactérias concorrentes.',dicas:['Mínimo 100°C por 2 horas','Substrato de procedência conhecida','Contaminação é a principal causa de perda'],sub:['Substrato selecionado','Esterilização/cozimento feito','Substrato resfriado'],mais:'A esterilização mata tudo no substrato, inclusive fungos concorrentes que competiriam com o cogumelo pelo alimento. Sem esse passo, a taxa de contaminação passa de 50%. Uma olla de pressão doméstica grande já serve pra pequena escala.'},{icon:'🧪',titulo:'Preparo dos sacos ou blocos',desc:'Com o substrato já resfriado, embale em sacos próprios para cultivo, ajustando a umidade.',dicas:['Sacos com filtro para troca de ar','Ambiente limpo e desinfetado antes de mexer','Umidade ideal do substrato: 60-70%'],sub:['Sacos/blocos preparados','Umidade ajustada (60-70%)','Ambiente desinfetado'],mais:'O filtro no saco permite trocar oxigênio sem deixar contaminantes entrarem — é diferente de um saco comum furado. Umidade errada (muito seca ou muito encharcada) é a segunda maior causa de perda, depois da contaminação.'}]},{nome:'Inoculação',icon:'🔬',cor:'#F97316',etapas:[{icon:'🧫',titulo:'Aquisição do micélio (spawn)',desc:'Compre micélio certificado de fornecedor confiável — nunca use material sem procedência.',dicas:['Cor e cheiro devem ser neutros','Armazene em geladeira até o uso','Peça procedência e linhagem ao fornecedor'],sub:['Fornecedor confiável escolhido','Micélio comprado','Armazenado na geladeira'],mais:'Peça pro fornecedor mostrar fotos recentes do lote — micélio velho ou mal armazenado perde vigor. Comece com um lote pequeno pra testar o fornecedor antes de comprar um volume maior.'},{icon:'💉',titulo:'Inoculação do substrato',desc:'Aplique o micélio no substrato em ambiente o mais asséptico possível.',dicas:['Álcool 70% em mãos e superfícies','Trabalhe rápido pra reduzir contaminação','Anote a data de cada lote inoculado'],sub:['Ambiente asséptico preparado','Inoculação realizada','Data do lote registrada'],mais:'Quanto mais rápido você inocular depois de abrir o saco de micélio, menor o risco de contaminação pelo ar. Uma câmara de fluxo simples, até artesanal, já reduz bastante esse risco em escala pequena.'}]},{nome:'Incubação',icon:'🌑',cor:'#3B82F6',etapas:[{icon:'🌡️',titulo:'Controle de temperatura no escuro',desc:'Mantenha os blocos em ambiente escuro e temperatura estável até a colonização completa do micélio.',dicas:['Sem luz direta nessa fase','Monitore a temperatura todo dia','Descarte qualquer bloco com mofo colorido'],sub:['Local escuro preparado','Temperatura monitorada','Blocos sem sinal de contaminação'],mais:'Cada espécie tem sua faixa ideal de temperatura — shiitake e cogumelo-do-sol toleram faixas bem diferentes. Anote a temperatura duas vezes por dia nas primeiras semanas, até conhecer o comportamento do seu espaço.'},{icon:'💧',titulo:'Controle de umidade do ar',desc:'A umidade relativa deve ficar entre 60-80% durante a colonização.',dicas:['Use umidificador se o ambiente for seco','Excesso de água favorece contaminação','Substrato tomado de branco indica colonização completa'],sub:['Umidade entre 60-80%','Colonização visível (substrato branco)','Ambiente ventilado'],mais:'Um umidificador ultrassônico simples já resolve pra pequena escala. Substrato ainda escuro/manchado depois de muitos dias pode indicar micélio fraco ou ambiente errado — vale investigar antes de desistir do lote.'}]},{nome:'Frutificação',icon:'🍄',cor:'#22C55E',etapas:[{icon:'❄️',titulo:'Indução da frutificação',desc:'Reduza a temperatura e aumente a luz indireta e a ventilação pra estimular o surgimento dos cogumelos.',dicas:['O choque térmico varia por espécie','Ventilação é essencial nessa fase','Os primeiros cogumelos aparecem em poucos dias'],sub:['Temperatura reduzida','Luz indireta ajustada','Ventilação aumentada'],mais:'Essa fase é a mais visualmente satisfatória — em poucos dias aparecem os primeiros "pinos". Ventilação fraca nessa hora deixa os cogumelos com pé longo e chapéu pequeno, sinal de baixo oxigênio no ambiente.'},{icon:'🍄',titulo:`Colheita de ${cultura.nome}`,desc:'Colha no ponto certo de maturação, torcendo e puxando suavemente a base.',dicas:['Colha de manhã, antes do calor','Não use faca suja de outro lote','O mesmo bloco pode dar 2-3 floradas'],sub:['Cogumelos no ponto certo','Colheita realizada','Nova florada monitorada'],mais:'Corte ou torça rente à base pra não deixar resto que pode mofar e contaminar a próxima florada do mesmo bloco. Um bloco bem cuidado costuma dar 2 a 3 floradas antes de esgotar.'}]},{nome:'Comercialização',icon:'💰',cor:'#E84855',etapas:[{icon:'📦',titulo:'Embalagem e conservação',desc:'Cogumelos são muito perecíveis — refrigere e embale logo após a colheita.',dicas:['Refrigeração entre 2-8°C','Embalagens perfuradas evitam mofo','Venda em até 5-7 dias após colher'],sub:['Refrigeração pronta (2-8°C)','Embalagem perfurada preparada','Cogumelos embalados'],mais:'Cogumelo perde água e murcha rápido fora da geladeira — refrigere em até 2h após colher pra ter a máxima vida de prateleira. Embalagem fechada sem furos acumula umidade e mofa mais rápido, ao contrário do que parece.'},{icon:'💰',titulo:'Comercialização',desc:'Venda direta a restaurantes e feiras gourmet paga bem mais que o atacado.',dicas:['Restaurantes pagam premium por frescor','Fotos em redes sociais ajudam a vender direto','Fidelize compradores recorrentes'],sub:['Canal de venda escolhido','Primeira venda realizada','Clientes recorrentes identificados'],mais:'Restaurantes valorizam frescor e regularidade mais do que preço baixo. Combine entregas semanais fixas com 2-3 clientes fiéis antes de tentar vender pra muitos ao mesmo tempo.'}]}];}
function construirFasesApicultura(cultura){return[{nome:"Instalação do Apiário",icon:"📍",cor:"#F59E0B",etapas:[{icon:"📋",titulo:"Escolha do local e licenciamento",desc:"Escolha um local com floradas próximas, água limpa e distância segura de vizinhos e animais.",dicas:["Mínimo 300m de residências", "Verifique legislação municipal", "Sombra parcial ajuda no verão"],sub:["Local escolhido e avaliado", "Distância de vizinhos verificada", "Licença/registro consultado"],mais:"Órgãos estaduais de agricultura costumam exigir registro do apicultor e do apiário. Bacias hidrográficas e áreas de proteção ambiental podem ter restrições — vale confirmar antes de instalar. Água limpa próxima (rio, açude) é essencial pras abelhas, que precisam beber bastante no calor."},{icon:"🏗️",titulo:"Montagem das colmeias",desc:"Monte as caixas (Langstroth é o modelo mais comum no Brasil) em suportes elevados, protegidas do sol direto e da chuva.",dicas:["Suportes evitam formigas", "Espace 1-1.5m entre colmeias", "Vire a entrada pro sol da manhã"],sub:["Caixas montadas", "Suportes instalados", "Colmeias posicionadas no apiário"],mais:"Colmeias muito próximas umas das outras confundem as abelhas na volta pro ninho, aumentando perda de operárias. Pintar as caixas com cores diferentes ajuda as abelhas a identificarem a própria colmeia."}]},{nome:"Aquisição das Colônias",icon:"🐝",cor:"#EAB308",etapas:[{icon:"📦",titulo:"Compra ou captura de enxames",desc:"Compre enxames de apicultores registrados ou capture enxames migratórios com caixas-isca.",dicas:["Prefira colônias já estabelecidas", "Evite enxames muito agressivos", "Caixa-isca é opção de baixo custo"],sub:["Fornecedor ou método definido", "Enxames adquiridos", "Transporte realizado com segurança"],mais:"Comprar de apicultor registrado garante rastreabilidade sanitária e reduz risco de doenças na colônia. Captura com caixa-isca é gratuita mas mais lenta e imprevisível — funciona melhor na época de enxameação, geralmente na primavera."},{icon:"👑",titulo:"Introdução da rainha",desc:"Confirme que a colônia tem rainha ativa e postura regular antes de considerar a instalação concluída.",dicas:["Postura regular = colônia saudável", "Rainha ausente exige reposição rápida", "Não abra a colmeia toda semana"],sub:["Presença da rainha confirmada", "Postura de ovos observada", "Colônia estabilizada"],mais:"Sem rainha, a colônia entra em declínio rápido — operárias não conseguem criar novas rainhas sem ovos ou larvas jovens disponíveis. Se notar ausência de postura por mais de 1 semana, providencie uma rainha nova o quanto antes."}]},{nome:"Manejo das Abelhas",icon:"🔍",cor:"#3B82F6",etapas:[{icon:"🔎",titulo:"Inspeções periódicas",desc:"Inspecione a cada 7-15 dias, verificando postura, reservas de mel e sinais de doenças ou pragas.",dicas:["Use roupa de proteção completa", "Trabalhe em dia ameno, sem vento forte", "Fumaça calma as abelhas antes de abrir"],sub:["Rotina de inspeção definida", "Primeira inspeção completa feita", "Sinais de saúde registrados"],mais:"Abrir a colmeia em excesso estressa a colônia e reduz produção. Ácaro Varroa e traça-de-cera são os problemas mais comuns no Brasil — identificar cedo evita perder a colônia inteira."},{icon:"🍯",titulo:"Alimentação suplementar (entressafra)",desc:"Em períodos sem florada, ofereça xarope de água e açúcar pra manter a colônia forte.",dicas:["Proporção 1:1 água e açúcar", "Nunca use mel de outra colônia (risco de doença)", "Retire o alimentador na floração"],sub:["Período de entressafra identificado", "Alimentador instalado", "Colônia mantida forte na entressafra"],mais:"Xarope substitui o néctar quando não há floração suficiente, evitando que a colônia enfraqueça ou desista do local. Nunca alimente com mel de origem desconhecida — é a forma mais comum de espalhar doenças entre colônias."}]},{nome:"Floração e Produção",icon:"🌼",cor:"#22C55E",etapas:[{icon:"📅",titulo:"Acompanhar floradas da região",desc:"Conheça o calendário de floração das plantas ao redor — é isso que determina quando vai ter mel.",dicas:["Eucalipto, silvestre e laranjeira são comuns no Brasil", "Floradas variam por região e ano", "Abelha voa até 3km em busca de néctar"],sub:["Floradas da região mapeadas", "Época de maior produção identificada", "Plano de manejo por estação feito"],mais:"Produtores experientes movem colmeias entre regiões (apicultura migratória) pra acompanhar floradas diferentes ao longo do ano, maximizando produção. Pra quem está começando, vale focar numa florada forte e regular perto de casa."},{icon:"📦",titulo:"Instalar melgueiras (supers)",desc:"Quando a colônia estiver forte e a florada ativa, adicione a melgueira — caixa extra só pra armazenar mel.",dicas:["Adicione com a colônia já forte", "Espaço extra evita enxameação", "Retire melgueira cheia pra colher"],sub:["Colônia avaliada como forte", "Melgueira instalada no momento certo", "Enchimento da melgueira monitorado"],mais:"A melgueira fica separada do ninho principal por uma tela excluidora, que impede a rainha de subir e pôr ovos ali — assim os quadros de cima ficam só com mel puro, prontos pra colheita."}]},{nome:"Colheita e Comercialização",icon:"💰",cor:"#E84855",etapas:[{icon:"🍯",titulo:"Colheita do mel",desc:"Colha quadros com pelo menos 70-80% operculados (fechados com cera), sinal de mel maduro.",dicas:["Mel imaturo fermenta mais rápido", "Use fumigador com calma", "Deixe reservas suficientes pra colônia"],sub:["Quadros operculados identificados", "Colheita realizada", "Reserva mínima deixada pra colônia"],mais:"Mel colhido cedo demais, pouco operculado, tem mais água e fermenta na embalagem — um dos erros mais comuns de quem começa. Sempre deixe pelo menos um quadro com mel/pólen pra colônia sobreviver até a próxima florada."},{icon:"🏷️",titulo:"Envase e venda",desc:"Filtre, envase em vidro ou plástico atóxico, rotule com informações claras e venda direto ou pra distribuidores.",dicas:["Rotulagem exige informações do produtor", "Venda direta paga mais que atravessador", "Selo de inspeção valoriza o produto"],sub:["Mel filtrado e envasado", "Rótulo com informações do produtor", "Primeira venda realizada"],mais:"Registro no órgão estadual de inspeção abre porta pra vender em mercados e feiras formais, não só de porta em porta. Própolis, geleia real e pólen são subprodutos que agregam receita extra à mesma colônia."}]}];}
function construirFasesHidroponia(cultura){return[{nome:"Planejamento",icon:"📋",cor:"#3B82F6",etapas:[{icon:"🔧",titulo:"Escolher sistema e cultura",desc:"Decida o sistema (NFT, MFT ou vasos com substrato) de acordo com a cultura e o espaço disponível.",dicas:["NFT é o mais usado pra folhosas", "MFT tolera falta de energia melhor", "Compare o retorno na calculadora"],sub:["Sistema escolhido", "Espaço/local definido", "Cultura e cultivar confirmados"],mais:"NFT (Nutrient Film Technique) usa uma lâmina fina de solução circulando nas calhas — mais produtivo, mas depende de energia constante (uma falha de bomba de algumas horas pode matar as raízes). MFT armazena mais solução e perdoa falhas breves de energia, sendo mais indicado pra quem está começando."},{icon:"💰",titulo:"Levantar capital",desc:"Sistemas hidropônicos têm custo inicial mais alto que solo, mas o ciclo mais rápido costuma compensar.",dicas:["Estrutura dura vários anos", "Considere custo de energia elétrica", "Comece pequeno pra validar o sistema"],sub:["Orçamento total calculado", "Fonte de recurso definida", "Reserva de emergência separada"],mais:"O maior custo inicial vem da estrutura (calhas, bombas, reservatório), que costuma durar vários anos com manutenção simples. Já o custo recorrente maior é energia elétrica, já que a bomba fica ligada boa parte do dia."}]},{nome:"Preparo do Sistema",icon:"🏗️",cor:"#F97316",etapas:[{icon:"🔨",titulo:"Montagem das calhas ou vasos",desc:"Monte as calhas/perfis com leve inclinação (2-3%) pra garantir o retorno da solução por gravidade.",dicas:["Inclinação errada acumula água em excesso", "Use material atóxico (PVC próprio)", "Proteja contra luz direta nas calhas"],sub:["Estrutura montada", "Inclinação verificada", "Calhas/vasos posicionados"],mais:"Luz entrando nas calhas favorece o crescimento de algas na solução, que competem por oxigênio e podem entupir o sistema. Calhas opacas ou cobertura bloqueiam a luz e evitam esse problema comum em sistemas caseiros."},{icon:"⚙️",titulo:"Instalação de bombeamento e reservatório",desc:"Instale a bomba, o reservatório de solução e a tubulação de retorno.",dicas:["Reservatório fora de luz direta", "Bomba com potência adequada ao sistema", "Tenha um plano B pra quedas de energia"],sub:["Reservatório instalado", "Bomba testada e funcionando", "Retorno de solução verificado"],mais:"Uma queda de energia prolongada pode secar as raízes em sistemas NFT em poucas horas, já que não há reserva de solução nas calhas. Um pequeno gerador ou nobreak pra bomba é um investimento que vale considerar."}]},{nome:"Plantio",icon:"🌱",cor:"#22C55E",etapas:[{icon:"🌾",titulo:"Semeadura em substrato inerte",desc:"Semeie em espuma fenólica ou fibra de coco — substratos que só sustentam a planta, sem fornecer nutrientes.",dicas:["Espuma fenólica é a mais usada no Brasil", "Mantenha umidade constante na germinação", "Luz indireta até germinar"],sub:["Substrato inerte preparado", "Semeadura realizada", "Germinação iniciada"],mais:"Substrato inerte (sem nutrientes) é essencial na hidroponia — a planta recebe 100% da alimentação pela solução nutritiva, não pelo substrato. Isso dá controle total sobre o que a planta recebe, mas também exige que a solução esteja sempre correta."},{icon:"🌿",titulo:"Transplante para o sistema",desc:"Transfira as mudas pro sistema definitivo quando tiverem raízes bem desenvolvidas, geralmente 10-15 dias após a semeadura.",dicas:["Raiz fraca demora mais pra pegar", "Espace conforme a cultura escolhida", "Registre a data do transplante"],sub:["Mudas com raiz desenvolvida", "Transplante realizado", "Data registrada no Calendário"],mais:"Transplantar cedo demais (raiz pouco desenvolvida) aumenta a taxa de perda de mudas no sistema definitivo. Vale esperar as raízes brancas saírem visivelmente do substrato antes de mudar de lugar."}]},{nome:"Manejo da Solução Nutritiva",icon:"⚗️",cor:"#65A30D",etapas:[{icon:"⚡",titulo:"Preparo e monitoramento de EC/pH",desc:"Prepare a solução com os sais nutritivos corretos e monitore EC (condutividade) e pH diariamente.",dicas:["pH ideal geralmente 5.5–6.5", "EC varia por fase de crescimento", "Use medidor digital (caneta EC/pH)"],sub:["Solução nutritiva preparada", "EC e pH medidos e ajustados", "Rotina diária de monitoramento definida"],mais:"EC (condutividade elétrica) indica a concentração de nutrientes dissolvidos — muito alta prejudica a planta, muito baixa deixa faltando nutriente. pH fora da faixa trava a absorção de nutrientes mesmo que eles estejam na solução, do mesmo jeito que acontece no solo."},{icon:"🔄",titulo:"Troca periódica da solução",desc:"Troque a solução completa a cada 10-15 dias, mesmo mantendo os níveis de EC/pH corretos no dia a dia.",dicas:["Solução velha acumula sais desequilibrados", "Limpe o reservatório na troca", "Nunca deixe faltar solução no sistema"],sub:["Frequência de troca definida", "Primeira troca completa realizada", "Reservatório limpo na troca"],mais:"Mesmo corrigindo EC e pH diariamente, alguns sais se acumulam de forma desequilibrada na solução com o tempo, o que só se resolve trocando tudo. Aproveite a troca pra limpar o reservatório e evitar acúmulo de biofilme."}]},{nome:"Colheita e Comercialização",icon:"💰",cor:"#E84855",etapas:[{icon:"🥬",titulo:"Colheita",desc:"Colha no ponto ideal — hidroponia costuma antecipar a colheita comparado ao cultivo em solo, pelo crescimento mais rápido.",dicas:["Corte pela manhã, mais fresco", "Sistema permite colheita contínua em alguns casos", "Higienize bem antes de embalar"],sub:["Ponto de colheita identificado", "Colheita realizada", "Produto higienizado"],mais:"Um dos maiores atrativos da hidroponia é o ciclo mais curto e a produtividade por m² maior que no solo, o que ajuda a compensar o investimento inicial mais alto no sistema. Produto hidropônico costuma ser vendido como diferencial de limpeza e frescor."},{icon:"💰",titulo:"Venda direta",desc:"Destaque a origem hidropônica na venda — muitos consumidores pagam mais por isso, associando à limpeza e ausência de terra.",dicas:["Embalagem com raiz ainda presa dura mais", "Feiras e mercados valorizam o diferencial", "Fidelize clientes com entrega regular"],sub:["Canal de venda escolhido", "Diferencial hidropônico destacado na venda", "Primeira venda realizada"],mais:"Vender com a raiz presa (alface em vaso, por exemplo) prolonga a vida útil do produto na gôndola ou na casa do cliente, um diferencial forte da hidroponia sobre o cultivo tradicional."}]}];}
function construirFases(cultura,organico){if(cultura.tipoCultivo==='cogumelo')return construirFasesCogumelo(cultura);if(cultura.tipoCultivo==='apicultura')return construirFasesApicultura(cultura);if(cultura.tipoCultivo==='hidroponia')return construirFasesHidroponia(cultura);const fasesBase=[{nome:'Planejamento',icon:'📋',cor:'#3B82F6',etapas:[{icon:'📐',titulo:'Definir área e cultivar',desc:'Decida a área e o cultivar adequado ao seu clima e mercado.',dicas:['Compare cultivares','Comece pequeno','Use a calculadora'],sub:['Área medida e confirmada','Cultivar escolhido','Comprador/mercado identificado'],mais:'Antes de decidir, rode a calculadora com 2-3 cultivares diferentes e compare o lucro projetado. Pense também se você já tem comprador garantido ou vai vender no mercado aberto — isso muda a estratégia de venda depois. Culturas de ciclo curto dão retorno mais rápido, mas normalmente com margem menor por safra.'},{icon:'💰',titulo:'Levantar capital',desc:`Custo estimado: ${fmt(cultura.custImpl)}/ha.`,dicas:['PRONAF: juros 3–6% a.a.','Reserve 20% de contingência','Planeje fluxo de caixa'],sub:['Orçamento total calculado','Fonte de recurso definida','Reserva de emergência separada'],mais:'PRONAF é a linha mais acessível pra pequeno produtor, com juros bem menores que banco comum. Documentos geralmente incluem CPF, comprovante de propriedade/posse da terra e um plano simples do que vai plantar. Procure o Banco do Brasil ou uma cooperativa de crédito da sua região.'}]},{nome:'Preparo do Solo',icon:'🌍',cor:'#F97316',etapas:[{icon:'🧪',titulo:'Análise e correção',desc:'pH ideal varia. Aplique calcário 30–60 dias antes de plantar.',dicas:['Análise: R$ 30–50','Corrija boro e zinco','pH define produtividade'],sub:['Amostra de solo coletada','Laudo da análise recebido','Correção aplicada'],mais:'Colete a amostra de vários pontos da área (não só um canto) e misture antes de enviar — isso representa melhor o solo todo. Aplique o calcário com antecedência, porque ele reage devagar com o solo; jogar na hora do plantio não corrige a tempo.'},{icon:'🚜',titulo:'Preparo mecânico',desc:'Aração profunda, subsolagem e gradagem.',dicas:['Subsolagem rompe compactação','Drene áreas úmidas','Prepare com 60 dias'],sub:['Área limpa e nivelada','Drenagem verificada','Aração/gradagem concluída'],mais:'Solo compactado (comum em área que já foi pasto) trava o crescimento das raízes. Subsolagem rompe essa camada dura no fundo. Evite preparar o solo em dia de chuva ou solo muito encharcado — isso compacta ainda mais em vez de ajudar.'}]},{nome:'Plantio',icon:'🌱',cor:'#22C55E',etapas:[{icon:'🌿',titulo:'Mudas certificadas',desc:'Use material certificado pelo MAPA.',dicas:['Nunca sem certificação','Compre 10% a mais','Armazene adequadamente'],sub:['Fornecedor certificado escolhido','Mudas/sementes compradas','Material armazenado corretamente'],mais:'Compre um pouco além do necessário pra cobrir o replantio de falhas, que é normal acontecer. Guarde nota fiscal e etiqueta do lote — é sua garantia caso apareça algum problema genético ou de doença mais adiante.'},{icon:'🌾',titulo:`Plantio de ${cultura.nome}`,desc:'Siga espaçamento e época ideal.',dicas:['Irrigue imediatamente','Replante falhas em 7 dias','Registre a data'],sub:['Espaçamento definido','Plantio realizado','Irrigação inicial feita'],mais:'Regue logo depois do plantio mesmo se for chover — a muda precisa de contato firme com a terra, e a água ajuda a acomodar o solo em volta da raiz. Marque a data exata no Calendário; isso ajuda a prever a colheita depois.'}]},{nome:'Crescimento',icon:'🌿',cor:'#65A30D',etapas:[{icon:'🧬',titulo:'Adubação',desc:'Aplique NPK conforme análise foliar.',dicas:['Análise foliar a cada 45 dias','Fertirrigação é eficiente','Sem exagero em nitrogênio'],sub:['Análise foliar feita','Plano de adubação definido','Primeira aplicação realizada'],mais:'Análise foliar (da folha, não do solo) mostra o que a planta está realmente absorvendo, complementando a análise de solo. Nitrogênio em excesso deixa a planta bonita mas fraca e mais vulnerável a pragas — siga a recomendação, sem exagerar na dose.'},{icon:'🔬',titulo:'Controle de pragas',desc:'Monitore semanalmente. Fungicidas a cada 7–10 dias.',dicas:['MIP reduz custos 50%','Alterne princípios ativos','Remova material doente'],sub:['Monitoramento semanal iniciado','Manejo/produto definido','Primeira inspeção registrada'],mais:'Ande pela área olhando embaixo das folhas, não só por cima — muitas pragas e ovos ficam escondidos ali. Alternar o princípio ativo (não repetir sempre o mesmo produto) evita que a praga vire resistente a ele.'}]},{nome:'Colheita',icon:cultura.emoji,cor:'#E84855',etapas:[{icon:cultura.emoji,titulo:`Colheita de ${cultura.nome}`,desc:'Colha no ponto ideal, pela manhã.',dicas:['Calibre correto','Manhã é melhor','Caixas limpas'],sub:['Ponto de colheita identificado','Mão de obra organizada','Colheita iniciada'],mais:'Colher antes ou depois do ponto ideal afeta direto o preço que você consegue vender. Produtos colhidos de manhã, mais frescos, aguentam mais tempo até a venda ou o transporte.'},{icon:'💰',titulo:'Comercialização',desc:'Venda direta paga 2–3× mais.',dicas:['WhatsApp gratuito','Embale com identidade','Fidelize clientes'],sub:['Canal de venda escolhido','Embalagem definida','Primeira venda realizada'],mais:'Combine o preço antes de entregar, não depois — isso evita ficar na mão do comprador na hora de fechar. Embalagem com identidade (nome, foto, contato) faz o cliente lembrar de você na próxima compra.'}]}];if(!organico)return fasesBase;const fasesOrg=JSON.parse(JSON.stringify(fasesBase));fasesOrg[0].etapas[1].dicas=['PRONAF: juros 3–6% a.a.','Inclua o custo da certificação orgânica no orçamento','Planeje fluxo de caixa'];fasesOrg[0].etapas[1].mais='A certificação orgânica (por auditoria ou sistema participativo) tem custo e leva tempo — pesquise cooperativas ou associações de produtores orgânicos da sua região, que costumam dividir o custo entre vários produtores.';fasesOrg[1].etapas[0].dicas=['Análise: R$ 30–50','Corrija com calcário e insumos permitidos no orgânico','pH define produtividade'];fasesOrg[3].etapas[0].titulo='Adubação orgânica';fasesOrg[3].etapas[0].desc='Use compostagem, adubação verde e esterco curtido — sem fertilizante sintético.';fasesOrg[3].etapas[0].dicas=['Compostagem própria reduz custo','Adubação verde melhora o solo a longo prazo','Nunca use esterco fresco (queima a planta)'];fasesOrg[3].etapas[0].sub=['Fonte de matéria orgânica definida','Compostagem ou adubo orgânico preparado','Primeira aplicação realizada'];fasesOrg[3].etapas[0].mais='Compostagem caseira (restos vegetais, esterco curtido) reduz o custo de adubação com o tempo, mas exige planejamento — leva de 60 a 90 dias pra ficar pronta. Adubação verde (plantar leguminosas pra depois incorporar ao solo) enriquece o solo naturalmente com nitrogênio.';fasesOrg[3].etapas[1].titulo='Controle biológico de pragas';fasesOrg[3].etapas[1].desc='Use inimigos naturais, armadilhas e extratos vegetais — sem defensivo sintético.';fasesOrg[3].etapas[1].dicas=['MIP orgânico é ainda mais importante aqui','Calda de fumo e nim são opções naturais','Insetos benéficos ajudam a controlar pragas'];fasesOrg[3].etapas[1].sub=['Método de controle biológico escolhido','Monitoramento semanal iniciado','Primeiro tratamento natural aplicado'];fasesOrg[3].etapas[1].mais='Sem defensivo sintético, a prevenção pesa ainda mais: rotação de cultura, plantas repelentes ao lado e monitoramento frequente evitam que a praga vire um problema grande. Nim e calda de fumo são alternativas naturais amplamente usadas.';fasesOrg[4].etapas[1].dicas=['Selo orgânico valoriza o produto','WhatsApp gratuito','Fidelize clientes que valorizam produção sem agrotóxico'];fasesOrg[4].etapas[1].mais='O selo orgânico (SISORG ou selo de sistema participativo) é o principal argumento de venda — deixe visível na embalagem e conte a história do seu cultivo pro cliente, isso justifica o preço mais alto.';return fasesOrg;}
function calcularEtapasComData(cultura,dataInicioStr){const fases=construirFases(cultura);const cicloDias=Math.round(cultura.ciclo*30);const fracoes=[0,0.03,0.10,0.20,0.25,0.30,0.55,0.75,1.0,1.05];let idx=0;const lista=[];fases.forEach(fase=>{fase.etapas.forEach((et,i)=>{const offset=Math.round(fracoes[idx]*cicloDias);const data=new Date(dataInicioStr+'T12:00');data.setDate(data.getDate()+offset);lista.push({id:`etapa-${idx}`,titulo:et.titulo,icon:et.icon,faseNome:fase.nome,faseCor:fase.cor,data,dataISO:data.toISOString().slice(0,10)});idx++;});});return lista;}
function PlanoScreen({cultura,regiao,userId,onProgresso,onAbrirNotas}){const[organico,setOrganico]=useState(false);const fases=construirFases(cultura,organico);const[progresso,setProgresso]=useState({});const[carregando,setCarregando]=useState(true);const[dataInicio,setDataInicio]=useState(null);const[carregandoData,setCarregandoData]=useState(true);const[dataTemp,setDataTemp]=useState(()=>new Date().toISOString().slice(0,10));const[subChecks,setSubChecks]=useState({});const[maisAberto,setMaisAberto]=useState({});useEffect(()=>{if(!userId){setCarregando(false);return;}sb.from('plano_progresso').select('etapa_id,feito,feito_em').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).then(({data})=>{const m={};(data||[]).forEach(r=>{m[r.etapa_id]={feito:r.feito,feito_em:r.feito_em};});setProgresso(m);setCarregando(false);});},[userId,cultura.nome]);useEffect(()=>{if(!userId){setCarregandoData(false);return;}sb.from('planos_inicio').select('data_inicio,organico').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).maybeSingle().then(({data})=>{if(data){setDataInicio(data.data_inicio);setOrganico(data.organico===true);}setCarregandoData(false);});},[userId,cultura.nome]);async function confirmarDataInicio(){setDataInicio(dataTemp);if(userId){await sb.from('planos_inicio').upsert({usuario_id:userId,cultura_nome:cultura.nome,data_inicio:dataTemp,ciclo_meses:cultura.ciclo,organico},{onConflict:'usuario_id,cultura_nome'});}}async function alternarOrganico(){const novo=!organico;setOrganico(novo);if(userId&&dataInicio){await sb.from('planos_inicio').update({organico:novo}).eq('usuario_id',userId).eq('cultura_nome',cultura.nome);}}const etapasComData=dataInicio?calcularEtapasComData(cultura,dataInicio):null;const dataPorId=etapasComData?Object.fromEntries(etapasComData.map(e=>[e.id,e])):{};const hojeISO=new Date().toISOString().slice(0,10);async function marcar(id){const nf=!(progresso[id]?.feito||false);setProgresso(prev=>({...prev,[id]:{feito:nf,feito_em:nf?new Date().toISOString():null}}));if(onProgresso)setTimeout(onProgresso,300);if(!userId)return;await sb.from('plano_progresso').upsert({usuario_id:userId,cultura_nome:cultura.nome,etapa_id:id,feito:nf,feito_em:nf?new Date().toISOString():null},{onConflict:'usuario_id,cultura_nome,etapa_id'});}const todos=fases.flatMap(f=>f.etapas.map((_,i)=>`${f.nome}-${i}`));const feitos=todos.filter(id=>progresso[id]?.feito).length;const pct=Math.round(feitos/todos.length*100);const[exp,setExp]=useState(null);if(carregando)return(<div style={{display:'flex',justifyContent:'center',padding:60}}><div style={{width:36,height:36,border:'3px solid #E8ECE6',borderTopColor:cultura.cor,borderRadius:'50%',animation:'spin 1s linear infinite'}} /></div>);return(<div style={{paddingBottom:120,background:'#F4F6F3',minHeight:'100vh'}}><div style={{padding:'20px 22px 0'}}><div style={{fontSize:11,fontWeight:700,color:'#A3AD9D',textTransform:'uppercase'}}>Plano de Produção</div><div className='serif' style={{fontSize:22,fontWeight:800,color:'#1B4332',marginTop:2}}>{cultura.emoji} {cultura.nome}</div></div><div style={{padding:'16px 22px 0',display:'flex',flexDirection:'column',gap:12}}><div style={{background:'linear-gradient(135deg,#1B4332,#14532D)',borderRadius:18,padding:'18px',boxShadow:'0 6px 20px rgba(27,67,50,.25)'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><div className='serif' style={{fontSize:22,fontWeight:800,color:'#fff'}}>{pct}% concluído</div><div style={{fontSize:12,color:'rgba(255,255,255,.6)'}}>{feitos}/{todos.length} etapas</div></div><div style={{height:8,borderRadius:99,background:'rgba(255,255,255,.15)',overflow:'hidden'}}><div style={{width:`${pct}%`,height:'100%',background:'#4ADE80',transition:'width .5s'}} /></div>{userId&&<div style={{fontSize:11,color:'#4ADE80',marginTop:10,fontWeight:600}}>☁️ Progresso salvo na nuvem</div>}</div>{!carregandoData&&!dataInicio&&(<div style={{background:'#fff',borderRadius:16,padding:'16px',boxShadow:'0 2px 8px rgba(0,0,0,.04)',border:'1.5px solid #FDE68A'}}><div style={{fontSize:13,fontWeight:800,color:'#1B4332',marginBottom:4}}>📅 Quando você pretende começar?</div><div style={{fontSize:11.5,color:'#8A9584',marginBottom:10,lineHeight:1.5}}>Defina a data e o app calcula automaticamente quando cada etapa deveria acontecer, com avisos no calendário</div><div style={{display:'flex',gap:8}}><input type='date' value={dataTemp} onChange={e=>setDataTemp(e.target.value)} style={{flex:1,border:'1px solid #E8ECE6',borderRadius:10,padding:'9px 12px',fontSize:12.5,fontFamily:'inherit',outline:'none',color:'#3F5C48'}} /><button onClick={confirmarDataInicio} style={{padding:'9px 16px',background:'#1B4332',color:'#fff',border:'none',borderRadius:10,fontSize:12,fontWeight:800}}>Confirmar</button></div></div>)}{dataInicio&&<div style={{fontSize:11,color:'#8A9584',fontWeight:600}}>📅 Início em {new Date(dataInicio+'T12:00').toLocaleDateString('pt-BR')} · datas previstas calculadas abaixo</div>}{cultura.tipoCultivo!=='cogumelo'&&cultura.tipoCultivo!=='apicultura'&&cultura.tipoCultivo!=='hidroponia'&&<div onClick={alternarOrganico} style={{background:organico?'#F0FDF4':'#fff',border:organico?'1.5px solid #22C55E':'1px solid #E8ECE6',borderRadius:12,padding:'11px 13px',display:'flex',alignItems:'center',gap:9,cursor:'pointer'}}><div style={{width:34,height:20,borderRadius:10,background:organico?'#22C55E':'#D1D5DB',position:'relative',flexShrink:0,transition:'all .2s'}}><div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:2,left:organico?16:2,transition:'all .2s'}} /></div><div style={{fontSize:12,fontWeight:800,color:'#1B4332'}}>🌱 Este plano é orgânico</div></div>}{fases.map((fase,faseIdx)=>{const et=fase.etapas.map((_,i)=>({...fase.etapas[i],_id:`etapa-${faseIdx*2+i}`}));const dn=et.filter(e=>progresso[e._id]?.feito).length;return(<div key={fase.nome}><div style={{display:'flex',alignItems:'center',gap:9,marginBottom:8,marginTop:4}}><div style={{width:34,height:34,borderRadius:11,background:dn===et.length&&et.length>0?fase.cor:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,boxShadow:'0 2px 8px rgba(0,0,0,.05)'}}>{dn===et.length&&et.length>0?'✓':fase.icon}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:800,color:'#1B4332'}}>{fase.nome}</div><div style={{fontSize:10,color:'#A3AD9D'}}>{dn}/{et.length} etapas</div></div></div>{et.map(e=>{const ok=progresso[e._id]?.feito||false;const isX=exp===e._id;const df=progresso[e._id]?.feito_em?new Date(progresso[e._id].feito_em).toLocaleDateString('pt-BR'):null;return(<div key={e._id} style={{background:'#fff',borderRadius:14,marginBottom:8,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,.04)',border:ok?`1.5px solid ${fase.cor}44`:'1.5px solid transparent'}}><div onClick={()=>setExp(isX?null:e._id)} style={{padding:'13px 15px',cursor:'pointer',display:'flex',gap:11,alignItems:'center'}}><button onClick={ev=>{ev.stopPropagation();marcar(e._id);}} style={{width:26,height:26,borderRadius:8,border:`2px solid ${ok?fase.cor:'#D8DFD4'}`,background:ok?fase.cor:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0}}>{ok&&<span style={{color:'#fff'}}>✓</span>}</button><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:ok?'#A3AD9D':'#1B4332',textDecoration:ok?'line-through':'none'}}>{e.icon} {e.titulo}</div>{ok&&df&&<div style={{fontSize:10,color:fase.cor,marginTop:2}}>Concluído em {df}</div>}{!ok&&dataPorId[e._id]&&(()=>{const prevista=dataPorId[e._id];const atrasado=prevista.dataISO<hojeISO;const hoje=prevista.dataISO===hojeISO;return(<div style={{fontSize:10,marginTop:2,fontWeight:700,color:atrasado?'#E84855':hoje?'#F97316':'#A3AD9D'}}>{atrasado?'⚠️ Atrasado — previsto ':hoje?'🔔 Hoje · ':'📅 Previsto '}{prevista.data.toLocaleDateString('pt-BR')}</div>);})()}</div><span style={{fontSize:13,color:'#C0C9BC'}}>{isX?'▲':'▼'}</span></div>{isX&&(<div style={{padding:'0 15px 14px',borderTop:'1px solid #F0F4EE'}}><p style={{fontSize:12.5,color:'#5A6857',lineHeight:1.7,margin:'10px 0'}}>{e.desc}</p><div style={{background:'#F4F6F3',borderRadius:10,padding:'10px 12px'}}>{e.dicas.map((d,di)=>(<div key={di} style={{display:'flex',gap:6,marginBottom:4}}><span style={{color:fase.cor,fontSize:12}}>→</span><span style={{fontSize:12,color:'#5A6857'}}>{d}</span></div>))}</div>{e.sub&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:7}}>{e.sub.map((s,si)=>{const chave=`${e._id}-${si}`;const on=!!subChecks[chave];return(<div key={si} onClick={()=>setSubChecks(p=>({...p,[chave]:!p[chave]}))} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}><div style={{width:16,height:16,borderRadius:5,border:`1.5px solid ${on?fase.cor:'#C0C9BC'}`,background:on?fase.cor:'transparent',flexShrink:0}} /><span style={{fontSize:11.5,color:on?'#A3AD9D':'#3F5C48',textDecoration:on?'line-through':'none'}}>{s}</span></div>);})}</div>}{e.mais&&(()=>{const abertoMais=!!maisAberto[e._id];return(<div style={{marginTop:10}}>{abertoMais&&<p style={{fontSize:11.5,color:'#5A6857',lineHeight:1.65,margin:'0 0 8px'}}>{e.mais}</p>}<button onClick={()=>setMaisAberto(p=>({...p,[e._id]:!p[e._id]}))} style={{background:'none',border:'none',color:fase.cor,fontSize:11,fontWeight:700,padding:0,cursor:'pointer'}}>{abertoMais?'Ver menos ▴':'Ver mais ▾'}</button></div>);})()}</div>)}</div>);})}</div>);})}{feitos===todos.length&&todos.length>0&&(<div style={{background:'linear-gradient(135deg,#22C55E,#16A34A)',borderRadius:18,padding:'22px',textAlign:'center',color:'#fff',boxShadow:'0 6px 20px rgba(34,197,94,.3)'}}><div style={{fontSize:38}}>🏆</div><div style={{fontSize:18,fontWeight:800,marginTop:8}}>Plano concluído!</div></div>)}{onAbrirNotas&&<button onClick={onAbrirNotas} style={{marginTop:22,width:'100%',background:'#fff',border:'1.5px solid #E8ECE6',borderRadius:16,padding:'14px 16px',display:'flex',alignItems:'center',gap:11,textAlign:'left'}}><div style={{width:36,height:36,borderRadius:11,background:'#F4F6F3',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>📝</div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:800,color:'#1B4332'}}>Minhas Anotações</div><div style={{fontSize:11,color:'#8A9584'}}>Aplicação, adubação, pragas e notas gerais</div></div><span style={{fontSize:14,color:'#C0C9BC'}}>→</span></button>}</div></div>);}

function ChatScreen({cultura,regiao,session,onBack}){const saudacao=cultura?`Oi! Eu sou a Easy, sua assistente agro pessoal 🌱 Pode perguntar sobre ${cultura.nome} — praga, adubação, irrigação, época de plantio — ou me mandar uma foto da folha/fruto pra eu avaliar.`:'Oi! Eu sou a Easy, sua assistente agro pessoal 🌱 Pode me perguntar qualquer coisa sobre cultivo, ou mandar uma foto de uma folha ou fruto pra eu avaliar possíveis pragas ou doenças.';const[msgs,setMsgs]=useState([{role:'assistant',content:saudacao}]);const[input,setInput]=useState('');const[imagem,setImagem]=useState(null);const[enviando,setEnviando]=useState(false);const[limiteInfo,setLimiteInfo]=useState(null);const[erro,setErro]=useState('');function selecionarImagem(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const maxDim=1024;let w=img.width,h2=img.height;if(w>maxDim||h2>maxDim){if(w>h2){h2=Math.round(h2*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h2);h2=maxDim;}}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h2;canvas.getContext('2d').drawImage(img,0,0,w,h2);const dataUrl=canvas.toDataURL('image/jpeg',0.72);setImagem({base64:dataUrl.split(',')[1],mediaType:'image/jpeg',previewUrl:dataUrl});};img.src=ev.target.result;};reader.readAsDataURL(f);e.target.value='';}async function enviar(){const texto=input.trim();if(!texto&&!imagem)return;if(enviando)return;setErro('');const conteudo=imagem?[{type:'image',source:{type:'base64',media_type:imagem.mediaType,data:imagem.base64}},{type:'text',text:texto||'Analise esta foto da minha lavoura e me diga se há algum problema.'}]:texto;const novaLista=[...msgs,{role:'user',content:conteudo,previewUrl:imagem?imagem.previewUrl:null}];setMsgs(novaLista);setInput('');setImagem(null);setEnviando(true);try{const accessToken=session?.access_token;const payload={messages:novaLista.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content})),cultura:cultura?{nome:cultura.nome}:null,regiao:regiao?{label:regiao.label}:null,accessToken};const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok){if(r.status===429){setErro(`Você atingiu o limite de ${data.limite||20} mensagens hoje. Volta amanhã!`);}else{setErro('Não consegui responder agora. Tenta de novo em instantes.');}}else{setMsgs(p=>[...p,{role:'assistant',content:data.texto||'Desculpa, não consegui gerar uma resposta.'}]);setLimiteInfo({usadas:data.usadas,limite:data.limite});}}catch(e){setErro('Sem conexão. Verifica sua internet e tenta de novo.');}setEnviando(false);}return(<div style={{minHeight:'100vh',background:'#F4F6F3',display:'flex',flexDirection:'column'}}><div style={{position:'sticky',top:0,zIndex:100,background:'rgba(244,246,243,.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid #E8ECE6',padding:'12px 18px',display:'flex',alignItems:'center',gap:12}}><button onClick={onBack} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:10,padding:'8px 11px',fontSize:11,fontWeight:700,color:'#5A6857',flexShrink:0}}>←</button><div style={{width:36,height:36,borderRadius:11,overflow:'hidden',flexShrink:0}}><img src={ICON} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>e.target.style.display='none'} /></div><div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800,color:'#1B4332'}}>Easy</div><div style={{fontSize:11,color:'#8A9584'}}>{cultura?`${cultura.emoji} ${cultura.nome}`:'Assistente agro geral'}{limiteInfo?` · ${limiteInfo.usadas}/${limiteInfo.limite} hoje`:''}</div></div></div><div style={{flex:1,padding:'16px 16px 8px',display:'flex',flexDirection:'column',gap:10}}>{msgs.map((m,i)=>{const textoExibir=typeof m.content==='string'?m.content:(m.content.find(b=>b.type==='text')?.text||'');return(<div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}><div style={{maxWidth:'82%',background:m.role==='user'?'#1B4332':'#fff',color:m.role==='user'?'#fff':'#3F5C48',borderRadius:16,borderBottomRightRadius:m.role==='user'?4:16,borderBottomLeftRadius:m.role==='user'?16:4,padding:'10px 14px',fontSize:13.5,lineHeight:1.55,boxShadow:m.role==='user'?'none':'0 2px 8px rgba(0,0,0,.04)',whiteSpace:'pre-wrap'}}>{m.previewUrl&&<img src={m.previewUrl} style={{width:'100%',maxWidth:200,borderRadius:12,marginBottom:textoExibir?8:0,display:'block'}} />}{textoExibir}</div></div>);})}{enviando&&(<div style={{display:'flex',justifyContent:'flex-start'}}><div style={{background:'#fff',borderRadius:16,borderBottomLeftRadius:4,padding:'12px 16px',boxShadow:'0 2px 8px rgba(0,0,0,.04)',display:'flex',gap:4}}>{[0,1,2].map(i=>(<div key={i} style={{width:6,height:6,borderRadius:'50%',background:'#C0C9BC',animation:'spin 1s linear infinite',animationDelay:`${i*0.15}s`,opacity:.6}} />))}</div></div>)}{erro&&(<div style={{background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:12,padding:'10px 14px',fontSize:12,color:'#B91C1C',fontWeight:600}}>{erro}</div>)}</div>{imagem&&(<div style={{padding:'0 16px 8px'}}><div style={{position:'relative',width:64,height:64}}><img src={imagem.previewUrl} style={{width:64,height:64,borderRadius:12,objectFit:'cover'}} /><button onClick={()=>setImagem(null)} style={{position:'absolute',top:-6,right:-6,width:20,height:20,borderRadius:'50%',background:'#1B4332',color:'#fff',border:'none',fontSize:11,lineHeight:1}}>✕</button></div></div>)}<div style={{position:'sticky',bottom:0,background:'#F4F6F3',padding:'8px 16px 22px',display:'flex',gap:8}}><label style={{width:44,height:44,borderRadius:14,background:'#fff',border:'1px solid #E2E9DE',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer'}}><svg width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='#1B4332' strokeWidth='1.8' strokeLinecap='round' strokeLinejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2 function SecaoNota({cat,entradas,onAdd,onDelete}){const[aberto,setAberto]=useState(false);const[data,setData]=useState(()=>new Date().toISOString().slice(0,10));const[texto,setTexto]=useState('');const[foto,setFoto]=useState(null);const[fotoPreview,setFotoPreview]=useState(null);const[enviando,setEnviando]=useState(false);function selecionarFoto(e){const f=e.target.files[0];if(!f)return;setFoto(f);setFotoPreview(URL.createObjectURL(f));}async function salvar(){if(!texto.trim()&&!foto)return;setEnviando(true);await onAdd(cat.id,{texto:texto.trim(),foto,data:cat.comData?data:null});setTexto('');setFoto(null);setFotoPreview(null);setEnviando(false);}return(<div style={{background:'#fff',borderRadius:16,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,.04)',marginBottom:10}}><div onClick={()=>setAberto(!aberto)} style={{padding:'13px 15px',display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}><div style={{width:34,height:34,borderRadius:10,background:`${cat.cor}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{cat.icon}</div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:800,color:'#1B4332'}}>{cat.titulo}</div><div style={{fontSize:10.5,color:'#A3AD9D'}}>{entradas.length===0?'Nenhum registro':`${entradas.length} registro${entradas.length>1?'s':''}`}</div></div><span style={{fontSize:12,color:'#C0C9BC'}}>{aberto?'▲':'▼'}</span></div>{aberto&&(<div style={{padding:'0 15px 15px'}}>{entradas.length>0&&<div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>{entradas.map(n=>(<div key={n.id} style={{background:'#F4F6F3',borderRadius:12,padding:'10px 12px',display:'flex',gap:9}}>{n.foto_url&&<img src={n.foto_url} style={{width:44,height:44,borderRadius:9,objectFit:'cover',flexShrink:0}} />}<div style={{flex:1,minWidth:0}}>{n.texto&&<div style={{fontSize:12.5,color:'#3F5C48',lineHeight:1.5}}>{n.texto}</div>}<div style={{fontSize:10,color:'#A3AD9D',marginTop:3}}>{n.data_evento?new Date(n.data_evento+' function NotaEditorScreen({cultura,userId,onBack}){const[entradas,setEntradas]=useState([]);const[loading,setLoading]=useState(true);function carregar(){if(!userId){setLoading(false);return;}sb.from('notas_cultura').select('*').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).order('criado_em',{ascending:false}).then(({data})=>{setEntradas(data||[]);setLoading(false);});}useEffect(()=>{carregar();},[userId,cultura.nome]);async function onAdd(categoria,{texto,foto,data}){let foto_url=null;try{if(foto){const ext=(foto.name.split('.').pop()||'jpg').toLowerCase();const path=`${userId}/${cultura.nome}/${Date.now()}.${ext}`;const{error:upErr}=await sb.storage.from('notas-fotos').upload(path,foto);if(upErr)throw upErr;const{data:pub}=sb.storage.from('notas-fotos').getPublicUrl(path);foto_url=pub.publicUrl;}await sb.from('notas_cultura').insert({usuario_id:userId,cultura_nome:cultura.nome,categoria,texto:texto||null,foto_url,data_evento:data});carregar();}catch(e){console.error(e);}}async function onDelete(id){await sb.from('notas_cultura').delete().eq('id',id);setEntradas(p=>p.filter(n=>n.id!==id));}return(<div style={{minHeight:'100vh',background:'#F4F6F3',paddingBottom:40}}><div style={{position:'sticky',top:0,zIndex:100,background:'rgba(244,246,243,.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid #E8ECE6',padding:'12px 18px',display:'flex',alignItems:'center',gap:12}}><button onClick={onBack} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:10,padding:'8px 11px',fontSize:11,fontWeight:700,color:'#5A6857',flexShrink:0}}>←</button><div style={{width:36,height:36,borderRadius:11,overflow:'hidden',flexShrink:0}}><CardFoto nome={cultura.nome} cor={cultura.cor} emoji={cultura.emoji} altura={36} /></div><div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800,color:'#1B4332'}}>{cultura.emoji} {cultura.nome}</div><div style={{fontSize:11,color:'#8A9584'}}>{entradas.length} registro{entradas.length!==1?'s':''} no total</div></div> function App(){const[session,setSession]=useState(undefined);const[sel,setSel]=useState(null);const[screen,setScreen]=useState(0);const[planos,setPlanos]=useState([]);const[historico,setHistorico]=useState([]);const[precarregar,setPrecarregar]=useState(null);const[notaSel,setNotaSel]=useState(null);const[cidadeSalva,setCidadeSalva]=useState(null);const[cidadeHome,setCidadeHome]=useState(undefined);const[planoAtual,setPlanoAtual]=useState(undefined);const[assinaturaExpiraEm,setAssinaturaExpiraEm]=useState(null);const[paywallAberto,setPaywallAberto]=useState(false);const[assinaturaAberta,setAssinaturaAberta]=useState(false);const[culturaLiberadaHoje,setCulturaLiberadaHoje]=useState(undefined);const[paywallMotivo,setPaywallMotivo]=useState('');const[telaOrigem,setTelaOrigem]=useState(null);const uid=session?.user?.id;const TODAS_CULTURAS=[...REGIOES.flatMap(rg=>rg.culturas.map(c=>({c,rg}))),...VERDURAS.culturas.map(c=>({c,rg:{id:'geral',label:'Verduras',emoji:VERDURAS.emoji}})),...TEMPEROS.culturas.map(c=>({c,rg:{id:'geral',label:'Temperos',emoji:TEMPEROS.emoji}})),...COGUMELOS.culturas.map(c=>({c,rg:{id:'geral',label:'Cogumelos',emoji:COGUMELOS.emoji}})),...APICULTURA.culturas.map(c=>({c,rg:{id:'geral',label:'Apicultura',emoji:APICULTURA.emoji}})),...FLORES.culturas.map(c=>({c,rg:{id:'geral',label:'Flores',emoji:FLORES.emoji}})),...HIDROPONIA.culturas.map(c=>({c,rg:{id:'geral',label:'Hidroponia',emoji:HIDROPONIA.emoji}}))];function carregarResumo(id){if(!id)return;sb.from('plano_progresso').select('cultura_nome,feito').eq('usuario_id',id).then(({data})=>{const pc={};(data||[]).forEach(r=>{if(!pc[r.cultura_nome])pc[r.cultura_nome]={feitos:0};if(r.feito)pc[r.cultura_nome].feitos++;});const lista=[];Object.keys(pc).forEach(n=>{if(pc[n].feitos>0){const found=TODAS_CULTURAS.find(x=>x.c.nome===n);if(found)lista.push({cultura:found.c,regiao:found.rg,pct:Math.round(pc[n].feitos/10*100)});}});setPlanos(lista);});sb.from('simulacoes').select('id').eq('usuario_id',id).then(({data})=>setHistorico(data||[]));}
function abrirSimulacao(s){const found=TODAS_CULTURAS.find(x=>x.c.nome===s.cultura_nome);if(!found)return;setTelaOrigem(screen);setPrecarregar(s);setSel({r:found.rg,c:found.c});setScreen(0);}
function abrirPlano(p){setTelaOrigem(screen);setPrecarregar(null);setSel({r:p.regiao,c:p.cultura});setScreen(2);}function irTela(n){const bloqueadas=[2,3,4,5,6,7,8];if(bloqueadas.includes(n)&&planoAtual!=='pro'){setPaywallMotivo('');setPaywallAberto(true);return;}setScreen(n);}async function carregarCulturaHoje(id){const hojeISO=new Date().toISOString().slice(0,10);const{data}=await sb.from('calculos_diarios').select('cultura_nome').eq('usuario_id',id).eq('dia',hojeISO).maybeSingle();setCulturaLiberadaHoje(data?data.cultura_nome:null);}async function tentarSelecionar(r,c,tela){setTelaOrigem(null);if(planoAtual==='pro'){setPrecarregar(null);setSel({r,c});setScreen(tela!=null?tela:0);return;}if(culturaLiberadaHoje&&culturaLiberadaHoje!==c.nome){setPaywallMotivo(`Você já simulou ${culturaLiberadaHoje} hoje no plano grátis. Amanhã libera de novo, ou assine o Pro pra calcular sem limite.`);setPaywallAberto(true);return;}if(!culturaLiberadaHoje){const hojeISO=new Date().toISOString().slice(0,10);setCulturaLiberadaHoje(c.nome);if(uid){sb.from('calculos_diarios').upsert({usuario_id:uid,dia:hojeISO,cultura_nome:c.nome},{onConflict:'usuario_id,dia'}).then(()=>{});}}setPrecarregar(null);setSel({r,c});setScreen(tela!=null?tela:0);}
function carregarCidade(id){sb.from('usuarios').select('cidade_nome,cidade_lat,cidade_lon,cidade_regiao_id,home_cidade_nome,home_cidade_lat,home_cidade_lon,plano_atual,assinatura_expira_em').eq('id',id).single().then(({data})=>{if(data&&data.cidade_lat!=null){setCidadeSalva({regiaoId:data.cidade_regiao_id,nome:data.cidade_nome,lat:data.cidade_lat,lon:data.cidade_lon,generica:false});}if(data&&data.home_cidade_lat!=null){setCidadeHome({nome:data.home_cidade_nome,lat:data.home_cidade_lat,lon:data.home_cidade_lon});}else{setCidadeHome(null);}setPlanoAtual(data&&data.plano_atual==='pro'?'pro':'gratis');setAssinaturaExpiraEm(data&&data.assinatura_expira_em?data.assinatura_expira_em:null);}).catch(()=>{setCidadeHome(null);setPlanoAtual('gratis');});}useEffect(()=>{sb.auth.getSession().then(({data:{session}})=>{setSession(session);if(session?.user?.id){carregarResumo(session.user.id);carregarCidade(session.user.id);carregarCulturaHoje(session.user.id);}});const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{setSession(s);if(s?.user?.id){carregarResumo(s.user.id);carregarCidade(s.user.id);carregarCulturaHoje(s.user.id);}});return()=>subscription.unsubscribe();},[]);useEffect(()=>{const params=new URLSearchParams(window.location.search);if(params.get('assinatura')==='sucesso'&&uid){setTimeout(()=>carregarCidade(uid),2500);window.history.replaceState({},'','/');}else if(params.get('assinatura')){window.history.replaceState({},'','/');}},[uid]);if(session===undefined)return<SplashScreen/>;if(!session)return<AuthScreen/>;const u=session.user;if(assinaturaAberta)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><AssinaturaScreen session={session} planoAtual={planoAtual} assinaturaExpiraEm={assinaturaExpiraEm} onBack={()=>setAssinaturaAberta(false)}/></div>);if(notaSel)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><NotaEditorScreen cultura={notaSel} userId={uid} onBack={()=>setNotaSel(null)}/></div>);if(!sel){if(screen===3)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><div style={{padding:'44px 22px 0'}}><button onClick={()=>setScreen(0)} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:11,padding:'9px 14px',fontSize:12,fontWeight:700,color:'#5A6857'}}>← Página inicial</button></div><HistoricoScreen userId={uid} onAbrir={abrirSimulacao}/></div>);if(screen===4)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><div style={{padding:'44px 22px 0'}}><button onClick={()=>setScreen(0)} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:11,padding:'9px 14px',fontSize:12,fontWeight:700,color:'#5A6857'}}>← Página inicial</button></div><PlanosScreen planos={planos} onAbrir={abrirPlano}/></div>);if(screen===5)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><ChatScreen cultura={null} regiao={null} session={session} onBack={()=>setScreen(0)}/></div>);if(screen===6)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><div style={{padding:'44px 22px 0'}}><button onClick={()=>setScreen(0)} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:11,padding:'9px 14px',fontSize:12,fontWeight:700,color:'#5A6857'}}>← Página inicial</button></div><NotasListScreen userId={uid} todasCulturas={TODAS_CULTURAS} onAbrir={(cult)=>setNotaSel(cult)}/></div>);if(screen===7)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><div style={{padding:'44px 22px 0'}}><button onClick={()=>setScreen(0)} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:11,padding:'9px 14px',fontSize:12,fontWeight:700,color:'#5A6857'}}>← Página inicial</button></div><MinhaFazendaScreen userId={uid} onAbrir={abrirSimulacao}/></div>);if(screen===8)return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><div style={{padding:'44px 22px 0'}}><button onClick={()=>setScreen(0)} style={{background:'#fff',border:'1px solid #E8ECE6',borderRadius:11,padding:'9px 14px',fontSize:12,fontWeight:700,color:'#5A6857'}}>← Página inicial</button></div><CalendarioScreen userId={uid} todasCulturas={TODAS_CULTURAS} onAbrirPlano={(rg,c)=>{setTelaOrigem(8);setPrecarregar(null);setSel({r:rg,c});setScreen(2);}} onIrPlanos={()=>setScreen(4)} onAbrirNota={(cult)=>setNotaSel(cult)}/></div>);return(<><HomeScreen usuario={u} planos={planos} historico={historico} irHistorico={()=>irTela(3)} irPlanos={()=>irTela(4)} irNotas={()=>irTela(6)} irChat={()=>irTela(5)} irFazenda={()=>irTela(7)} irCalendario={()=>irTela(8)} irAssinatura={()=>setAssinaturaAberta(true)} planoAtual={planoAtual} userId={uid} cidadeSalva={cidadeSalva} onCidadeSalva={setCidadeSalva} cidadeHome={cidadeHome} onCidadeHome={setCidadeHome} onSelect={tentarSelecionar} onLogout={()=>sb.auth.signOut()} />{paywallAberto&&<PaywallModal onClose={()=>setPaywallAberto(false)} onAssinar={()=>{setPaywallAberto(false);setAssinaturaAberta(true);}} motivo={paywallMotivo} />}</>);}const{r,c}=sel;return(<div style={{minHeight:'100vh',background:'#F4F6F3',maxWidth:430,margin:'0 auto'}}><CultureBadge cultura={c} regiao={r} voltarLabel={telaOrigem!=null?'Voltar':'Página inicial'} onClear={()=>{const destino=telaOrigem!=null?telaOrigem:0;setTelaOrigem(null);setSel(null);setPrecarregar(null);setScreen(destino);carregarResumo(uid);}} />{screen===0&&<CalcScreen key={c.nome+(precarregar?precarregar.id:'')} cultura={c} regiao={r} userId={uid} precarregar={precarregar} planoAtual={planoAtual} onBloqueado={()=>setPaywallAberto(true)} onIrTela={irTela}/>}{screen===1&&<GuiaScreen key={c.nome} cultura={c} regiao={r} onIrTela={irTela}/>}{screen===2&&<PlanoScreen key={c.nome} cultura={c} regiao={r} userId={uid} onProgresso={()=>carregarResumo(uid)} onAbrirNotas={()=>setNotaSel(c)}/>}{screen===3&&<HistoricoScreen userId={uid} onAbrir={abrirSimulacao}/>}{screen===4&&<PlanosScreen planos={planos} onAbrir={abrirPlano}/>}{screen===5&&<ChatScreen key={c.nome} cultura={c} regiao={r} session={session} onBack={()=>setScreen(0)}/>}{screen!==5&&<ChatBubble onClick={()=>irTela(5)} bottom={110} />}<div style={{display:screen===5?'none':'flex',position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'rgba(255,255,255,.97)',backdropFilter:'blur(24px)',borderTop:'1px solid #E8ECE6',padding:'12px 0 22px',justifyContent:'space-around',zIndex:200}}>{[{t:'calc',l:'Calculadora'},{t:'guia',l:'Guia'},{t:'plano',l:'Plano'},{t:'hist',l:'Histórico'}].map((n,i)=>{const a=screen===i;return(<button key={i} onClick={()=>{irTela(i);if(i!==0)setPrecarregar(null);}} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5,background:'transparent',border:'none',padding:'0 10px'}}><NavIcon tipo={n.t} ativo={a} /><span style={{fontSize:9,fontWeight:a?700:500,color:a?'#1B4332':'#B8C0B2'}}>{n.l}</span></button>);})}</div>{paywallAberto&&<PaywallModal onClose={()=>setPaywallAberto(false)} onAssinar={()=>{setPaywallAberto(false);setAssinaturaAberta(true);}} motivo={paywallMotivo} />}</div>);}
