<script>
(function(){var mostrou=false;
function mostrar(titulo,detalhe){var r=document.getElementById('root');if(mostrou||!r||r.firstChild)return;mostrou=true;
r.innerHTML='<div style="margin:24px;padding:18px;border-radius:14px;background:#fff;border:1px solid #fecaca;font-family:-apple-system,BlinkMacSystemFont,sans-serif">'+
'<div style="font-size:15px;font-weight:800;color:#991b1b;margin-bottom:8px">Nao consegui abrir o CultivAI</div>'+
'<div style="font-size:13px;color:#3f5c48;line-height:1.6">'+titulo+'</div>'+
'<pre style="margin-top:10px;padding:10px;background:#f8fafc;border-radius:8px;font-size:11px;color:#475569;white-space:pre-wrap;word-break:break-word">'+detalhe+'</pre>'+
'<button onclick="location.reload()" style="margin-top:12px;width:100%;padding:11px;border:none;border-radius:10px;background:#1B4332;color:#fff;font-size:13px;font-weight:700">Tentar de novo</button></div>';}
window.addEventListener('error',function(e){var a=e.target;
if(a&&a.tagName==='SCRIPT'){mostrar('Um arquivo necessario nao carregou (conexao ou bloqueio de rede).','Nao carregou:\n'+(a.src||'?'));return;}
mostrar('Ocorreu um erro ao iniciar o app.',(e.message||'erro')+'\n'+(e.filename||'')+' linha '+(e.lineno||'')+'\n\n'+((e.error&&e.error.stack)||'sem stack'));},true);
window.addEventListener('unhandledrejection',function(e){mostrar('Erro de conexao ao iniciar.',String((e.reason&&e.reason.message)||e.reason||'promise rejeitada'));});
setTimeout(function(){var f=[];if(!window.React)f.push('React');if(!window.ReactDOM)f.push('ReactDOM');if(!window.Babel)f.push('Babel');if(!window.supabase)f.push('Supabase');
mostrar('O app demorou demais para abrir.',(f.length?('Nao carregou: '+f.join(', ')):'Bibliotecas carregaram OK')+'\nBabel: '+((window.Babel&&window.Babel.version)||'ausente'));},8000);})();
</script>

e={{fontSize:12,color:'#8A9584',lineHeight:1.4,marginBottom:12}}>{c.porque}</div><div style={{display:'flex',gap:8}}><div style={{flex:1,background:'#F0F4EE',borderRadius:12,padding:'8px 10px'}}><div style={{fontSize:10.5,color:'#A3AD9D',fontWeight:600,lineHeight:1.25}}>{c.ciclo>12?'Lucro por hectare':'Lucro por hectare'}<br/><span style={{fontSize:9.5,color:'#B8C2B4'}}>10.000 m²{c.ciclo>12?' · por ciclo':' · por ano'}</span></div><div style={{fontSize:14,fontWeight:800,color:c.cor,marginTop:2}}>{fmt(c.lucro_ha)}</div></div><div style={{flex:1,background:'#F0F4EE',borderRadius:12,padding:'8px 10px'}}><div style={{fontSize:10.5,color:'#A3AD9D',fontWeight:600,lineHeight:1.25}}>Ciclo<br/><span style={{fontSize:9.5,color:'#B8C2B4'}}>do plantio à colheita</span></div><div style={{fontSize:14,fontWeight:800,color:'#1B4332',marginTop:2}}>{c.ciclo} meses</div></div><div style={{flex:1,background:'#FFF1E4',border:'1px solid #FFD5AE',borderRadius:12,padding:'8px 10px'}}><div style={{fontSize:10.5,color:'#C2410C',fontWeight:700,lineHeight:1.25}}>{c.ciclo>12?'Colheitas':'Safras por ano'}<br/><span style={{fontSize:9.5,color:'#E29A6B'}}>{c.ciclo>12?'durante o ciclo':'em 12 meses'}</span></div><div style={{fontSize:16,fontWeight:800,color:'#EA580C',marginTop:2}}>{c.safras}×</div></div></div></div></button>);}
function CalendarioBadge({userId,todasCulturas}){const[count,setCount]=useState(null);useEffect(()=>{if(!userId){setCount(0);return;}async function carregar(){const{data:inicios}=await sb.from('planos_inicio').select('cultura_nome,data_inicio').eq('usuario_id',userId);const{data:progresso}=await sb.from('plano_progresso').select('cultura_nome,etapa_id,feito').eq('usuario_id',userId);const{data:lembretesDb}=await sb.from('lembretes').select('data').eq('usuario_id',userId).eq('feito',false);const feitosSet=new Set((progresso||[]).filter(p=>p.feito).map(p=>`${p.cultura_nome}::${p.etapa_id}`));const hojeISO=new Date().toISOString().slice(0,10);let n=0;(inicios||[]).forEach(ini=>{const found=todasCulturas.find(x=>x.c.nome===ini.cultura_nome);if(!found)return;const etapas=calcularEtapasComData(found.c,ini.data_inicio);etapas.forEach(e=>{if(feitosSet.has(`${ini.cultura_nome}::${e.id}`))return;if(e.dataISO<=hojeISO)n++;});});(lembretesDb||[]).forEach(l=>{if(l.data<=hojeISO)n++;});setCount(n);}carregar();},[userId]);if(count===null)return<div style={{fontSize:11.5,color:'rgba(255,255,255,.65)',marginTop:1}}>Carregando...</div>;if(count===0)return<div style={{fontSize:11.5,color:'rgba(255,255,255,.75)',marginTop:1}}>Nenhum aviso pendente</div>;return<div style={{fontSize:11.5,color:'#FEF08A',marginTop:1,fontWeight:700}}>{count} aviso{count>1?'s':''} pendente{count>1?'s':''}</div>;}
const GASTO_CATEGORIAS=[{id:'fertilizantes',icon:'🌱',label:'Fertilizantes'},{id:'defensivos',icon:'🛡️',label:'Defensivos'},{id:'sementes',icon:'🌾',label:'Sementes'},{id:'mao_obra',icon:'👤',label:'Mão de obra'},{id:'outros',icon:'···',label:'Outros'}];
function freqTexto(cultura){if(cultura.ciclo>12){const anos=cultura.ciclo/12;const anosFmt=Number.isInteger(anos)?anos:Math.round(anos*10)/10;return`${cultura.safras} colheita${cultura.safras>1?'s':''} a cada ${anosFmt} anos`;}return`${cultura.safras} safra${cultura.safras>1?'s':''}/ano`;}
function dataRelativa(input){const dt=input instanceof Date?new Date(input):new Date(typeof input==='string'&&input.length<=10?input+'T12:00:00':input);const hoje=new Date();hoje.setHours(0,0,0,0);const alvo=new Date(dt);alvo.setHours(0,0,0,0);const dias=Math.round((hoje-alvo)/86400000);if(dias===0)return'Hoje';if(dias===1)return'Ontem';if(dias>1&&dias<7)return`Há ${dias} dias`;return dt.toLocaleDateString('pt-BR');}
function agruparPorPeriodo(lista,getData){const grupos={'Hoje':[],'Ontem':[],'Essa semana':[],'Este mês':[],'Mais antigas':[]};const hoje=new Date();hoje.setHours(0,0,0,0);lista.forEach(item=>{const raw=getData(item);const dt=new Date(typeof raw==='string'&&raw.length<=10?raw+'T12:00:00':raw);const alvo=new Date(dt);alvo.setHours(0,0,0,0);const dias=Math.round((hoje-alvo)/86400000);if(dias===0)grupos['Hoje'].push(item);else if(dias===1)grupos['Ontem'].push(item);else if(dias>1&&dias<7)grupos['Essa semana'].push(item);else if(dias>=7&&dias<31)grupos['Este mês'].push(item);else grupos['Mais antigas'].push(item);});return Object.entries(grupos).filter(([,arr])=>arr.length>0);}

function lucroPeriodoLabel(cultura){return cultura.ciclo>12?`Lucro/ciclo (${cultura.safras}×)`:`Lucro/ano (${cultura.safras}×)`;}

function NovoGastoScreen({userId,todasCulturas,onSalvo,onBack,culturaInicial}){const[valor,setValor]=useState('');const[categoria,setCategoria]=useState('fertilizantes');const[cultura,setCultura]=useState(culturaInicial||'');const[data,setData]=useState(()=>new Date().toISOString().slice(0,10));const[formaPagamento,setFormaPagamento]=useState('pix');const[status,setStatus]=useState('pago');const[descricao,setDescricao]=useState('');const[recibo,setRecibo]=useState(null);const[reciboPreview,setReciboPreview]=useState(null);const[salvando,setSalvando]=useState(false);const[erro,setErro]=useState('');function selecionarRecibo(e){const f=e.target.files[0];if(!f)return;setRecibo(f);setReciboPreview(URL.createObjectURL(f));}async function salvar(){if(!valor||Number(valor)<=0)return;setSalvando(true);setErro('');try{let recibo_url=null;if(recibo){const ext=(recibo.name.split('.').pop()||'jpg').toLowerCase();const path=`${userId}/recibos/${Date.now()}.${ext}`;const bytes=await recibo.arrayBuffer();const{error:upErr}=await sb.storage.from('notas-fotos').upload(path,bytes,{contentType:recibo.type||'image/jpeg'});if(upErr)throw upErr;const{data:pub}=sb.storage.from('notas-fotos').getPublicUrl(path);recibo_url=pub.publicUrl;}const{error:insErr}=await sb.from('expenses').insert({usuario_id:userId,cultura_nome:cultura||null,categoria,valor:Number(valor),data,forma_pagamento:formaPagamento,status_pagamento:status,descricao:descricao||null,recibo_url});if(insErr)throw insErr;celebrar();onSalvo();}catch(e){console.error(e);setErro('Não consegui salvar o recibo. Tenta de novo.');}setSalvando(false);}
return(<div className="kit" style={{minHeight:'100vh',padding:'0 20px 130px'}}>

<div className="amt"><span>R$</span><input type="number" inputMode="decimal" value={valor} onChange={e=>setValor(e.target.value)} placeholder="0,00" autoFocus/></div>

<div className="lbl">Já pagou?</div>
<div className="chips">{[{id:'pago',l:'Já paguei'},{id:'pendente',l:'Ainda vou pagar'}].map(x=>(<button key={x.id} className={'ch'+(status===x.id?' on':'')} onClick={()=>setStatus(x.id)}>{x.l}</button>))}</div>

<button className="b next" style={{flex:'none',width:'100%',marginTop:22,opacity:(salvando||!valor)?.5:1}} onClick={salvar} disabled={salvando||!valor}><span className="shine"/><span style={{position:'relative'}}>{salvando?'Salvando...':'Salvar gasto'}</span></button>

function NovaVendaScreen({userId,todasCulturas,onSalvo,onBack,culturaInicial}){const[cultura,setCultura]=useState(culturaInicial||'');const[produto,setProduto]=useState('');const[quantidade,setQuantidade]=useState('');const[unidade,setUnidade]=useState(culturaInicial==='Eucalipto'?'m3':'kg');const[precoUnit,setPrecoUnit]=useState('');const[status,setStatus]=useState('recebido');const[data,setData]=useState(()=>new Date().toISOString().slice(0,10));const[observacao,setObservacao]=useState('');const[comprador,setComprador]=useState('');const[formaPagamento,setFormaPagamento]=useState('pix');const[prazoPagamento,setPrazoPagamento]=useState('a_vista');const[recibo,setRecibo]=useState(null);const[reciboPreview,setReciboPreview]=useState(null);const[salvando,setSalvando]=useState(false);const[erro,setErro]=useState('');const total=(Number(quantidade)||0)*(Number(precoUnit)||0);function selecionarRecibo(e){const f=e.target.files[0];if(!f)return;setRecibo(f);setReciboPreview(URL.createObjectURL(f));}async function salvar(){if(total<=0)return;setSalvando(true);setErro('');try{let recibo_url=null;if(recibo){const ext=(recibo.name.split('.').pop()||'jpg').toLowerCase();const path=`${userId}/recibos/${Date.now()}.${ext}`;const bytes=await recibo.arrayBuffer();const{error:upErr}=await sb.storage.from('notas-fotos').upload(path,bytes,{contentType:recibo.type||'image/jpeg'});if(upErr)throw upErr;const{data:pub}=sb.storage.from('notas-fotos').getPublicUrl(path);recibo_url=pub.publicUrl;}const{error:insErr}=await sb.from('sales').insert({usuario_id:userId,cultura_nome:cultura||null,produto:produto||cultura||'Venda',quantidade:Number(quantidade)||null,unidade,preco_unitario:Number(precoUnit)||null,valor_total:total,status_pagamento:status,data,observacao:observacao||null,comprador:comprador||null,forma_pagamento:formaPagamento,prazo_pagamento:prazoPagamento,recibo_url});if(insErr)throw insErr;celebrar();onSalvo();}catch(e){console.error(e);setErro('Não consegui salvar o recibo. Tenta de novo.');}setSalvando(false);}

function PieChartSVG({data,size=140}){const total=data.reduce((a,d)=>a+d.value,0);if(total<=0)return(<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:size,fontSize:12,color:'#A3AD9D'}}>Sem dados ainda</div>);const stroke=size*0.22;const r=(size-stroke)/2-2;const cx=size/2,cy=size/2;const circ=2*Math.PI*r;let acc=0;const segs=data.filter(d=>d.value>0).map(d=>{const frac=d.value/total;const len=frac*circ;const seg={...d,dasharray:`${len} ${circ-len}`,offset:-acc*circ,pct:frac*100};acc+=frac;return seg;});return(<div style={{display:'flex',alignItems:'center',gap:16}}><svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0,transform:'rotate(-90deg)',overflow:'visible'}}>{segs.map((s,i)=>(<circle key={i} cx={cx} cy={cy} r={r} fill='none' stroke={s.color} strokeWidth={stroke} strokeDasharray={s.dasharray} strokeDashoffset={s.offset} />))}</svg><div style={{display:'flex',flexDirection:'column',gap:6,flex:1,minWidth:0}}>{segs.map((s,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:7}}><span style={{width:9,height:9,borderRadius:3,background:s.color,flexShrink:0}} /><span style={{fontSize:11.5,color:'#5A6857',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.label}</span><span style={{fontSize:11.5,fontWeight:700,color:'#1B4332'}}>{s.pct.toFixed(0)}%</span></div>))}</div></div>);}
function BarChartSVG({data,height=120}){const max=Math.max(...data.map(d=>Math.max(d.a||0,d.b||0)),1);return(<div style={{display:'flex',alignItems:'flex-end',gap:14,height,paddingTop:10}}>{data.map((d,i)=>(<div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',height:'100%',justifyContent:'flex-end',gap:4}}><div style={{display:'flex',alignItems:'flex-end',gap:3,flex:1,width:'100%',justifyContent:'center'}}><div style={{width:'38%',maxWidth:22,height:`${Math.max(3,(d.a/max)*100)}%`,background:d.corA||'#4ADE80',borderRadius:'4px 4px 0 0'}} title={`${d.label} A: ${d.a}`} /><div style={{width:'38%',maxWidth:22,height:`${Math.max(3,(d.b/max)*100)}%`,background:d.corB||'#F87171',borderRadius:'4px 4px 0 0'}} title={`${d.label} B: ${d.b}`} /></div><span style={{fontSize:10.5,color:'#8A9584',fontWeight:600,textAlign:'center',lineHeight:1.2,maxWidth:56,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</span></div>))}</div>);}
function MaoDeObraEditModal({config,onClose,onSalvar}){const[trabalhadores,setTrabalhadores]=useState(config?.mo_trabalhadores!=null?Number(config.mo_trabalhadores):1);const[modo,setModo]=useState(config?.mo_modo||'mensal');const[valor,setValor]=useState(config?.mo_valor!=null?Number(config.mo_valor):1518);const[periodoMeses,setPeriodoMeses]=useState(config?.mo_periodo_meses!=null?Number(config.mo_periodo_meses):2);const[periodoDias,setPeriodoDias]=useState(config?.mo_periodo_dias!=null?Number(config.mo_periodo_dias):20);const[encargosIncluir,setEncargosIncluir]=useState(!!config?.mo_encargos_incluir);const[encargosPct,setEncargosPct]=useState(config?.mo_encargos_pct!=null?Number(config.mo_encargos_pct):38);const[salvando,setSalvando]=useState(false);const periodo=modo==='mensal'?periodoMeses:periodoDias;const base=trabalhadores*valor*periodo;const total=encargosIncluir?base*(1+encargosPct/100):base;async function salvar(){setSalvando(true);await onSalvar({trabalhadores,modo,valor,periodo,encargosIncluir,encargosPct});setSalvando(false);}return(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',alignItems:'flex-end',maxWidth:430,margin:'0 auto'}} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:'linear-gradient(152deg, rgba(255,255,255,.97) 0%, rgba(255,255,255,.9) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate(185%)',borderRadius:'24px 24px 0 0',padding:'14px 22px 30px',width:'100%',maxHeight:'88vh',overflowY:'auto',animation:'fadeUp .25s ease both'}}><div style={{width:40,height:4,borderRadius:99,background:'#E2E9DE',margin:'0 auto 16px'}} /><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}><div className='serif' style={{fontSize:18,fontWeight:800,color:'#1B4332'}}>Editar cálculo</div><button onClick={onClose} style={{background:'none',border:'none',fontSize:20,color:'#5A6857'}}>✕</button></div><div style={ function gerarDicasComerciais(cultura){const nome=cultura.nome;const tipo=cultura.tipoCultivo;const perecivel=tipo==='cogumelo'||tipo==='hidroponia';const canais=[];if(tipo==='apicultura'){canais.push({t:'Feiras e venda direta',x:'Mel, própolis, geleia real e pólen vendem bem em feiras de produtor. O contato direto deixa o cliente ver o produto e conhecer sua história.'},{t:'Restaurantes e cafeterias',x:'Estabelecimentos que valorizam produto local pagam mais que o atacado por mel de origem rastreável.'},{t:'Distribuidores e cooperativas',x:'Pra volumes maiores, cooperativas de apicultores dão acesso a mercados que um produtor sozinho não alcança, além de ajudar com envase e selo de inspeção.'});}else if(tipo==='cogumelo'||tipo==='hidroponia'){canais.push({t:'Restaurantes (HORECA)',x:`${nome} fresco de qualidade tem forte apelo em restaurantes e chefs que valorizam frescor e regularidade de entrega.`},{t:'Feiras e mercados gourmet',x:'Feiras orgânicas e gourmet pagam mais que supermercado convencional, principalmente com apresentação caprichada.'},{t:'Venda direta (WhatsApp/redes sociais)',x:'Uma lista de clientes fiéis no WhatsApp, com entrega regular, já sustenta uma operação pequena sem depender de atravessador.'});}else{canais.push({t:'Feiras livres e de produtor',x:`Vender ${nome} direto na feira costuma pagar 2 a 3 vezes mais que vender pro atacado, porque corta o intermediário.`},{t:'Venda direta (WhatsApp e redes sociais)',x:'Uma lista de clientes fiéis no WhatsApp, com fotos da colheita, já é suficiente pra escoar boa parte da produção em pequena escala.'},{t:'Cooperativas e associações',x:'Se juntar a outros produtores da região aumenta o poder de negociação e abre acesso a compradores maiores (varejo, indústria).'},{t:'Atacado e agroindústria',x:'Pra volume maior, vender pra agroindústria ou atacadista garante escoamento certo, mas com margem menor por unidade — bom pra quem prioriza previsibilidade sobre lucro máximo.'});}const precificacao={t:'Como precificar sem perder dinheiro',x:`Calcule o custo real de produzir ${nome} (implantação + manejo + mão de obra, já disponível na Calculadora) e defina um preço mínimo que cubra isso com folga. Pesquise o preço de mercado na sua região antes de fechar — pergunte em feiras, grupos de produtores ou observe o que o mesmo produto custa no supermercado. Nunca combine preço na hora da entrega: isso deixa você na mão do comprador. Defina o valor antes, por telefone ou mensagem.`};const aquisicao={t:'Como conseguir os primeiros clientes',x:'Comece pelo círculo próximo: vizinhos, grupos de WhatsApp do bairro ou da cidade, e feiras locais. Fotos boas (luz natural, produto limpo) valem mais que qualquer texto de venda. Ofereça uma amostra pequena pra quem nunca comprou — é comum a primeira compra vir de uma degustação ou de um preço promocional de apresentação. Peça indicação pra quem já comprou; cliente satisfeito traz cliente novo sem custo nenhum.'};const fidelizacao={t:'Fidelização e recorrência',x:'É mais barato manter um cliente que já compra do que conseguir um novo. Um grupo de transmissão no WhatsApp avisando quando a colheita está pronta já garante recompra. Combine um dia fixo de entrega (ex: toda sexta) — isso cria rotina e o cliente passa a contar com você. Embalagem com identidade (nome, contato, foto) faz o cliente lembrar de você na próxima compra, mesmo sem intenção de venda.'};const embalagem={t:'Embalagem e apresentação',x:perecivel?`${nome} exige cuidado extra: embale logo após a colheita, mantenha refrigerado quando possível e venda em poucos dias pra garantir frescor. Embalagem transparente ajuda o cliente a ver a qualidade do produto.`:`Mesmo sem embalagem sofisticada, algo simples com seu nome e contato já diferencia ${nome} de um produto anônimo de supermercado. Isso justifica preço melhor e ajuda na indicação boca a boca.`};const erros={t:'Erros comuns que corroem a margem',x:'Vender sem calcular o custo real (o produtor "sente" que está lucrando, mas não function SimularCenarioModal({cultura,custImplEf,custManejoEf,maoDeObraT,organico,estufaFat,areaAtual,prodHaAtual,precoAAtual,precoVAtual,pctAAtual,onClose,onAplicar}){const[area,setArea]=useState(areaAtual);const[prodHa,setProdHa]=useState(prodHaAtual);const[precoA,setPrecoA]=useState(precoAAtual);const[precoV,setPrecoV]=useState(precoVAtual);const[pctA,setPctA]=useState(pctAAtual);function resetar(){setArea(areaAtual);setProdHa(prodHaAtual);setPrecoA(precoAAtual);setPrecoV(precoVAtual);setPctA(pctAAtual);}const fPr=estufaFat?estufaFat.preco:1,fPd=estufaFat?estufaFat.prod:1;const precoAEfM=+((organico?precoA*1.3:precoA)*fPr).toFixed(2),precoVEfM=+((organico?precoV*1.3:precoV)*fPr).toFixed(2);const ha=area/10000,implT=custImplEf*ha,manejoT=custManejoEf*ha,custoT=implT+manejoT+maoDeObraT,prodT=ha*Math.round(prodHa*fPd),kgA=prodT*pctA/100,kgV=prodT-kgA,recT=kgA*precoAEfM+kgV*precoVEfM,lucro=recT-custoT,lucroAno=lucro*cultura.safras,margem=recT>0?(lucro/recT*100):0;return(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',alignItems:'flex-end',maxWidth:430,margin:'0 auto'}} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:'linear-gradient(152deg, rgba(255,255,255,.97) 0%, rgba(255,255,255,.9) 100%)',backdropFilter:'blur(22px) saturate(185%)',WebkitBackdropFilter:'blur(22px) saturate(185%)',borderRadius:'24px 24px 0 0',padding:'14px 22px 30px',width:'100%',maxHeight:'88vh',overflowY:'auto',animation:'fadeUp .25s ease both'}}><div style={{width:40,height:4,borderRadius:99,background:'#E2E9DE',margin:'0 auto 16px'}} /><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}><div><div className='serif' style={{fontSize:18,fontWeight:800,color:'#1B4332'}}>Simular cenário</div><div style={{fontSize:12,color:'#8A9584',marginTop:2,maxWidth:280}}>Altere os valores abaixo e veja como muda seu resultado em tempo real.</div></div><button onClick={onClose} style={{background:'none',border:'none',fontSize:20,color:'#5A6857'}}>✕</button></div><div style={{marginTop:18}}>{organico&&<div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:12,padding:'8px 12px',fontSize:11.5,color:'#166534',fontWeight:600,marginBottom:14}}>🌱 Cultivo orgânico ativo — o resultado abaixo já aplica +30% sobre os preços que você ajustar aqui</div>}<CampoSimulacao label='Área total' valor={area} setValor={setArea} unidade='m²' max={Math.max(areaAtual*3,1000)} step={Math.max(1,Math.round(areaAtual/100))} /><CampoSimulacao label='Produtividade' valor={prodHa} setValor={setProdHa} unidade='kg/ha' max={Math.max(prodHaAtual*3,1000)} step={Math.max(1,Math.round(prodHaAtual/100))} /><CampoSimulacao label='Preço atacado' valor={precoA} setValor={setPrecoA} unidade='R$/kg' max={Math.max(precoAAtual*3,5)} step={0.1} /><CampoSimulacao label='Preço varejo' valor={precoV} setValor={setPrecoV} unidade='R$/kg' max={Math.max(precoVAtual*3,5)} step={0.1} /><CampoSimulacao label='% Atacado' valor={pctA} setValor={setPctA} unidade='%' max={100} step={1} /></div><div style={{background:'linear-gradient(135deg,#1B4332,#14532D)',borderRadius:16,padding:'16px',marginTop:4,marginBottom:18}}><div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.55)',textTransform:'uppercase'}}>Lucro por safra</div><div className='serif' style={{fontSize:24,fontWeight:800,color:'#fff',marginTop:2}}>{fmt(lucro)}</div><div style={{display:'flex',gap:8,marginTop:12}}>{[{l:'Margem',v:margem.toFixed(0)+'%'},{l:'Receita',v:fmt(recT)},{l:lucroPeriodoLabel(cultura),v:fmt(lucroAno)}].map(b=>(<div key={b.l} style={{background:'rgba(255,255,255,.12)',borderRadius:10,padding:'7px 10px',flex:1}}><div style={{fontSize:10,color:'rgba(255,255,255,.55)',fontWeight:600}}>{b.l}</div><div style={{fontSize:12.5,fontWeight:800,color:'#fff'}}>{b.v}</div></div>))}</div></div><div style={{display:'flex',gap:10}}><button onClick={resetar} style={{flex:0.8,padding:'14px',background:'#fff',color:'#1B433 const CULTURAS_PERENES = new Set(["Abacate","Açaí","Amora-preta","Banana","Cacau","Café","Caju","Castanha-do-brasil","Coco","Cupuaçu","Erva-mate","Eucalipto","Framboesa","Goiaba","Guaraná","Kiwi","Laranja","Limão","Manga","Maracujá","Maçã","Mirtilo","Noz-pecã","Pimenta-do-reino","Pitaya","Pêssego","Tangerina","Urucum","Uva","Alecrim","Hortelã","Orégano","Sálvia","Tomilho","Louro","Capim-limão","Rosa","Orquídea","Bromélia","Antúrio"]);
function ehPerene(cultura){
  if(!cultura)return false;
  if(cultura.perene===true)return true;
  if(cultura.perene===false)return false;
  if(cultura.tipoCultivo==="apicultura")return true;
  return CULTURAS_PERENES.has(cultura.nome);
}

function formasVendaDe(cultura){ return (cultura && FORMAS_VENDA[cultura.nome]) || null; }
function formaVendaPadrao(cultura){ const f=formasVendaDe(cultura); if(!f)return null; return (f.find(x=>x.padrao)||f[0]).id; }
function mesesMaoDeObraSugerido(cultura){
  // proporcional ao ciclo: metade do ciclo, entre 1 e 6 meses (ciclos longos usam 15%)
  if(cultura.ciclo<=12) return Math.min(6, Math.max(1, Math.round(cultura.ciclo*0.5)));
  return Math.max(2, Math.round(cultura.ciclo*0.15));
}
function frequenciaMaoDeObra(cultura){
  const intervaloBase = cultura.ciclo<=6?3:cultura.ciclo<=24?7:15;
  const ajusteDificuldade = cultura.dificuldade==="Difícil"?0.6:cultura.dificuldade==="Médio"?1:1.4;
  const intervaloDias = Math.max(2, Math.round(intervaloBase*ajusteDificuldade));
  const cicloDias = cultura.ciclo*30.4;
  const dias = Math.max(cultura.ciclo<=6?15:8, Math.round(cicloDias/intervaloDias));
  const label = intervaloDias<=3?"quase diária no pico":intervaloDias===7?"1 visita por semana":(intervaloDias>=28&&intervaloDias<=31)?"1 visita por mês":`1 visita a cada ${intervaloDias} dias`;
  return { label, dias, intervaloDias };
}
function trabalhadoresRecomendados(cultura, ha){
  const moRatio = cultura.tipoCultivo==="cogumelo"?0.2:cultura.dificuldade==="Difícil"?0.4:cultura.dificuldade==="Médio"?0.75:1.5;
  return Math.max(1, Math.round(ha/moRatio)||1);
}
// e = entrada do usuário (todos os campos). Devolve tudo que a tela, o PDF e o salvar precisam.
function calcularSimulacao(cultura, regiao, e){
  const perfilEst = perfilEstufa(cultura);
  const perene = ehPerene(cultura);
  const cv = e.cv;
  const area = Number(e.area)||0;
  const prodHa = Number(e.prodHa)||0;
  const custImpl = IMPLANT_CATEGORIAS.reduce((s,c)=>s+(Number(e.implantItens[c.id])||0),0);
  const custManejo = MANEJO_CATEGORIAS.reduce((s,c)=>s+(Number(e.manejoItens[c.id])||0),0);
  const precoA = Number(e.precoA)||0, precoV = Number(e.precoV)||0, pctA = Number(e.pctA)||0;
  const organico = !!e.organico;
  const estufaAtiva = !!e.estufa && !!perfilEst;
  const fE = estufaAtiva ? Math.min(100,Math.max(0,Number(e.estufaFracao)||0))/100 : 0;
  const fProdE = 1+(perfilEst?perfilEst.ganhoProd:0)*fE, fPrecoE = 1+(perfilEst?perfilEst.ganhoPreco:0)*fE, fManejoE = 1+(perfilEst?perfilEst.manejoExtra:0)*fE;
  const estufaAreaM2 = estufaAtiva ? Math.round(area*fE) : 0;
  const estufaInvest = estufaAtiva ? estufaAreaM2*(Number(e.estufaCustoM2)||0) : 0;
  const estufaCustoSafra = estufaAtiva&&perfilEst ? estufaInvest/((perfilEst.vidaUtilAnos||10)*cultura.safras) : 0;
  // forma de venda
  const formas = formasVendaDe(cultura);
  const forma = formas ? (formas.find(f=>f.id===e.formaVenda)||formas.find(f=>f.padrao)||formas[0]) : null;
  const fPrecoForma = forma ? forma.fatorPreco : 1;
  const rendForma = forma ? forma.rendimento : 1;
  const custoKgForma = forma ? forma.custoKg : 0;
  const custImplEf = organico?Math.round(custImpl*1.2):custImpl,
    custManejoBaseEf = organico?Math.round(custManejo*1.15):custManejo,
    custManejoEf = Math.round(custManejoBaseEf*fManejoE),
    precoABase = organico?+(precoA*1.3).toFixed(2):precoA,
    precoVBase = organico?+(precoV*1.3).toFixed(2):precoV,
    precoAEf = +(precoABase*fPrecoE*fPrecoForma).toFixed(2),
    precoVEf = +(precoVBase*fPrecoE*fPrecoForma).toFixed(2),
    prodHaEf = Math.round(prodHa*fProdE);
  const ha = area/10000, implT = custImplEf*ha, manejoS = custManejoEf*ha;
  const moRecomendado = trabalhadoresRecomendados(cultura, ha);
  const moTrabalhadoresEf = e.moTrabalhadores!=null ? Number(e.moTrabalhadores) : moRecomendado;
  const moPeriodoMesesSugerido = mesesMaoDeObraSugerido(cultura);
  const moFrequenciaSugerida = frequenciaMaoDeObra(cultura);
  const moPeriodoDiasSugerido = moFrequenciaSugerida.dias;
  const moPeriodoMeses = e.moPeriodoMeses!=null?Number(e.moPeriodoMeses):moPeriodoMesesSugerido;
  const moPeriodoDias = e.moPeriodoDias!=null?Number(e.moPeriodoDias):moPeriodoDiasSugerido;
  const moModo = e.moModo||"mensal";
  const moValor = Number(e.moValor)||0, moValorDiaria = Number(e.moValorDiaria)||0;
  const moPeriodo = moModo==="mensal"?moPeriodoMeses:moPeriodoDias;
  const moValorEfetivo = moModo==="mensal"?moValor:moValorDiaria;
  const moCustoBase = moTrabalhadoresEf*moValorEfetivo*moPeriodo;
  const maoDeObraT = e.moEncargosIncluir ? moCustoBase*(1+(Number(e.moEncargosPct)||0)/100) : moCustoBase;
  const moCustoMensalEstimado = moTrabalhadoresEf*moValor*moPeriodoMesesSugerido;
  const moCustoDiariaEstimado = moTrabalhadoresEf*moValorDiaria*moPeriodoDiasSugerido;
  const prodT = ha*prodHaEf;                     // colhido
  const prodVend = prodT*rendForma;              // vendido (depois do beneficiamento)
  const benefT = prodT*custoKgForma;             // custo de beneficiamento
  const kgA = (prodVend*pctA)/100, kgV = prodVend-kgA;
  const recT = kgA*precoAEf + kgV*precoVEf;
  const custoSafraSemImpl = manejoS + maoDeObraT + estufaCustoSafra + benefT;
  const custoTPrimeira = implT + custoSafraSemImpl;   // primeira safra (com implantação)
  // Para culturas anuais a implantação entra em toda safra; para perenes só na primeira.
  const custoT = perene ? custoSafraSemImpl : custoTPrimeira;
  const lucro = recT - custoT;
  const lucroPrimeira = recT - custoTPrimeira;

  const retornoSafras = perene
    ? (implT>0 && lucro>0 ? implT/lucro : (implT<=0?0:null))
    : (custoT>0 && lucro>0 ? custoT/lucro : null);
  // comparações
  const semEstufa = (()=>{ const mS=custManejoBaseEf*ha, pT=ha*prodHa*rendForma, kA=(pT*pctA)/100, kV=pT-kA, rT=kA*+(precoABase*fPrecoForma).toFixed(2)+kV*+(precoVBase*fPrecoForma).toFixed(2), cT=(perene?0:implT)+mS+maoDeObraT+ha*prodHa*custoKgForma; return {recT:rT,custoT:cT,lucro:rT-cT,prodT:ha*prodHa}; })();
  const comEstufaPreview = (()=>{ if(!perfilEst)return null; const f=Math.min(100,Math.max(0,Number(e.estufaFracao)||0))/100||1; const fp=1+perfilEst.ganhoProd*f, fpr=1+perfilEst.ganhoPreco*f, fm=1+perfilEst.manejoExtra*f; const inv=Math.round(area*f)*(Number(e.estufaCustoM2)||perfilEst.custoM2); const amort=inv/((perfilEst.vidaUtilAnos||10)*cultura.safras); const pHa=Math.round(prodHa*fp); const mS=Math.round(custManejoBaseEf*fm)*ha, pT=ha*pHa*rendForma, kA=(pT*pctA)/100, kV=pT-kA, rT=kA*+(precoABase*fpr*fPrecoForma).toFixed(2)+kV*+(precoVBase*fpr*fPrecoForma).toFixed(2), cT=(perene?0:implT)+mS+maoDeObraT+amort+ha*pHa*custoKgForma; return {recT:rT,custoT:cT,lucro:rT-cT,prodT:ha*pHa,invest:inv,amort}; })();
  const estufaGanhoLucroSafra = estufaAtiva ? lucro-semEstufa.lucro : 0;
  const estufaGanhoBruto = estufaAtiva ? lucro+estufaCustoSafra-semEstufa.lucro : 0;
  const estufaRetornoSafras = estufaAtiva&&estufaGanhoBruto>0 ? estufaInvest/estufaGanhoBruto : null;
  const estufaRecomendada = !!perfilEst && !estufaAtiva && !!comEstufaPreview && comEstufaPreview.lucro>semEstufa.lucro*1.1 && comEstufaPreview.lucro>0;
  const cenarioOrganico = (()=>{ const oOn=!organico; const cImpl=oOn?Math.round(custImpl*1.2):custImpl, cManB=oOn?Math.round(custManejo*1.15):custManejo, cMan=Math.round(cManB*fManejoE), pA=oOn?+(precoA*1.3).toFixed(2):precoA, pV=oOn?+(precoV*1.3).toFixed(2):precoV, pAE=+(pA*fPrecoE*fPrecoForma).toFixed(2), pVE=+(pV*fPrecoE*fPrecoForma).toFixed(2); const iT=cImpl*ha, mS=cMan*ha, cT=(perene?0:iT)+mS+maoDeObraT+estufaCustoSafra+benefT, rT=kgA*pAE+kgV*pVE; return {lucro:rT-cT,recT:rT,custoT:cT}; })();
  const lucroConvencional = organico?cenarioOrganico.lucro:lucro;
  const lucroOrganico = organico?lucro:cenarioOrganico.lucro;
  // faixa: colheita fraca com preço de referência baixo até colheita boa com preço alto
  const faixa = (()=>{
    const calcCom=(fp,fpr)=>{ const pT=ha*Math.round(prodHaEf*fp)*rendForma, kA=(pT*pctA)/100, kV=pT-kA, rT=kA*+(precoAEf*fpr).toFixed(2)+kV*+(precoVEf*fpr).toFixed(2); const cT=custoT-benefT+ha*Math.round(prodHaEf*fp)*custoKgForma; return rT-cT; };

  return {
    perene, cv, area, ha, prodHa, prodHaEf, prodT, prodVend, custImpl, custManejo, custImplEf, custManejoBaseEf, custManejoEf,

    const retornoTxt = (() => { if (lucro <= 0) return "Do jeito que está, o dinheiro não volta."; if (perene) { if (retornoSafras == null || retornoSafras === 0) return "Sem custo pra começar."; const s = Math.ceil(retornoSafras); return `O que você gastou pra começar volta em ${s} ${s === 1 ? "safra" : "safras"}.`; } if (retornoSafras != null && retornoSafras < 1) return "Paga o que você gastou ainda na primeira safra."; const s = Math.ceil(retornoSafras || 1); return `Paga o que você gastou em ${s} ${s === 1 ? "safra" : "safras"}.`; })();
    const margemTxt = recT > 0 ? `De cada R$ 100 vendidos, sobram R$ ${Math.max(0, Math.round(margem))}.` : "Sem venda, sem margem.";
    return (
      <div className="trans" key="p6">
        <div className="blk dark" style={{ minHeight: 190, borderRadius: "28px 28px 28px 56px", background: veredito === "prejuizo" ? "linear-gradient(155deg,#2A2A2A 0%,#1E1E1E 40%,#7C2D12 100%)" : undefined }}>
          <Shine />
          <div className="hang"><div className={"mini " + (ok ? "ok" : risco ? "" : "bad")}><LI n={lucro > 0 ? "check" : "alerta"} size={16} sw={2.6} /></div>{vTexto}</div>
          <div style={{ position: "absolute", right: 18, top: 20, fontSize: 13, color: "rgba(255,255,255,.65)" }}>Estimativa por safra</div>
          <div className="big" style={{ marginTop: 50, fontSize: Math.abs(lucro) >= 1000000 ? 34 : 42, ...blur }}>{fmt(lucro).replace(",00", "")}</div>
          <div className="sub" style={blur}>Você vende {fmt(recT).replace(",00", "")} e gasta {fmt(custoT).replace(",00", "")}.</div>
          <div className="faixa" style={blur}>Entre {fmt(faixa.min).replace(",00", "")} e {fmt(faixa.max).replace(",00", "")}, dependendo da colheita e do preço.</div>
          {perene && <div className="faixa" style={blur}>Na primeira safra, descontando o que você gasta pra começar: {fmt(lucroPrimeira).replace(",00", "")}.</div>}
        </div>
        <div className="row sq" style={{ marginTop: 14, background: "linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.18)),var(--mint)", border: "1px solid rgba(255,255,255,.75)", cursor: "default" }}>
          <LI n="calendario" size={22} />
          <div className="rt">Por ano ({cultura.safras} {cultura.safras === 1 ? "safra" : "safras"})<small>{perene ? "Com a lavoura já formada" : "Somando as safras do ano"}</small></div>
          <div className="rv" style={{ fontSize: 17, ...blur }}>{fmt(lucroAno).replace(",00", "")}</div>
        </div>
        <div style={{ height: 12 }} />
        <EasyLinha>{nEditados === 0 ? "Tudo na média da região. Confira antes de decidir." : `Você ajustou ${nEditados} ${nEditados === 1 ? "valor" : "valores"}. O resto é a média da região.`}</EasyLinha>
        <div style={{ height: 12 }} />
        <button className="sec" onClick={() => setContaAberta((v) => !v)}><span>{contaAberta ? "Fechar conta completa" : "Ver conta completa"}</span><span className="arr"><LI n="seta" size={18} style={{ transform: contaAberta ? "rotate(90deg)" : "none" }} /></span></button>
        {contaAberta && (
          <div className="conta" style={{ marginTop: 10 }}>
            {[
              { n: 1, t: "Área", s: cv.name, v: cnFmtArea(area), ic: "regua" },
              { n: 2, t: "Começar", s: perene ? "Paga uma vez" : "A cada plantio", v: fmt(implT).replace(",00", ""), ic: "trator" },
              { n: 3, t: "Colheita", s: cenAtual === "normal" ? "Normal" : cenAtual === "baixo" ? "Se der problema" : cenAtual === "alto" ? "Se der tudo certo" : "Seu valor", v: cnFmtKg(prodT, un), ic: "cesta" },
              { n: 4, t: "Cuidar", s: `${moTrabalhadoresEf} ${moTrabalhadoresEf === 1 ? "pessoa" : "pessoas"} e insumos`, v: fmt(manejoS + maoDeObraT + benefT).replace(",00", ""), ic: "gota" },
              { n: 5, t: "Venda", s: forma ? forma.label : "Preço médio", v: `${fmt(precoMedioPonderado)}/${un}`, ic: "etiqueta" },
            ].map((l) => (
              <button key={l.n} className="row" onClick={() => abrirPasso(l.n)}>
                <LI n={l.ic} size={22} />
                <div className="rt">{l.t}<small>{l.s}</small></div>
                <div className="rv" style={blur}>{l.v}</div>
                <span className="arr"><LI n="seta" size={18} /></span>
              </button>
            ))}
            <div className="row" style={{ cursor: "default" }}><LI n="nota" size={22} /><div className="rt">Você vende<small>{fmtN(R.prodVend)} {un} ao todo</small></div><div className="rv" style={blur}>{fmt(recT).replace(",00", "")}</div></div>
            {estufaAtiva && <div className="row" style={{ cursor: "default" }}><LI n="estufa" size={22} /><div className="rt">Estufa<small>Investimento diluído por safra</small></div><div className="rv" style={blur}>{fmt(estufaCustoSafra).replace(",00", "")}</div></div>}
            <div className="duo">
              <div className="kc tint mint"><LI n="nota" size={20} /><div>{margemTxt}</div></div>
              <div className="kc tint butter"><LI n="repetir" size={20} /><div>{retornoTxt}</div></div>
            </div>
            {perfilEst && !estufaAtiva && comEstufaPreview && comEstufaPreview.lucro > lucro && (
              <EasyLinha onClick={() => { setEstufa(true); abrirPasso(1); setAjArea(true); }}>Com estufa: {comEstufaPreview.lucro - lucro >= 0 ? "+ " : "– "}{fmt(Math.abs(comEstufaPreview.lucro - lucro)).replace(",00", "")} por safra (investe {fmt(comEstufaPreview.invest).replace(",00", "")}).</EasyLinha>
            )}
            {!organico && lucroOrganico > lucro && <EasyLinha onClick={() => { setOrganico(true); }}>Orgânico: {fmt(lucroOrganico).replace(",00", "")} por safra. Toque pra ver.</EasyLinha>}
            {organico && <EasyLinha onClick={() => setOrganico(false)}>Sem orgânico: {fmt(lucroConvencional).replace(",00", "")} por safra. Toque pra ver.</EasyLinha>}
            <button className="sec" onClick={() => setCenarioAberto(true)}><span>Testar com outros números</span><span className="arr"><LI n="seta" size={18} /></span></button>
            <button className="sec" onClick={exportarPDF} disabled={bloqueado}><span style={{ display: "flex", alignItems: "center", gap: 10 }}><LI n="pdf" size={20} />Baixar em PDF</span><span className="arr"><LI n="seta" size={18} /></span></button>
          </div>
        )}
        {mostrarProximos && (
          <div className="blk dark" style={{ marginTop: 14, gap: 10, justifyContent: "flex-start" }}>
            <Shine />
            <div style={{ fontSize: 15, fontWeight: 700 }}>Conta guardada. E agora?</div>
            <div style={{ fontSize: 14, color: "rgba(255,255,255,.75)" }}>Os próximos passos pra tirar do papel:</div>
            <button className="sec" style={{ background: "rgba(255,255,255,.12)", color: "#fff", border: "1px solid rgba(255,255,255,.18)" }} onClick={() => onIrTela && onIrTela(1)}><span>Ler o Guia do Produtor</span><span className="arr" style={{ color: "#fff" }}><LI n="seta" size={18} /></span></button>
            <button className="sec" style={{ background: "rgba(255,255,255,.12)", color: "#fff", border: "1px solid rgba(255,255,255,.18)" }} onClick={() => onIrTela && onIrTela(2)}><span>Montar meu Plano de Produção</span><span className="arr" style={{ color: "#fff" }}><LI n="seta" size={18} /></span></button>
          </div>
        )}
        <div style={{ height: 8 }} />
      </div>
    );
  }
  const pct = Math.round((etapa / 6) * 100);
  return (
    <div className="cn">
            <div className="prog">
        <div className="lbl"><span>Passo <b>{etapa}</b> de 6</span><span>{CN_PASSOS[etapa - 1]}</span></div>
        <div className="pbar"><i style={{ width: pct + "%" }} /></div>
      </div>
      <h2 className="q">{tituloPasso()}</h2>
      {etapa === 1 && Passo1()}
      {etapa === 2 && Passo2()}
      {etapa === 3 && Passo3()}
      {etapa === 4 && Passo4()}
      {etapa === 5 && Passo5()}
      {etapa === 6 && Passo6()}
      <div className={"bar" + (etapa === 6 ? " fim" : "")} style={{ bottom: etapa === 6 ? "calc(84px + env(safe-area-inset-bottom,0px))" : 0 }}>
        {etapa > 1 && etapa < 6 && <button className="b alt" onClick={voltar}>Voltar</button>}
        {etapa < 6 && <button className="b next" onClick={avancar}><Shine /><span style={{ position: "relative" }}>{deResultado ? "Ver resultado" : etapa === 5 ? "Ver resultado" : "Avançar"}</span></button>}
        {etapa === 6 && (<>
          <button className="b alt" onClick={() => { setContaAberta(true); setTimeout(() => { try { document.querySelector(".cn .conta").scrollIntoView({ behavior: "smooth", block: "start" }); } catch (err) {} }, 50); }}>Mudar valores</button>
          <button className="b save" onClick={salvar} disabled={salvando || salvou}>{salvou ? "Guardada" : salvando ? "Guardando..." : "Guardar essa conta"}</button>
        </>)}
      </div>
      {moModalAberto && (
        <MaoDeObraCalcModal trabalhadores={moTrabalhadoresEf} modo={moModo} valorMensal={moValor} valorDiaria={moValorDiaria} periodoMeses={moPeriodoMesesEf} periodoDias={moPeriodoDiasEf} periodoMesesSugerido={moPeriodoMesesSugerido} periodoDiasSugerido={moPeriodoDiasSugerido} frequenciaLabel={moFrequenciaSugerida.label} cicloCultura={cultura.ciclo} encargosIncluir={moEncargosIncluir} encargosPct={moEncargosPct} onClose={() => setMoModalAberto(false)}
          onSalvar={({ trabalhadores, modo, valorMensal, valorDiaria, periodo, encargosIncluir, encargosPct }) => { setMoTrabalhadores(trabalhadores); setMoModo(modo); setMoValor(valorMensal); setMoValorDiaria(valorDiaria); if (modo === "mensal") setMoPeriodoMeses(periodo); else setMoPeriodoDias(periodo); setMoEncargosIncluir(encargosIncluir); setMoEncargosPct(encargosPct); marcar("mo"); setMoModalAberto(false); }} />
      )}
      {cenarioAberto && (
        <SimularCenarioModal cultura={cultura} custImplEf={R.custImplEf} custManejoEf={R.custManejoEf} maoDeObraT={maoDeObraT + estufaCustoSafra} organico={organico} estufaFat={estufaAtiva ? { prod: R.fProdE, preco: R.fPrecoE } : null} areaAtual={area} prodHaAtual={prodHa} precoAAtual={precoA} precoVAtual={precoV} pctAAtual={pctA} onClose={() => setCenarioAberto(false)}
          onAplicar={(s) => { setArea(s.area); setProdHa(s.prodHa); setPrecoA(s.precoA); setPrecoV(s.precoV); setPctA(s.pctA); ["area", "prodHa", "precoA", "precoV", "pctA"].forEach(marcar); setCenarioAberto(false); }} />
      )}
    </div>
  );
}

function construirFasesCogumelo(cultura){return[{nome:'Preparo do Substrato',icon:'🌾',cor:'#8B5A2B',etapas:[{icon:'🧴',titulo:'Esterilização do substrato',desc:'Substrato (serragem, palha ou grãos) deve ser esterilizado em autoclave ou cozido, eliminando fungos e bactérias concorrentes.',dicas:['Mínimo 100°C por 2 horas','Substrato de procedência conhecida','Contaminação é a principal causa de perda'],sub:['Substrato selecionado','Esterilização/cozimento feito','Substrato resfriado'],mais:'A esterilização mata tudo no substrato, inclusive fungos concorrentes que competiriam com o cogumelo pelo alimento. Sem esse passo, a taxa de contaminação passa de 50%. Uma olla de pressão doméstica grande já serve pra pequena escala.'},{icon:'🧪',titulo:'Preparo dos sacos ou blocos',desc:'Com o substrato já resfriado, embale em sacos próprios para cultivo, ajustando a umidade.',dicas:['Sacos com filtro para troca de ar','Ambiente limpo e desinfetado antes de mexer','Umidade ideal do substrato: 60-70%'],sub:['Sacos/blocos preparados','Umidade ajustada (60-70%)','Ambiente desinfetado'],mais:'O filtro no saco permite trocar oxigênio sem deixar contaminantes entrarem. É diferente de um saco comum furado. Umidade errada (muito seca ou muito encharcada) é a segunda maior causa de perda, depois da contaminação.'}]},{nome:'Inoculação',icon:'🔬',cor:'#F97316',etapas:[{icon:'🧫',titulo:'Aquisição do micélio (spawn)',desc:'Compre micélio certificado de fornecedor confiável. Nunca use material sem procedência.',dicas:['Cor e cheiro devem ser neutros','Armazene em geladeira até o uso','Peça procedência e linhagem ao fornecedor'],sub:['Fornecedor confiável escolhido','Micélio comprado','Armazenado na geladeira'],mais:'Peça pro fornecedor mostrar fotos recentes do lote. Micélio velho ou mal armazenado perde vigor. Comece com um lote pequeno pra testar o fornecedor antes de comprar um volume maior.'},{icon:'💉',titulo:'Inoculação do substrato',desc:'Aplique o micélio no substrato em ambiente o mais asséptico possível.',dicas:['Álcool 70% em mãos e superfícies','Trabalhe rápido pra reduzir contaminação','Anote a data de cada lote inoculado'],sub:['Ambiente asséptico preparado','Inoculação realizada','Data do lote registrada'],mais:'Quanto mais rápido você inocular depois de abrir o saco de micélio, menor o risco de contaminação pelo ar. Uma câmara de fluxo simples, até artesanal, já reduz bastante esse risco em escala pequena.'}]},{nome:'Incubação',icon:'🌑',cor:'#3B82F6',etapas:[{icon:'🌡️',titulo:'Controle de temperatura no escuro',desc:'Mantenha os blocos em ambiente escuro e temperatura estável até a colonização completa do micélio.',dicas:['Sem luz direta nessa fase','Monitore a temperatura todo dia','Descarte qualquer bloco com mofo colorido'],sub:['Local escuro preparado','Temperatura monitorada','Blocos sem sinal de contaminação'],mais:'Cada espécie tem sua faixa ideal de temperatura. Shiitake e cogumelo-do-sol toleram faixas bem diferentes. Anote a temperatura duas vezes por dia nas primeiras semanas, até conhecer o comportamento do seu espaço.'},{icon:'💧',titulo:'Controle de umidade do ar',desc:'A umidade relativa deve ficar entre 60-80% durante a colonização.',dicas:['Use umidificador se o ambiente for seco','Excesso de água favorece contaminação','Substrato tomado de branco indica colonização completa'],sub:['Umidade entre 60-80%','Colonização visível (substrato branco)','Ambiente ventilado'],mais:'Um umidificador ultrassônico simples já resolve pra pequena escala. Substrato ainda escuro/manchado depois de muitos dias pode indicar micélio fraco ou ambiente errado. Vale investigar antes de desistir do lote.'}]},{nome:'Frutificação',icon:'🍄',cor:'#22C55E',etapas:[{icon:'❄️',titulo:'Indução da frutificação',desc:'Reduza a temperatura e aumente a luz indireta e a ventilação pra estimular o surgimento dos cogumelos.',dicas:['O choque térmico varia por espécie','Ventilação é essencial nessa fase','Os primeiros cogumelos aparecem em poucos dias'],sub:['Temperatura reduzida','Luz indireta ajustada','Ventilação aumentada'],mais:'Essa fase é a mais visualmente satisfatória. Em poucos dias aparecem os primeiros "pinos". Ventilação fraca nessa hora deixa os cogumelos com pé longo e chapéu pequeno, sinal de baixo oxigênio no ambiente.'},{icon:'🍄',titulo:`Colheita de ${cultura.nome}`,desc:'Colha no ponto certo de maturação, torcendo e puxando suavemente a base.',dicas:['Colha de manhã, antes do calor','Não use faca suja de outro lote','O mesmo bloco pode dar 2-3 floradas'],sub:['Cogumelos no ponto certo','Colheita realizada','Nova florada monitorada'],mais:'Corte ou torça rente à base pra não deixar resto que pode mofar e contaminar a próxima florada do mesmo bloco. Um bloco bem cuidado costuma dar 2 a 3 floradas antes de esgotar.'}]},{nome:'Comercialização',icon:'💰',cor:'#E84855',etapas:[{icon:'📦',titulo:'Embalagem e conservação',desc:'Cogumelos são muito perecíveis. Refrigere e embale logo após a colheita.',dicas:['Refrigeração entre 2-8°C','Embalagens perfuradas evitam mofo','Venda em até 5-7 dias após colher'],sub:['Refrigeração pronta (2-8°C)','Embalagem perfurada preparada','Cogumelos embalados'],mais:'Cogumelo perde água e murcha rápido fora da geladeira. Refrigere em até 2h após colher pra ter a máxima vida de prateleira. Embalagem fechada sem furos acumula umidade e mofa mais rápido, ao contrário do que parece.'},{icon:'💰',titulo:'Comercialização',desc:'Venda direta a restaurantes e feiras gourmet paga bem mais que o atacado.',dicas:['Restaurantes pagam premium por frescor','Fotos em redes sociais ajudam a vender direto','Fidelize compradores recorrentes'],sub:['Canal de venda escolhido','Primeira venda realizada','Clientes recorrentes identificados'],mais:'Restaurantes valorizam frescor e regularidade mais do que preço baixo. Combine entregas semanais fixas com 2-3 clientes fiéis antes de tentar vender pra muitos ao mesmo tempo.'}]}];}
function construirFasesApicultura(cultura){return[{nome:"Instalação do Apiário",icon:"📍",cor:"#F59E0B",etapas:[{icon:"📋",titulo:"Escolha do local e licenciamento",desc:"Escolha um local com floradas próximas, água limpa e distância segura de vizinhos e animais.",dicas:["Mínimo 300m de residências", "Verifique legislação municipal", "Sombra parcial ajuda no verão"],sub:["Local escolhido e avaliado", "Distância de vizinhos verificada", "Licença/registro consultado"],mais:"Órgãos estaduais de agricultura costumam exigir registro do apicultor e do apiário. Bacias hidrográficas e áreas de proteção ambiental podem ter restrições. Vale confirmar antes de instalar. Água limpa próxima (rio, açude) é essencial pras abelhas, que precisam beber bastante no calor."},{icon:"🏗️",titulo:"Montagem das colmeias",desc:"Monte as caixas (Langstroth é o modelo mais comum no Brasil) em suportes elevados, protegidas do sol direto e da chuva.",dicas:["Suportes evitam formigas", "Espace 1-1.5m entre colmeias", "Vire a entrada pro sol da manhã"],sub:["Caixas montadas", "Suportes instalados", "Colmeias posicionadas no apiário"],mais:"Colmeias muito próximas umas das outras confundem as abelhas na volta pro ninho, aumentando perda de operárias. Pintar as caixas com cores diferentes ajuda as abelhas a identificarem a própria colmeia."}]},{nome:"Aquisição das Colônias",icon:"🐝",cor:"#EAB308",etapas:[{icon:"📦",titulo:"Compra ou captura de enxames",desc:"Compre enxames de apicultores registrados ou capture enxames migratórios com caixas-isca.",dicas:["Prefira colônias já estabelecidas", "Evite enxames muito agressivos", "Caixa-isca é opção de baixo custo"],sub:["Fornecedor ou método definido", "Enxames adquiridos", "Transporte realizado com segurança"],mais:"Comprar de apicultor registrado garante rastreabilidade sanitária e reduz risco de doenças na colônia. Captura com caixa-isca é gratuita mas mais lenta e imprevisível. Funciona melhor na época de enxameação, geralmente na primavera."},{icon:"👑",titulo:"Introdução da rainha",desc:"Confirme que a colônia tem rainha ativa e postura regular antes de considerar a instalação concluída.",dicas:["Postura regular = colônia saudável", "Rainha ausente exige reposição rápida", "Não abra a colmeia toda semana"],sub:["Presença da rainha confirmada", "Postura de ovos observada", "Colônia estabilizada"],mais:"Sem rainha, a colônia entra em declínio rápido. Operárias não conseguem criar novas rainhas sem ovos ou larvas jovens disponíveis. Se notar ausência de postura por mais de 1 semana, providencie uma rainha nova o quanto antes."}]},{nome:"Manejo das Abelhas",icon:"🔍",cor:"#3B82F6",etapas:[{icon:"🔎",titulo:"Inspeções periódicas",desc:"Inspecione a cada 7-15 dias, verificando postura, reservas de mel e sinais de doenças ou pragas.",dicas:["Use roupa de proteção completa", "Trabalhe em dia ameno, sem vento forte", "Fumaça calma as abelhas antes de abrir"],sub:["Rotina de inspeção definida", "Primeira inspeção completa feita", "Sinais de saúde registrados"],mais:"Abrir a colmeia em excesso estressa a colônia e reduz produção. Ácaro Varroa e traça-de-cera são os problemas mais comuns no Brasil. Identificar cedo evita perder a colônia inteira."},{icon:"🍯",titulo:"Alimentação suplementar (entressafra)",desc:"Em períodos sem florada, ofereça xarope de água e açúcar pra manter a colônia forte.",dicas:["Proporção 1:1 água e açúcar", "Nunca use mel de outra colônia (risco de doença)", "Retire o alimentador na floração"],sub:["Período de entressafra identificado", "Alimentador instalado", "Colônia mantida forte na entressafra"],mais:"Xarope substitui o néctar quando não há floração suficiente, evitando que a colônia enfraqueça ou desista do local. Nunca alimente com mel de origem desconhecida. É a forma mais comum de espalhar doenças entre colônias."}]},{nome:"Floração e Produção",icon:"🌼",cor:"#22C55E",etapas:[{icon:"📅",titulo:"Acompanhar floradas da região",desc:"Conheça o calendário de floração das plantas ao redor. É isso que determina quando vai ter mel.",dicas:["Eucalipto, silvestre e laranjeira são comuns no Brasil", "Floradas variam por região e ano", "Abelha voa até 3km em busca de néctar"],sub:["Floradas da região mapeadas", "Época de maior produção identificada", "Plano de manejo por estação feito"],mais:"Produtores experientes movem colmeias entre regiões (apicultura migratória) pra acompanhar floradas diferentes ao longo do ano, maximizando produção. Pra quem está começando, vale focar numa florada forte e regular perto de casa."},{icon:"📦",titulo:"Instalar melgueiras (supers)",desc:"Quando a colônia estiver forte e a florada ativa, adicione a melgueira. Caixa extra só pra armazenar mel.",dicas:["Adicione com a colônia já forte", "Espaço extra evita enxameação", "Retire melgueira cheia pra colher"],sub:["Colônia avaliada como forte", "Melgueira instalada no momento certo", "Enchimento da melgueira monitorado"],mais:"A melgueira fica separada do ninho principal por uma tela excluidora, que impede a rainha de subir e pôr ovos ali. Assim os quadros de cima ficam só com mel puro, prontos pra colheita."}]},{nome:"Colheita e Comercialização",icon:"💰",cor:"#E84855",etapas:[{icon:"🍯",titulo:"Colheita do mel",desc:"Colha quadros com pelo menos 70-80% operculados (fechados com cera), sinal de mel maduro.",dicas:["Mel imaturo fermenta mais rápido", "Use fumigador com calma", "Deixe reservas suficientes pra colônia"],sub:["Quadros operculados identificados", "Colheita realizada", "Reserva mínima deixada pra colônia"],mais:"Mel colhido cedo demais, pouco operculado, tem mais água e fermenta na embalagem. Um dos erros mais comuns de quem começa. Sempre deixe pelo menos um quadro com mel/pólen pra colônia sobreviver até a próxima florada."},{icon:"🏷️",titulo:"Envase e venda",desc:"Filtre, envase em vidro ou plástico atóxico, rotule com informações claras e venda direto ou pra distribuidores.",dicas:["Rotulagem exige informações do produtor", "Venda direta paga mais que atravessador", "Selo de inspeção valoriza o produto"],sub:["Mel filtrado e envasado", "Rótulo com informações do produtor", "Primeira venda realizada"],mais:"Registro no órgão estadual de inspeção abre porta pra vender em mercados e feiras formais, não só de porta em porta. Própolis, geleia real e pólen são subprodutos que agregam receita extra à mesma colônia."}]}];}
function construirFasesHidroponia(cultura){return[{nome:"Planejamento",icon:"📋",cor:"#3B82F6",etapas:[{icon:"🔧",titulo:"Escolher sistema e cultura",desc:"Decida o sistema (NFT, MFT ou vasos com substrato) de acordo com a cultura e o espaço disponível.",dicas:["NFT é o mais usado pra folhosas", "MFT tolera falta de energia melhor", "Compare o retorno na calculadora"],sub:["Sistema escolhido", "Espaço/local definido", "Cultura e variedade confirmados"],mais:"NFT (Nutrient Film Technique) usa uma lâmina fina de solução circulando nas calhas. Mais produtivo, mas depende de energia constante (uma falha de bomba de algumas horas pode matar as raízes). MFT armazena mais solução e perdoa falhas breves de energia, sendo mais indicado pra quem está começando."},{icon:"💰",titulo:"Levantar capital",desc:"Sistemas hidropônicos têm custo inicial mais alto que solo, mas o ciclo mais rápido costuma compensar.",dicas:["Estrutura dura vários anos", "Considere custo de energia elétrica", "Comece pequeno pra validar o sistema"],sub:["Orçamento total calculado", "Fonte de recurso definida", "Reserva de emergência separada"],mais:"O maior custo inicial vem da estrutura (calhas, bombas, reservatório), que costuma durar vários anos com manutenção simples. Já o custo recorrente maior é energia elétrica, já que a bomba fica ligada boa parte do dia."}]},{nome:"Preparo do Sistema",icon:"🏗️",cor:"#F97316",etapas:[{icon:"🔨",titulo:"Montagem das calhas ou vasos",desc:"Monte as calhas/perfis com leve inclinação (2-3%) pra garantir o retorno da solução por gravidade.",dicas:["Inclinação errada acumula água em excesso", "Use material atóxico (PVC próprio)", "Proteja contra luz direta nas calhas"],sub:["Estrutura montada", "Inclinação verificada", "Calhas/vasos posicionados"],mais:"Luz entrando nas calhas favorece o crescimento de algas na solução, que competem por oxigênio e podem entupir o sistema. Calhas opacas ou cobertura bloqueiam a luz e evitam esse problema comum em sistemas caseiros."},{icon:"⚙️",titulo:"Instalação de bombeamento e reservatório",desc:"Instale a bomba, o reservatório de solução e a tubulação de retorno.",dicas:["Reservatório fora de luz direta", "Bomba com potência adequada ao sistema", "Tenha um plano B pra quedas de energia"],sub:["Reservatório instalado", "Bomba testada e funcionando", "Retorno de solução verificado"],mais:"Uma queda de energia prolongada pode secar as raízes em sistemas NFT em poucas horas, já que não há reserva de solução nas calhas. Um pequeno gerador ou nobreak pra bomba é um investimento que vale considerar."}]},{nome:"Plantio",icon:"🌱",cor:"#22C55E",etapas:[{icon:"🌾",titulo:"Semeadura em substrato inerte",desc:"Semeie em espuma fenólica ou fibra de coco. Substratos que só sustentam a planta, sem fornecer nutrientes.",dicas:["Espuma fenólica é a mais usada no Brasil", "Mantenha umidade constante na germinação", "Luz indireta até germinar"],sub:["Substrato inerte preparado", "Semeadura realizada", "Germinação iniciada"],mais:"Substrato inerte (sem nutrientes) é essencial na hidroponia. A planta recebe 100% da alimentação pela solução nutritiva, não pelo substrato. Isso dá controle total sobre o que a planta recebe, mas também exige que a solução esteja sempre correta."},{icon:"🌿",titulo:"Transplante para o sistema",desc:"Transfira as mudas pro sistema definitivo quando tiverem raízes bem desenvolvidas, geralmente 10-15 dias após a semeadura.",dicas:["Raiz fraca demora mais pra pegar", "Espace conforme a cultura escolhida", "Registre a data do transplante"],sub:["Mudas com raiz desenvolvida", "Transplante realizado", "Data registrada no Calendário"],mais:"Transplantar cedo demais (raiz pouco desenvolvida) aumenta a taxa de perda de mudas no sistema definitivo. Vale esperar as raízes brancas saírem visivelmente do substrato antes de mudar de lugar."}]},{nome:"Manejo da Solução Nutritiva",icon:"⚗️",cor:"#65A30D",etapas:[{icon:"⚡",titulo:"Preparo e monitoramento de EC/pH",desc:"Prepare a solução com os sais nutritivos corretos e monitore EC (condutividade) e pH diariamente.",dicas:["pH ideal geralmente 5.5–6.5", "EC varia por fase de crescimento", "Use medidor digital (caneta EC/pH)"],sub:["Solução nutritiva preparada", "EC e pH medidos e ajustados", "Rotina diária de monitoramento definida"],mais:"EC (condutividade elétrica) indica a concentração de nutrientes dissolvidos. Muito alta prejudica a planta, muito baixa deixa faltando nutriente. pH fora da faixa trava a absorção de nutrientes mesmo que eles estejam na solução, do mesmo jeito que acontece no solo."},{icon:"🔄",titulo:"Troca periódica da solução",desc:"Troque a solução completa a cada 10-15 dias, mesmo mantendo os níveis de EC/pH corretos no dia a dia.",dicas:["Solução velha acumula sais desequilibrados", "Limpe o reservatório na troca", "Nunca deixe faltar solução no sistema"],sub:["Frequência de troca definida", "Primeira troca completa realizada", "Reservatório limpo na troca"],mais:"Mesmo corrigindo EC e pH diariamente, alguns sais se acumulam de forma desequilibrada na solução com o tempo, o que só se resolve trocando tudo. Aproveite a troca pra limpar o reservatório e evitar acúmulo de biofilme."}]},{nome:"Colheita e Comercialização",icon:"💰",cor:"#E84855",etapas:[{icon:"🥬",titulo:"Colheita",desc:"Colha no ponto ideal. Hidroponia costuma antecipar a colheita comparado ao cultivo em solo, pelo crescimento mais rápido.",dicas:["Corte pela manhã, mais fresco", "Sistema permite colheita contínua em alguns casos", "Higienize bem antes de embalar"],sub:["Ponto de colheita identificado", "Colheita realizada", "Produto higienizado"],mais:"Um dos maiores atrativos da hidroponia é o ciclo mais curto e a produtividade por m² maior que no solo, o que ajuda a compensar o investimento inicial mais alto no sistema. Produto hidropônico costuma ser vendido como diferencial de limpeza e frescor."},{icon:"💰",titulo:"Venda direta",desc:"Destaque a origem hidropônica na venda. Muitos consumidores pagam mais por isso, associando à limpeza e ausência de terra.",dicas:["Embalagem com raiz ainda presa dura mais", "Feiras e mercados valorizam o diferencial", "Fidelize clientes com entrega regular"],sub:["Canal de venda escolhido", "Diferencial hidropônico destacado na venda", "Primeira venda realizada"],mais:"Vender com a raiz presa (alface em vaso, por exemplo) prolonga a vida útil do produto na gôndola ou na casa do cliente, um diferencial forte da hidroponia sobre o cultivo tradicional."}]}];}
function construirFases(cultura,organico){if(cultura.tipoCultivo==='cogumelo')return construirFasesCogumelo(cultura);if(cultura.tipoCultivo==='apicultura')return construirFasesApicultura(cultura);if(cultura.tipoCultivo==='hidroponia')return construirFasesHidroponia(cultura);const fasesBase=[{nome:'Planejamento',icon:'📋',cor:'#3B82F6',etapas:[{icon:'📐',titulo:'Definir área e variedade',desc:'Decida a área e a variedade (cultivar) adequada ao seu clima e mercado.',dicas:['Compare variedades','Comece pequeno','Use a calculadora'],sub:['Área medida e confirmada','Variedade escolhida','Comprador/mercado identificado'],mais:'Antes de decidir, rode a calculadora com 2-3 variedades diferentes e compare o lucro projetado. Pense também se você já tem comprador garantido ou vai vender no mercado aberto. Isso muda a estratégia de venda depois. Culturas de ciclo curto dão retorno mais rápido, mas normalmente com margem menor por safra.'},{icon:'💰',titulo:'Levantar capital',desc:`Custo estimado: ${fmt(cultura.custImpl)}/ha.`,dicas:['PRONAF: juros 3–6% a.a.','Reserve 20% de contingência','Planeje fluxo de caixa'],sub:['Orçamento total calculado','Fonte de recurso definida','Reserva de emergência separada'],mais:'PRONAF é a linha mais acessível pra pequeno produtor, com juros bem menores que banco comum. Documentos geralmente incluem CPF, comprovante de propriedade/posse da terra e um plano simples do que vai plantar. Procure o Banco do Brasil ou uma cooperativa de crédito da sua região.'}]},{nome:'Preparo do Solo',icon:'🌍',cor:'#F97316',etapas:[{icon:'🧪',titulo:'Análise e correção',desc:'pH ideal varia. Aplique calcário 30–60 dias antes de plantar.',dicas:['Análise: R$ 30–50','Corrija boro e zinco','pH define produtividade'],sub:['Amostra de solo coletada','Laudo da análise recebido','Correção aplicada'],mais:'Colete a amostra de vários pontos da área (não só um canto) e misture antes de enviar. Isso representa melhor o solo todo. Aplique o calcário com antecedência, porque ele reage devagar com o solo; jogar na hora do plantio não corrige a tempo.'},{icon:'🚜',titulo:'Preparo mecânico',desc:'Aração profunda, subsolagem e gradagem.',dicas:['Subsolagem rompe compactação','Drene áreas úmidas','Prepare com 60 dias'],sub:['Área limpa e nivelada','Drenagem verificada','Aração/gradagem concluída'],mais:'Solo compactado (comum em área que já foi pasto) trava o crescimento das raízes. Subsolagem rompe essa camada dura no fundo. Evite preparar o solo em dia de chuva ou solo muito encharcado. Isso compacta ainda mais em vez de ajudar.'}]},{nome:'Plantio',icon:'🌱',cor:'#22C55E',etapas:[{icon:'🌿',titulo:'Mudas certificadas',desc:'Use material certificado pelo MAPA.',dicas:['Nunca sem certificação','Compre 10% a mais','Armazene adequadamente'],sub:['Fornecedor certificado escolhido','Mudas/sementes compradas','Material armazenado corretamente'],mais:'Compre um pouco além do necessário pra cobrir o replantio de falhas, que é normal acontecer. Guarde nota fiscal e etiqueta do lote. É sua garantia caso apareça algum problema genético ou de doença mais adiante.'},{icon:'🌾',titulo:`Plantio de ${cultura.nome}`,desc:'Siga espaçamento e época ideal.',dicas:['Irrigue imediatamente','Replante falhas em 7 dias','Registre a data'],sub:['Espaçamento definido','Plantio realizado','Irrigação inicial feita'],mais:'Regue logo depois do plantio mesmo se for chover. A muda precisa de contato firme com a terra, e a água ajuda a acomodar o solo em volta da raiz. Marque a data exata no Calendário; isso ajuda a prever a colheita depois.'}]},{nome:'Crescimento',icon:'🌿',cor:'#65A30D',etapas:[{icon:'🧬',titulo:'Adubação',desc:'Aplique NPK conforme análise foliar.',dicas:['Análise foliar a cada 45 dias','Fertirrigação é eficiente','Sem exagero em nitrogênio'],sub:['Análise foliar feita','Plano de adubação definido','Primeira aplicação realizada'],mais:'Análise foliar (da folha, não do solo) mostra o que a planta está realmente absorvendo, complementando a análise de solo. Nitrogêni esOrg[1].etapas[0].dicas=['Análise: R$ 30–50','Corrija com calcário e insumos permitidos no orgânico','pH define produtividade'];fasesOrg[3].etapas[0].titulo='Adubação orgânica';fasesOrg[3].etapas[0].desc='Use compostagem, adubação verde e esterco curtido. Sem fertilizante sintético.';fasesOrg[3].etapas[0].dicas=['Compostagem própria reduz custo','Adubação verde melhora o solo a longo prazo','Nunca use esterco fresco (queima a planta)'];fasesOrg[3].etapas[0].sub=['Fonte de matéria orgânica definida','Compostagem ou adubo orgânico preparado','Primeira aplicação realizada'];fasesOrg[3].etapas[0].mais='Compostagem caseira (restos vegetais, esterco curtido) reduz o custo de adubação com o tempo, mas exige planejamento. Leva de 60 a 90 dias pra ficar pronta. Adubação verde (plantar leguminosas pra depois incorporar ao solo) enriquece o solo naturalmente com nitrogênio.';fasesOrg[3].etapas[1].titulo='Controle biológico de pragas';fasesOrg[3].etapas[1].desc='Use inimigos naturais, armadilhas e extratos vegetais. Sem defensivo sintético.';fasesOrg[3].etapas[1].dicas=['MIP orgânico é ainda mais importante aqui','Calda de fumo e nim são opções naturais','Insetos benéficos ajudam a controlar pragas'];fasesOrg[3].etapas[1].sub=['Método de controle biológico escolhido','Monitoramento semanal iniciado','Primeiro tratamento natural aplicado'];fasesOrg[3].etapas[1].mais='Sem defensivo sintético, a prevenção pesa ainda mais: rotação de cultura, plantas repelentes ao lado e monitoramento frequente evitam que a praga vire um problema grande. Nim e calda de fumo são alternativas naturais amplamente usadas.';fasesOrg[4].etapas[1].dicas=['Selo orgânico valoriza o produto','WhatsApp gratuito','Fidelize clientes que valorizam produção sem agrotóxico'];fasesOrg[4].etapas[1].mais='O selo orgânico (SISORG ou selo de sistema participativo) é o principal argumento de venda. Deixe visível na embalagem e conte a história do seu cultivo pro cliente, isso justifica o preço mais alto.';return fasesOrg;}
function calcularEtapasComData(cultura,dataInicioStr){const fases=construirFases(cultura);const cicloDias=Math.round(cultura.ciclo*30);const fracoes=[0,0.03,0.10,0.20,0.25,0.30,0.55,0.75,1.0,1.05];let idx=0;const lista=[];fases.forEach(fase=>{fase.etapas.forEach((et,i)=>{const offset=Math.round(fracoes[idx]*cicloDias);const data=new Date(dataInicioStr+'T12:00');data.setDate(data.getDate()+offset);lista.push({id:`etapa-${idx}`,titulo:et.titulo,icon:et.icon,faseNome:fase.nome,faseCor:fase.cor,data,dataISO:data.toISOString().slice(0,10)});idx++;});});return lista;}
function PlanoScreen({cultura,regiao,userId,onProgresso,onAbrirNotas}){const[organico,setOrganico]=useState(false);const fases=construirFases(cultura,organico);const[progresso,setProgresso]=useState({});const[carregando,setCarregando]=useState(true);const[dataInicio,setDataInicio]=useState(null);const[carregandoData,setCarregandoData]=useState(true);const[dataTemp,setDataTemp]=useState(()=>new Date().toISOString().slice(0,10));const[subChecks,setSubChecks]=useState({});const[maisAberto,setMaisAberto]=useState({});useEffect(()=>{if(!userId){setCarregando(false);return;}sb.from('plano_progresso').select('etapa_id,feito,feito_em').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).then(({data})=>{const m={};(data||[]).forEach(r=>{m[r.etapa_id]={feito:r.feito,feito_em:r.feito_em};});setProgresso(m);setCarregando(false);});},[userId,cultura.nome]);useEffect(()=>{if(!userId){setCarregandoData(false);return;}sb.from('planos_inicio').select('data_inicio,organico').eq('usuario_id',userId).eq('cultura_nome',cultura.nome).maybeSingle().then(({data})=>{if(data){setDataInicio(data.data_inicio);setOrganico(data.organico===true);}setCarregandoData(false);});},[userId,cultura.nome]);async function confirmarDataInicio(){setDataInicio(dataTemp);if(userId){await sb.from('planos_inicio').upsert({usuario_id:userId,cultura_nome:cultura.nome,data_inicio:dataTemp,ciclo_meses:cultura.ciclo,organico},{onConflict:'usuario_id,cultura_nome'});}}async function alternarOrganico(){const novo=!organico;setOrganico(novo);if(userId&&dataInicio){await sb.from('planos_inicio').update({organico:novo}).eq('usuario_id',userId).eq('cultura_nome',cultura.nome);}}const etapasComData=dataInicio?calcularEtapasComData(cultura,dataInicio):null;const dataPorId=etapasComData?Object.fromEntries(etapasComData.map(e=>[e.id,e])):{};const hojeISO=new Date().toISOString().slice(0,10);async function marcar(id){const nf=!(progresso[id]?.feito||false);setProgresso(prev=>({...prev,[id]:{feito:nf,feito_em:nf?new Date(). function formatarLinhaInline(linha,key){const partes=linha.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);return partes.map((p,i)=>{if(p.startsWith('**')&&p.endsWith('**')){return<b key={key+'-'+i} style={{fontWeight:800,color:'#15803D'}}>{p.slice(2,-2)}</b>;}return<span key={key+'-'+i}>{p}</span>;});}
function formatarMensagem(texto){if(!texto)return null;const linhas=texto.split('\n');const blocos=[];let listaAtual=null;linhas.forEach((linha,i)=>{const trim=linha.trim();const ehBullet=/^[-•*]\s+/.test(trim);const ehTitulo=/^\*\*[^*]+\*\*:?$/.test(trim)||/^#{1,3}\s+/.test(trim);if(ehBullet){const item=trim.replace(/^[-•*]\s+/,'');if(!listaAtual){listaAtual=[];blocos.push({tipo:'lista',itens:listaAtual});}listaAtual.push(item);}else{listaAtual=null;if(trim===''){blocos.push({tipo:'espaco'});}else if(ehTitulo){blocos.push({tipo:'titulo',texto:trim.replace(/^\*\*|\*\*:?$/g,'').replace(/^#{1,3}\s+/,'')});}else{blocos.push({tipo:'paragrafo',texto:trim});}}});return blocos.map((b,i)=>{if(b.tipo==='espaco')return<div key={i} style={{height:8}} />;if(b.tipo==='titulo')return<div key={i} style={{fontWeight:800,fontSize:15.5,color:'#15803D',marginTop:i>0?10:0,marginBottom:4}}>{b.texto}</div>;if(b.tipo==='lista')return<ul key={i} style={{margin:'4px 0 8px',paddingLeft:0,listStyle:'none'}}>{b.itens.map((item,ii)=>(<li key={ii} style={{display:'flex',gap:8,marginBottom:5}}><span style={{color:'#4ADE80',fontWeight:800,flexShrink:0}}>●</span><span>{formatarLinhaInline(item,i+'-'+ii)}</span></li>))}</ul>;return<div key={i} style={{marginBottom:6}}>{formatarLinhaInline(b.texto,i)}</div>;});}
